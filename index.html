<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mortal Kombat - Gift Battle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Impact', 'Segoe UI', Arial, sans-serif;
    }

    body {
      background-color: #08060c;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
    }

    .secret-hint {
      font-family: sans-serif;
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
      text-align: center;
    }

    .secret-hint span {
      background: #222;
      color: #00ffcc;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    /* 16:9 Arena Container */
    .arena-wrapper {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      position: relative;
      border: 3px solid #2a1f3d;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(176, 38, 255, 0.3);
      background: #000;
    }

    /* Hit & Brutality Animations */
    .arena-hit {
      animation: screenShake 0.3s cubic-bezier(.36,.07,.19,.97) both;
    }
    
    .arena-brutality {
      animation: brutalShake 0.6s cubic-bezier(.36,.07,.19,.97) both;
      filter: sepia(0.8) hue-rotate(-30deg) saturate(3) contrast(1.2);
    }

    @keyframes screenShake {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-8px, 5px); }
      40% { transform: translate(8px, -5px); }
      60% { transform: translate(-4px, 2px); }
      80% { transform: translate(4px, -2px); }
      100% { transform: translate(0, 0); }
    }

    @keyframes brutalShake {
      0% { transform: translate(0, 0) scale(1); }
      10% { transform: translate(-15px, 10px) scale(1.05); }
      20% { transform: translate(15px, -10px) scale(1.05); }
      30% { transform: translate(-15px, -10px) scale(1.05); }
      40% { transform: translate(15px, 10px) scale(1.05); }
      50% { transform: translate(-10px, 5px) scale(1.02); }
      70% { transform: translate(10px, -5px) scale(1.01); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* Dynamic Split Backgrounds */
    .bg-split {
      position: absolute;
      top: 0;
      bottom: 0;
      background-size: cover;
      background-position: center;
      transition: width 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .bg-girls {
      left: 0;
      width: 50%;
      background-color: #4a1942; /* Fallback if image missing */
      background-image: url('girls.jpg');
      border-right: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 5px 0 20px rgba(176, 38, 255, 0.8);
      z-index: 2;
    }

    .bg-boys {
      right: 0;
      width: 50%;
      background-color: #193a4a; /* Fallback if image missing */
      background-image: url('boys.jpg');
      border-left: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: -5px 0 20px rgba(0, 210, 255, 0.8);
      z-index: 1;
    }

    /* Moving Center Divider */
    .center-divider {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 6px;
      background: #ffffff;
      transform: translateX(-50%);
      box-shadow: 0 0 15px #fff, 0 0 30px #b026ff, 0 0 45px #00d2ff;
      z-index: 5;
      transition: left 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Top HUD / Video Style Scoreboards */
    .hud-top {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .team-score-box {
      display: flex;
      align-items: stretch;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.6);
      background: #111;
    }

    .score-number {
      font-size: 32px;
      color: #fff;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 70px;
    }

    .team-name {
      font-size: 24px;
      color: #fff;
      padding: 8px 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 2px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    }

    .team-girls .team-name {
      background: linear-gradient(135deg, #ff1e56, #d800ff);
    }

    .team-boys .team-name {
      background: linear-gradient(135deg, #0066ff, #00d2ff);
    }

    /* Stickman Avatars */
    .avatar {
      position: absolute;
      bottom: 25px;
      width: 70px;
      height: 110px;
      z-index: 6;
      transition: transform 0.1s;
    }
    .avatar-left { left: 15%; }
    .avatar-right { right: 15%; }

    /* Floating Attack Announcement */
    .announcement {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      font-size: 42px;
      font-weight: 900;
      text-transform: uppercase;
      text-align: center;
      letter-spacing: 3px;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      white-space: nowrap;
    }

    .announcement.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.1);
    }

    .annct-girls { color: #fff; text-shadow: 0 0 10px #d800ff, 0 0 20px #d800ff, 4px 4px 0px #000; }
    .annct-boys { color: #fff; text-shadow: 0 0 10px #0066ff, 0 0 20px #0066ff, 4px 4px 0px #000; }

    /* Action Feed Log */
    .action-feed {
      position: absolute;
      bottom: 20px;
      left: 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 15;
      pointer-events: none;
    }

    .feed-item {
      background: rgba(0, 0, 0, 0.65);
      border-left: 3px solid #d800ff;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 13px;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Controls Panel */
    .controls-panel {
      width: 100%;
      max-width: 960px;
      margin-top: 15px;
      background: #120e1a;
      border: 1px solid #2e2440;
      border-radius: 10px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
      transition: opacity 0.3s, transform 0.3s;
    }

    .controls-panel.hidden { display: none !important; }
    .button-group { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; letter-spacing: 1px; transition: all 0.15s ease; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); }
    .btn:active { transform: scale(0.95); }

    .btn-girl-hit { background: #8a1ca6; color: #fff; }
    .btn-girl-hit:hover { background: #a624c7; }
    .btn-girl-brutal { background: linear-gradient(135deg, #d800ff, #6200ea); color: #fff; border: 1px solid #ff88ff; }
    .btn-boy-hit { background: #005bb5; color: #fff; }
    .btn-boy-hit:hover { background: #0066cc; }
    .btn-boy-brutal { background: linear-gradient(135deg, #0066ff, #0022cc); color: #fff; border: 1px solid #44aaff; }
    .btn-util { background: #251d33; color: #ccc; border: 1px solid #44355e; }
    .btn-util:hover { background: #362a4a; color: #fff; }

    /* Hidden Toggle Settings Button */
    .secret-toggle-btn {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.2);
      font-size: 16px;
      cursor: pointer;
      z-index: 100;
    }
    .secret-toggle-btn:hover { color: rgba(255, 255, 255, 0.8); }
  </style>
</head>
<body>

  <div class="secret-hint">
    Streamer Mode Active: Press <span>H</span> key on your keyboard to <b>Hide / Show</b> controls completely!
  </div>

  <div class="arena-wrapper" id="arena">
    <div class="bg-split bg-girls" id="bg-girls"></div>
    <div class="bg-split bg-boys" id="bg-boys"></div>
    <div class="center-divider" id="center-line"></div>

    <div class="hud-top">
      <!-- Girls Scoreboard (Like Video) -->
      <div class="team-score-box team-girls">
        <span class="score-number" id="girl-wins">0</span>
        <span class="team-name">GIRLS</span>
      </div>

      <!-- Boys Scoreboard (Like Video) -->
      <div class="team-score-box team-boys">
        <span class="team-name">BOYS</span>
        <span class="score-number" id="boy-wins">0</span>
      </div>
    </div>

    <!-- Stickman Avatars -->
    <svg class="avatar avatar-left" viewBox="0 0 100 160" id="avatar-girl">
      <circle cx="50" cy="30" r="18" fill="#d800ff" />
      <line x1="50" y1="48" x2="50" y2="100" stroke="#d800ff" stroke-width="8" stroke-linecap="round" />
      <line x1="50" y1="65" x2="20" y2="90" stroke="#d800ff" stroke-width="7" stroke-linecap="round" />
      <line x1="50" y1="65" x2="80" y2="90" stroke="#d800ff" stroke-width="7" stroke-linecap="round" />
      <line x1="50" y1="100" x2="25" y2="150" stroke="#d800ff" stroke-width="7" stroke-linecap="round" />
      <line x1="50" y1="100" x2="75" y2="150" stroke="#d800ff" stroke-width="7" stroke-linecap="round" />
    </svg>

    <svg class="avatar avatar-right" viewBox="0 0 100 160" id="avatar-boy">
      <circle cx="50" cy="30" r="18" fill="#0066ff" />
      <line x1="50" y1="48" x2="50" y2="100" stroke="#0066ff" stroke-width="8" stroke-linecap="round" />
      <line x1="50" y1="65" x2="20" y2="90" stroke="#0066ff" stroke-width="7" stroke-linecap="round" />
      <line x1="50" y1="65" x2="80" y2="90" stroke="#0066ff" stroke-width="7" stroke-linecap="round" />
      <line x1="50" y1="100" x2="25" y2="150" stroke="#0066ff" stroke-width="7" stroke-linecap="round" />
      <line x1="50" y1="100" x2="75" y2="150" stroke="#0066ff" stroke-width="7" stroke-linecap="round" />
    </svg>

    <div class="announcement" id="announcement-text"></div>
    <div class="action-feed" id="action-feed"></div>

    <button class="secret-toggle-btn" onclick="toggleControls()" title="Toggle Settings Controls">⚙</button>
  </div>

  <div class="controls-panel" id="controls-panel">
    <div class="button-group">
      <button class="btn btn-girl-hit" onclick="attack('girl', false)">Girls Hit (1)</button>
      <button class="btn btn-girl-brutal" onclick="attack('girl', true)">BRUTALITY! (10)</button>
      <button class="btn btn-boy-hit" onclick="attack('boy', false)">Boys Hit (1)</button>
      <button class="btn btn-boy-brutal" onclick="attack('boy', true)">BRUTALITY! (10)</button>
    </div>

    <div class="button-group">
      <button class="btn btn-util" onclick="resetGame()">⚡ Reset Match</button>
      <button class="btn btn-util" onclick="toggleControls()">👁 Hide Controls (Press H)</button>
    </div>
  </div>

  <script>
    // Max Health points equals total hits needed to push the line all the way (20)
    const MAX_HP = 20;
    let girlHP = MAX_HP;
    let boyHP = MAX_HP;
    let girlWins = 0;
    let boyWins = 0;

    const girlMoves = ["SAIS STRIKE!", "TELEPORT KICK!", "BLOOD CLOT!", "DEATH SENTENCE!"];
    const boyMoves = ["ICE BLAST!", "GET OVER HERE!", "SHADOW KICK!", "LIGHTNING!"];

    // Update Visual UI based on current tug-of-war position
    function updateVisuals() {
      // Calculate Center Line Shift
      // Starts at 50%. Shifts right (up to 100%) if Girl is winning. Shifts left (down to 0%) if Boy is winning.
      let centerPercentage = 50 + ((MAX_HP - boyHP) * 2.5) - ((MAX_HP - girlHP) * 2.5);
      
      // Prevent visual bugs if a massive hit goes way past 0 HP
      if (centerPercentage > 100) centerPercentage = 100;
      if (centerPercentage < 0) centerPercentage = 0;

      // Apply the shift to the backgrounds and line
      document.getElementById("bg-girls").style.width = centerPercentage + "%";
      document.getElementById("bg-boys").style.width = (100 - centerPercentage) + "%";
      document.getElementById("center-line").style.left = centerPercentage + "%";
    }

    function triggerAnimation(isBrutality) {
      const arena = document.getElementById("arena");
      // Remove classes to reset animation if clicking fast
      arena.classList.remove("arena-hit", "arena-brutality");
      
      // Force a tiny delay so the browser registers the class removal before adding it back
      setTimeout(() => {
        if (isBrutality) {
          arena.classList.add("arena-brutality");
        } else {
          arena.classList.add("arena-hit");
        }
      }, 10);
    }

    function attack(attacker, isBrutality) {
      const announcement = document.getElementById("announcement-text");
      
      // Normal hit = 1 damage. Brutality = 10 damage.
      let damage = isBrutality ? 10 : 1;
      let moveName = "";

      if (attacker === 'girl') {
        boyHP = Math.max(0, boyHP - damage);
        moveName = isBrutality ? "GIRLS BRUTALITY!" : girlMoves[Math.floor(Math.random() * girlMoves.length)];
        announcement.className = "announcement annct-girls active";
        addFeed("@Admin", "Rose");
        animateAvatar('avatar-girl');
      } else {
        girlHP = Math.max(0, girlHP - damage);
        moveName = isBrutality ? "BOYS BRUTALITY!" : boyMoves[Math.floor(Math.random() * boyMoves.length)];
        announcement.className = "announcement annct-boys active";
        addFeed("@Admin", "TikTok");
        animateAvatar('avatar-boy');
      }

      // Update tug-of-war position
      updateVisuals();
      triggerAnimation(isBrutality);

      // Show Text
      announcement.innerText = moveName;
      setTimeout(() => announcement.classList.remove("active"), 1000);

      // Check Win Condition (If a player is pushed completely off)
      if (girlHP <= 0 || boyHP <= 0) {
        if (girlHP <= 0) {
          boyWins++;
          document.getElementById("boy-wins").innerText = boyWins;
        } else {
          girlWins++;
          document.getElementById("girl-wins").innerText = girlWins;
        }
        
        // Wait longer for the dramatic 'takeover' animation before resetting the line to the middle
        setTimeout(resetMatch, 2500); 
      }
    }

    function animateAvatar(id) {
      const el = document.getElementById(id);
      el.style.transform = "scale(1.2) translateY(-10px)";
      setTimeout(() => el.style.transform = "scale(1) translateY(0)", 200);
    }

    function addFeed(user, gift) {
      const feed = document.getElementById("action-feed");
      const item = document.createElement("div");
      item.className = "feed-item";
      item.innerHTML = `<span style="color:#e855ff; font-weight:bold;">${user}</span> sent <span>${gift}</span>`;
      feed.appendChild(item);
      if (feed.children.length > 4) feed.removeChild(feed.children[0]);
    }

    function resetMatch() {
      girlHP = MAX_HP;
      boyHP = MAX_HP;
      updateVisuals();
    }

    function resetGame() {
      resetMatch();
      girlWins = 0;
      boyWins = 0;
      document.getElementById("girl-wins").innerText = "0";
      document.getElementById("boy-wins").innerText = "0";
    }

    function toggleControls() {
      const panel = document.getElementById("controls-panel");
      panel.classList.toggle("hidden");
    }

    // Keyboard shortcut 'H' hides controls for the streamer
    window.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "h") toggleControls();
    });

    // Initialize layout on load
    updateVisuals();
  </script>
</body>
</html>
