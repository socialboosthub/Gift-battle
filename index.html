<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift Kombat V2</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

body{
    background:#050509;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

#game{
    width:min(1100px,100vw);
    position:relative;
}

/* ================= ARENA ================= */

.arena{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    overflow:hidden;
    background:#090909;
    border:2px solid #333;
    box-shadow:
        0 0 25px #000,
        0 0 60px rgba(255,0,80,.15);
}

.background{
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 50% 45%,#343434 0%,#111 35%,#030303 80%);
}

.background:after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(90deg,
        rgba(255,0,120,.16),
        transparent 45%,
        transparent 55%,
        rgba(0,150,255,.16));
}

/* Floor */

.floor{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:25%;
    background:
        linear-gradient(180deg,transparent,#050505 35%),
        repeating-linear-gradient(
            90deg,
            #161616 0px,
            #161616 45px,
            #101010 46px,
            #101010 90px
        );
    transform:perspective(300px) rotateX(55deg);
    transform-origin:bottom;
}

/* Center */

.center{
    position:absolute;
    top:0;
    bottom:0;
    left:50%;
    width:2px;
    background:rgba(255,255,255,.25);
    box-shadow:0 0 15px white;
    transform:translateX(-50%);
    transition:left .35s ease;
}

/* ================= HUD ================= */

.hud{
    position:absolute;
    top:12px;
    left:15px;
    right:15px;
    z-index:30;
    display:flex;
    justify-content:space-between;
    gap:20px;
}

.playerHud{
    width:42%;
}

.playerName{
    font-size:17px;
    font-weight:900;
    text-shadow:0 2px 5px #000;
    margin-bottom:4px;
}

.playerHud.right{
    text-align:right;
}

.healthOuter{
    height:23px;
    background:#111;
    border:2px solid #ddd;
    box-shadow:0 3px 8px #000;
    position:relative;
    overflow:hidden;
}

.health{
    position:absolute;
    top:0;
    bottom:0;
    width:100%;
    transition:
        width .35s cubic-bezier(.2,.8,.2,1),
        background .2s;
}

.girlHealth{
    left:0;
    background:linear-gradient(90deg,#ff0080,#d800ff);
}

.boyHealth{
    right:0;
    background:linear-gradient(90deg,#008cff,#00d9ff);
}

.hpText{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:bold;
    text-shadow:0 1px 3px #000;
}

.rounds{
    text-align:center;
    width:100px;
}

.roundTitle{
    font-size:11px;
    color:#aaa;
    font-weight:bold;
}

.roundDots{
    display:flex;
    justify-content:center;
    gap:5px;
    margin-top:5px;
}

.roundDot{
    width:12px;
    height:12px;
    border-radius:50%;
    border:1px solid #777;
    background:#222;
}

.roundDot.activeGirl{
    background:#ff00a8;
    box-shadow:0 0 8px #ff00a8;
}

.roundDot.activeBoy{
    background:#00bfff;
    box-shadow:0 0 8px #00bfff;
}

/* ================= FIGHTERS ================= */

.fighter{
    position:absolute;
    bottom:13%;
    width:22%;
    height:65%;
    z-index:15;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    transition:
        left .35s cubic-bezier(.2,.8,.2,1),
        right .35s cubic-bezier(.2,.8,.2,1);
}

.fighter img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    filter:drop-shadow(0 15px 12px rgba(0,0,0,.8));
    transform-origin:center bottom;
}

.girl{
    left:18%;
}

.boy{
    right:18%;
}

.attackGirl img{
    animation:girlAttack .42s ease;
}

.attackBoy img{
    animation:boyAttack .42s ease;
}

.hit img{
    animation:hitReaction .32s ease;
}

.blocking img{
    animation:blockAnim .3s ease;
}

@keyframes girlAttack{
    0%{transform:translateX(0) scale(1)}
    35%{transform:translateX(45px) scale(1.08)}
    65%{transform:translateX(25px) scale(1.12)}
    100%{transform:translateX(0) scale(1)}
}

@keyframes boyAttack{
    0%{transform:translateX(0) scale(1)}
    35%{transform:translateX(-45px) scale(1.08)}
    65%{transform:translateX(-25px) scale(1.12)}
    100%{transform:translateX(0) scale(1)}
}

@keyframes hitReaction{
    0%{transform:translateX(0) rotate(0)}
    25%{transform:translateX(22px) rotate(7deg)}
    55%{transform:translateX(-12px) rotate(-4deg)}
    100%{transform:translateX(0) rotate(0)}
}

@keyframes blockAnim{
    0%{transform:scale(1)}
    50%{transform:scale(.92) translateY(-5px)}
    100%{transform:scale(1)}
}

/* ================= EFFECTS ================= */

#effects{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:25;
}

.impact{
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    border:8px solid white;
    transform:translate(-50%,-50%) scale(.2);
    animation:impact .4s ease-out forwards;
    filter:drop-shadow(0 0 15px white);
}

@keyframes impact{
    0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}
}

.flash{
    position:absolute;
    inset:0;
    background:white;
    opacity:.8;
    animation:flash .16s ease-out forwards;
}

@keyframes flash{
    from{opacity:.8}
    to{opacity:0}
}

.damageText{
    position:absolute;
    font-size:32px;
    font-weight:1000;
    color:#fff;
    text-shadow:
        0 0 8px #ff004c,
        3px 3px 0 #000;
    transform:translate(-50%,-50%);
    animation:damageFloat .8s ease forwards;
}

@keyframes damageFloat{
    0%{
        opacity:1;
        transform:translate(-50%,-50%) scale(.6);
    }
    20%{
        transform:translate(-50%,-70%) scale(1.2);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-140%) scale(1);
    }
}

.combo{
    position:absolute;
    left:50%;
    top:38%;
    transform:translate(-50%,-50%) scale(.5);
    opacity:0;
    font-size:42px;
    font-weight:1000;
    font-style:italic;
    text-transform:uppercase;
    text-shadow:
        0 0 10px #fff,
        0 0 25px #ff0080,
        4px 4px #000;
    z-index:50;
    pointer-events:none;
}

.combo.show{
    animation:comboShow .7s ease forwards;
}

@keyframes comboShow{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.4) rotate(-5deg);
    }
    25%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.15) rotate(2deg);
    }
    70%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(1.05);
    }
}

/* ================= ANNOUNCER ================= */

.announcement{
    position:absolute;
    left:50%;
    top:48%;
    transform:translate(-50%,-50%) scale(.2);
    opacity:0;
    z-index:60;
    font-size:70px;
    font-weight:1000;
    font-style:italic;
    text-align:center;
    text-transform:uppercase;
    white-space:nowrap;
    pointer-events:none;
    text-shadow:
        0 0 15px #fff,
        0 0 35px #ff0080,
        6px 6px 0 #000;
}

.announcement.show{
    animation:announce 1.2s ease forwards;
}

@keyframes announce{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(2);
    }
    18%{
        opacity:1;
        transform:translate(-50%,-50%) scale(.9);
    }
    75%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(1.2);
    }
}

/* ================= GIFT FEED ================= */

.feed{
    position:absolute;
    bottom:12px;
    z-index:40;
    display:flex;
    flex-direction:column;
    gap:5px;
    max-width:32%;
}

.feed.girlFeed{
    left:12px;
}

.feed.boyFeed{
    right:12px;
    align-items:flex-end;
}

.feedItem{
    background:rgba(0,0,0,.72);
    border:1px solid rgba(255,255,255,.15);
    padding:5px 9px;
    border-radius:5px;
    font-size:11px;
    animation:feedIn .25s ease;
}

.feedItem.girlGift{
    border-left:3px solid #ff00a8;
}

.feedItem.boyGift{
    border-right:3px solid #00cfff;
}

@keyframes feedIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ================= TOP LABEL ================= */

.title{
    position:absolute;
    top:43px;
    left:50%;
    transform:translateX(-50%);
    z-index:31;
    font-size:12px;
    font-weight:bold;
    letter-spacing:4px;
    color:#ddd;
}

/* ================= CONTROLS ================= */

.controls{
    margin-top:10px;
    background:#111;
    border:1px solid #333;
    padding:10px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:7px;
}

button{
    border:0;
    padding:9px 13px;
    border-radius:5px;
    color:white;
    background:#252525;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#444;
}

.hideControls{
    position:absolute;
    right:7px;
    bottom:7px;
    z-index:100;
    opacity:.25;
}

/* ================= SCREEN SHAKE ================= */

.shake{
    animation:screenShake .32s ease;
}

.heavyShake{
    animation:heavyShake .6s ease;
}

@keyframes screenShake{
    0%,100%{transform:translate(0)}
    20%{transform:translate(-7px,4px)}
    40%{transform:translate(7px,-4px)}
    60%{transform:translate(-4px,2px)}
    80%{transform:translate(4px,-2px)}
}

@keyframes heavyShake{
    0%,100%{transform:translate(0) scale(1)}
    15%{transform:translate(-14px,8px) scale(1.02)}
    30%{transform:translate(14px,-8px) scale(1.03)}
    45%{transform:translate(-10px,-5px) scale(1.02)}
    60%{transform:translate(10px,5px)}
    75%{transform:translate(-5px,2px)}
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .playerName{
        font-size:11px;
    }

    .healthOuter{
        height:16px;
    }

    .title{
        font-size:8px;
        letter-spacing:2px;
        top:38px;
    }

    .announcement{
        font-size:38px;
    }

    .combo{
        font-size:25px;
    }

    .feedItem{
        font-size:8px;
    }

    .controls button{
        font-size:10px;
        padding:7px 9px;
    }
}

.hidden{
    display:none!important;
}
</style>
</head>

<body>

<div id="game">

<div class="arena" id="arena">

    <div class="background"></div>
    <div class="floor"></div>
    <div class="center" id="center"></div>

    <!-- HUD -->

    <div class="hud">

        <div class="playerHud">

            <div class="playerName" id="girlName">
                KITANA
            </div>

            <div class="healthOuter">

                <div class="health girlHealth" id="girlHealth"></div>

                <div class="hpText" id="girlHpText">
                    100 / 100
                </div>

            </div>

        </div>

        <div class="rounds">

            <div class="roundTitle">
                ROUND
            </div>

            <div class="roundDots">
                <div class="roundDot" id="r1"></div>
                <div class="roundDot" id="r2"></div>
                <div class="roundDot" id="r3"></div>
            </div>

        </div>

        <div class="playerHud right">

            <div class="playerName" id="boyName">
                SUB-ZERO
            </div>

            <div class="healthOuter">

                <div class="health boyHealth" id="boyHealth"></div>

                <div class="hpText" id="boyHpText">
                    100 / 100
                </div>

            </div>

        </div>

    </div>

    <div class="title">
        GIFT KOMBAT
    </div>

    <!-- GIRL -->

    <div class="fighter girl" id="girl">
        <img
            id="girlImage"
            src="kitana_idle.png"
            alt="Girl Fighter">
    </div>

    <!-- BOY -->

    <div class="fighter boy" id="boy">
        <img
            id="boyImage"
            src="subzero_idle.png"
            alt="Boy Fighter">
    </div>

    <div id="effects"></div>

    <div class="combo" id="combo">
        3 HIT COMBO!
    </div>

    <div class="announcement" id="announcement">
        FIGHT!
    </div>

    <!-- FEEDS -->

    <div class="feed girlFeed" id="girlFeed"></div>
    <div class="feed boyFeed" id="boyFeed"></div>

    <button class="hideControls" onclick="toggleControls()">
        ⚙
    </button>

</div>

<!-- TEST CONTROLS -->

<div class="controls" id="controls">

    <button onclick="handleTikTokGift({
        side:'girl',
        username:'TestGirl',
        giftName:'Rose',
        giftId:'rose',
        repeatCount:1
    })">
        🌹 Rose
    </button>

    <button onclick="handleTikTokGift({
        side:'girl',
        username:'TestGirl',
        giftName:'Rosa',
        giftId:'rosa',
        repeatCount:1
    })">
        💥 Rosa
    </button>

    <button onclick="handleTikTokGift({
        side:'boy',
        username:'TestBoy',
        giftName:'TikTok',
        giftId:'tiktok',
        repeatCount:1
    })">
        🎵 TikTok
    </button>

    <button onclick="handleTikTokGift({
        side:'boy',
        username:'TestBoy',
        giftName:'Mind Blown',
        giftId:'mindblown',
        repeatCount:1
    })">
        🤯 Mind Blown
    </button>

    <button onclick="handleTikTokGift({
        side:'girl',
        username:'TestGirl',
        giftName:'Like',
        giftId:'like',
        repeatCount:1
    })">
        ❤️ Like
    </button>

    <button onclick="handleTikTokGift({
        side:'boy',
        username:'TestBoy',
        giftName:'Paper Crane',
        giftId:'papercrane',
        repeatCount:1
    })">
        🪽 Crane
    </button>

    <button onclick="resetGame()">
        🔄 Reset
    </button>

    <button onclick="toggleControls()">
        👁 Hide
    </button>

</div>

</div>

<script>

/* ============================================================
   CHARACTER DATA
============================================================ */

const girlCharacters = [

    {
        name:"KITANA",
        idle:"kitana_idle.png",
        attack:"kitana_attack.png"
    },

    {
        name:"MILEENA",
        idle:"mileena_idle.png",
        attack:"mileena_attack.png"
    },

    {
        name:"JADE",
        idle:"jade_idle.png",
        attack:"jade_attack.png"
    }

];

const boyCharacters = [

    {
        name:"SUB-ZERO",
        idle:"subzero_idle.png",
        attack:"subzero_attack.png"
    },

    {
        name:"SCORPION",
        idle:"scorpion_idle.png",
        attack:"scorpion_attack.png"
    },

    {
        name:"LIU KANG",
        idle:"liukang_idle.png",
        attack:"liukang_attack.png"
    }

];

/* ============================================================
   GAME STATE
============================================================ */

let girlHP = 100;
let boyHP = 100;

let girlRounds = 0;
let boyRounds = 0;

let roundNumber = 1;

let currentGirl = 0;
let currentBoy = 0;

let girlX = 18;
let boyX = 18;

let gameActive = true;

let comboSide = null;
let comboCount = 0;
let comboTimer = null;

let attackQueue = [];
let processing = false;

let lastAttackTime = {
    girl:0,
    boy:0
};

/* ============================================================
   GIFT POWER
============================================================ */
const giftActions = {

    /* GIRLS */

    like:{
        side:"girl",
        damage:1,
        knockback:1,
        type:"normal",
        label:"LIKE ATTACK"
    },

    rose:{
        side:"girl",
        damage:5,
        knockback:3,
        type:"normal",
        label:"ROSE ATTACK"
    },

    rosa:{
        side:"girl",
        damage:15,
        knockback:8,
        type:"special",
        label:"ROSA SPECIAL"
    },


    /* BOYS */

    follow:{
        side:"boy",
        damage:3,
        knockback:2,
        type:"normal",
        label:"FOLLOW ATTACK"
    },

    tiktok:{
        side:"boy",
        damage:5,
        knockback:3,
        type:"normal",
        label:"TIKTOK ATTACK"
    },

    mindblown:{
        side:"boy",
        damage:15,
        knockback:8,
        type:"special",
        label:"MIND BLOWN"
    }

};

/* ============================================================
   TIKTOK GIFT ENTRY POINT
============================================================ */

/*
   Your tiktok-client.js should call:

   handleTikTokGift({
       side:"girl",
       username:"@username",
       giftName:"Rose",
       giftId:"rose",
       repeatCount:1
   });

*/

window.handleTikTokGift = function(data){

    if(!data) return;

    const side = data.side;

    const username =
        data.username ||
        data.uniqueId ||
        data.nickname ||
        "Viewer";

    const giftName =
        data.giftName ||
        data.gift ||
        "";

    const giftId =
        String(
            data.giftId ||
            giftName
        )
        .toLowerCase()
        .replace(/\s+/g,"");

    const repeatCount =
        Math.max(
            1,
            Number(data.repeatCount || 1)
        );

    /*
       Character switching gifts
    */

    if(
        giftId === "likepop" ||
        giftId === "like-pop"
    ){

        switchCharacter("girl",username,giftName);
        return;
    }

    if(
        giftId === "papercrane" ||
        giftId === "paper-crane"
    ){

        /*
           Paper Crane is configured as boy attack
           above. Change this section if you want
           it to switch characters instead.
        */

    }

    let action = giftActions[giftId];

    /*
       Fallback based on side
    */

    if(!action){

        if(side === "girl"){

            action = {
                side:"girl",
                damage:5,
                knockback:3,
                type:"normal",
                label:"GIRL ATTACK"
            };

        }else{

            action = {
                side:"boy",
                damage:5,
                knockback:3,
                type:"normal",
                label:"BOY ATTACK"
            };

        }

    }

    /*
       Queue gifts instead of allowing them
       to destroy the animations.
    */

    for(let i=0;i<repeatCount;i++){

        attackQueue.push({
            ...action,
            side:side || action.side,
            username,
            giftName
        });

    }

    processQueue();

};

/* ============================================================
   QUEUE
============================================================ */

function processQueue(){

    if(processing) return;

    if(!attackQueue.length) return;

    if(!gameActive){

        attackQueue = [];

        return;
    }

    processing = true;

    const attack =
        attackQueue.shift();

    performAttack(attack);

    setTimeout(()=>{

        processing = false;

        processQueue();

    },attack.type === "special" ? 650 : 430);

}

/* ============================================================
   ATTACK
============================================================ */

function performAttack(action){

    if(!gameActive) return;

    const attacker =
        action.side === "girl"
        ? "girl"
        : "boy";

    const defender =
        attacker === "girl"
        ? "boy"
        : "girl";

    addFeed(
        attacker,
        action.username,
        action.giftName || action.label
    );

    attackAnimation(
        attacker,
        action.type
    );

    /*
       Combo
    */

    registerCombo(attacker);

    /*
       Damage
    */

    const critical =
        Math.random() < (
            action.type === "special"
            ? .25
            : .08
        );

    let damage =
        action.damage;

    if(critical){

        damage *= 2;

        showComboText("CRITICAL!");

    }

    damage =
        Math.round(damage);

    applyDamage(
        defender,
        damage,
        action.knockback,
        action.type
    );

}

/* ============================================================
   DAMAGE
============================================================ */

function applyDamage(
    defender,
    damage,
    knockback,
    type
){

    if(defender === "girl"){

        girlHP =
            Math.max(
                0,
                girlHP - damage
            );

        updateHP();

        moveFighter(
            "girl",
            knockback
        );

        hitReaction("girl");

        showDamage(
            "girl",
            damage
        );

    }else{

        boyHP =
            Math.max(
                0,
                boyHP - damage
            );

        updateHP();

        moveFighter(
            "boy",
            knockback
        );

        hitReaction("boy");

        showDamage(
            "boy",
            damage
        );

    }

    impactEffect(defender,type);

    screenShake(
        type === "special"
    );

    if(
        girlHP <= 0 ||
        boyHP <= 0
    ){

        setTimeout(
            finishRound,
            400
        );

    }

}

/* ============================================================
   HP
============================================================ */

function updateHP(){

    const girlBar =
        document.getElementById("girlHealth");

    const boyBar =
        document.getElementById("boyHealth");

    girlBar.style.width =
        girlHP + "%";

    boyBar.style.width =
        boyHP + "%";

    document.getElementById("girlHpText")
        .innerText =
        girlHP + " / 100";

    document.getElementById("boyHpText")
        .innerText =
        boyHP + " / 100";

}

/* ============================================================
   FIGHTER MOVEMENT
============================================================ */

function moveFighter(
    fighter,
    amount
){

    if(fighter === "girl"){

        girlX =
            Math.min(
                43,
                girlX + amount
            );

        document.getElementById("girl")
            .style.left =
            girlX + "%";

    }else{

        boyX =
            Math.min(
                43,
                boyX + amount
            );

        document.getElementById("boy")
            .style.right =
            boyX + "%";

    }

    /*
       Keep fighters from getting too far
       into each other.
    */

    updateCenter();

}

function updateCenter(){

    const line =
        document.getElementById("center");

    const girl =
        parseFloat(girlX);

    const boy =
        parseFloat(boyX);

    const center =
        50 + (girl - boy) * .35;

    line.style.left =
        Math.max(
            42,
            Math.min(
                58,
                center
            )
        ) + "%";

}

/* ============================================================
   ATTACK ANIMATION
============================================================ */

function attackAnimation(
    fighter,
    type
){

    const el =
        document.getElementById(fighter);

    const img =
        document.getElementById(
            fighter + "Image"
        );

    el.classList.remove(
        "attackGirl",
        "attackBoy"
    );

    void el.offsetWidth;

    if(fighter === "girl"){

        el.classList.add(
            "attackGirl"
        );

    }else{

        el.classList.add(
            "attackBoy"
        );

    }

    /*
       Temporary attack image
    */

    const chars =
        fighter === "girl"
        ? girlCharacters
        : boyCharacters;

    const index =
        fighter === "girl"
        ? currentGirl
        : currentBoy;

    const char =
        chars[index];

    img.src =
        char.attack;

    setTimeout(()=>{

        img.src =
            char.idle;

    },420);

}

/* ============================================================
   HIT REACTION
============================================================ */

function hitReaction(fighter){

    const el =
        document.getElementById(fighter);

    el.classList.remove("hit");

    void el.offsetWidth;

    el.classList.add("hit");

    setTimeout(()=>{

        el.classList.remove("hit");

    },350);

}

/* ============================================================
   IMPACT EFFECT
============================================================ */

function impactEffect(
    defender,
    type
){

    const effects =
        document.getElementById("effects");

    const impact =
        document.createElement("div");

    impact.className =
        "impact";

    impact.style.left =
        defender === "girl"
        ? "40%"
        : "60%";

    impact.style.top =
        "54%";

    if(type === "special"){

        impact.style.width =
            "150px";

        impact.style.height =
            "150px";

    }

    effects.appendChild(
        impact
    );

    const flash =
        document.createElement("div");

    flash.className =
        "flash";

    effects.appendChild(
        flash
    );

    setTimeout(()=>{

        impact.remove();

        flash.remove();

    },600);

}

/* ============================================================
   DAMAGE TEXT
============================================================ */

function showDamage(
    defender,
    damage
){

    const effects =
        document.getElementById("effects");

    const text =
        document.createElement("div");

    text.className =
        "damageText";

    text.innerText =
        "-" + damage;

    text.style.left =
        defender === "girl"
        ? "35%"
        : "65%";

    text.style.top =
        "52%";

    effects.appendChild(
        text
    );

    setTimeout(
        ()=>text.remove(),
        850
    );

}

/* ============================================================
   COMBOS
============================================================ */

function registerCombo(side){

    if(comboSide === side){

        comboCount++;

    }else{

        comboSide = side;
        comboCount = 1;

    }

    clearTimeout(comboTimer);

    comboTimer =
        setTimeout(()=>{

            comboSide = null;
            comboCount = 0;

        },1200);

    if(comboCount >= 2){

        showComboText(
            comboCount + " HIT COMBO!"
        );

    }

}

function showComboText(text){

    const el =
        document.getElementById("combo");

    el.innerText =
        text;

    el.classList.remove("show");

    void el.offsetWidth;

    el.classList.add("show");

}

/* ============================================================
   SCREEN SHAKE
============================================================ */

function screenShake(
    heavy=false
){

    const arena =
        document.getElementById("arena");

    arena.classList.remove(
        "shake",
        "heavyShake"
    );

    void arena.offsetWidth;

    arena.classList.add(
        heavy
        ? "heavyShake"
        : "shake"
    );

}

/* ============================================================
   FEED
============================================================ */

function addFeed(
    side,
    username,
    gift
){

    const feed =
        document.getElementById(
            side === "girl"
            ? "girlFeed"
            : "boyFeed"
        );

    const item =
        document.createElement("div");

    item.className =
        "feedItem " +
        (
            side === "girl"
            ? "girlGift"
            : "boyGift"
        );

    item.innerHTML =
        "<b>" +
        escapeHTML(username) +
        "</b> sent " +
        escapeHTML(gift);

    feed.appendChild(item);

    while(
        feed.children.length > 4
    ){

        feed.removeChild(
            feed.firstChild
        );

    }

}

/* ============================================================
   CHARACTER SWITCH
============================================================ */

function switchCharacter(
    side,
    username="Viewer",
    giftName="Character Switch"
){

    if(side === "girl"){

        currentGirl =
            (currentGirl + 1) %
            girlCharacters.length;

        const char =
            girlCharacters[currentGirl];

        document.getElementById(
            "girlName"
        ).innerText =
            char.name;

        document.getElementById(
            "girlImage"
        ).src =
            char.idle;

    }else{

        currentBoy =
            (currentBoy + 1) %
            boyCharacters.length;

        const char =
            boyCharacters[currentBoy];

        document.getElementById(
            "boyName"
        ).innerText =
            char.name;

        document.getElementById(
            "boyImage"
        ).src =
            char.idle;

    }

    addFeed(
        side,
        username,
        giftName
    );

}

/* ============================================================
   ROUND SYSTEM
============================================================ */

function finishRound(){

    if(!gameActive) return;

    gameActive = false;

    const winner =
        girlHP <= 0
        ? "boy"
        : "girl";

    if(winner === "girl"){

        girlRounds++;

    }else{

        boyRounds++;

    }

    updateRounds();

    showAnnouncement(
        winner === "girl"
        ? "GIRLS WIN"
        : "BOYS WIN"
    );

    setTimeout(()=>{

        if(
            girlRounds >= 2 ||
            boyRounds >= 2
        ){

            showAnnouncement(
                girlRounds >= 2
                ? "GIRLS WIN THE MATCH!"
                : "BOYS WIN THE MATCH!"
            );

            setTimeout(
                resetMatchOnly,
                1800
            );

        }else{

            roundNumber++;

            setTimeout(
                startNextRound,
                1300
            );

        }

    },900);

}

function updateRounds(){

    document.getElementById("r1")
        .className =
        "roundDot";

    document.getElementById("r2")
        .className =
        "roundDot";

    document.getElementById("r3")
        .className =
        "roundDot";

    const girlDots =
        document.querySelectorAll(
            ".roundDot"
        );

    for(
        let i=0;
        i<girlRounds;
        i++
    ){

        girlDots[i]
            .classList.add(
                "activeGirl"
            );

    }

    /*
       Boy round indication is represented
       with border/background switching
       after girl dots are occupied.
    */

    for(
        let i=0;
        i<boyRounds;
        i++
    ){

        const index =
            2 - i;

        if(girlDots[index]){

            girlDots[index]
                .classList.remove(
                    "activeGirl"
                );

            girlDots[index]
                .classList.add(
                    "activeBoy"
                );

        }

    }

}

function startNextRound(){

    girlHP = 100;
    boyHP = 100;

    girlX = 18;
    boyX = 18;

    gameActive = true;

    document.getElementById("girl")
        .style.left =
        girlX + "%";

    document.getElementById("boy")
        .style.right =
        boyX + "%";

    updateHP();
    updateCenter();

    showAnnouncement(
        "ROUND " +
        roundNumber
    );

    setTimeout(()=>{

        showAnnouncement(
            "FIGHT!"
        );

    },1000);

}

function resetMatchOnly(){

    girlHP = 100;
    boyHP = 100;

    girlRounds = 0;
    boyRounds = 0;

    roundNumber = 1;

    girlX = 18;
    boyX = 18;

    gameActive = true;

    updateHP();
    updateRounds();
    updateCenter();

}

/* ============================================================
   ANNOUNCEMENT
============================================================ */

function showAnnouncement(text){

    const el =
        document.getElementById(
            "announcement"
        );

    el.innerText =
        text;

    el.classList.remove(
        "show"
    );

    void el.offsetWidth;

    el.classList.add(
        "show"
    );

}

/* ============================================================
   RESET
============================================================ */

function resetGame(){

    attackQueue = [];

    processing = false;

    resetMatchOnly();

    showAnnouncement(
        "FIGHT!"
    );

}

/* ============================================================
   CONTROLS
============================================================ */

function toggleControls(){

    document
        .getElementById("controls")
        .classList.toggle(
            "hidden"
        );

}

window.addEventListener(
    "keydown",
    function(e){

        if(
            e.key.toLowerCase()
            === "h"
        ){

            toggleControls();

        }

    }
);

/* ============================================================
   HTML ESCAPE
============================================================ */

function escapeHTML(str){

    return String(str)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

/* ============================================================
   START
============================================================ */

updateHP();
updateCenter();

setTimeout(
    ()=>showAnnouncement("FIGHT!"),
    500
);

</script>
