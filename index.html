<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK TikTok Live Battle</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Teko:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            background-color: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Teko', sans-serif;
        }
        
        /* 16:9 Canvas Scaler */
        #game-scaler {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 1920px;
            height: 1080px;
            background: #000;
            overflow: hidden;
            box-shadow: 0 0 80px rgba(0,0,0,1);
            transform-origin: center center;
        }

        /* Split Backgrounds */
        .bg-layer { 
            position: absolute; 
            top: 0; 
            bottom: 0; 
            background-size: cover; 
            background-position: center; 
            transition: width 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); 
        }
        
        #bg-boys { 
            left: 0; 
            width: 50%; 
            background-image: linear-gradient(to right, rgba(0,10,30,0.3), rgba(0,0,0,0.7)), url('1000096984.png');
            z-index: 1; 
        }
        
        #bg-girls { 
            right: 0; 
            width: 50%; 
            background-image: linear-gradient(to left, rgba(30,0,30,0.3), rgba(0,0,0,0.7)), url('1000096985.png');
            z-index: 1; 
        }

        /* Tug-of-War Battle Divider Line */
        #center-line {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 16px;
            background: #ffffff;
            z-index: 10;
            transform: translateX(-50%);
            transition: left 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 0 30px #ffffff, 0 0 60px #00d2ff, 0 0 60px #ff00cc;
        }

        /* MK Style Tug Bar Header */
        .hud-bar {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 50px;
            background: rgba(0,0,0,0.8);
            border: 3px solid #d4af37;
            border-radius: 8px;
            z-index: 20;
            display: flex;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(212,175,55,0.4);
        }

        .hud-boys { height: 100%; background: linear-gradient(90deg, #00d2ff, #0052d4); width: 50%; transition: width 0.3s ease; }
        .hud-girls { height: 100%; background: linear-gradient(90deg, #ff007f, #ff00cc); width: 50%; transition: width 0.3s ease; }

        /* Score & Team Labels */
        .team-title {
            position: absolute;
            top: 90px;
            font-family: 'Cinzel Decorative', cursive;
            font-size: 48px;
            font-weight: 900;
            z-index: 20;
            text-shadow: 0 0 20px black, 0 0 10px black;
        }
        #boys-label { left: 80px; color: #00d2ff; }
        #girls-label { right: 80px; color: #ff00cc; }

        .score-display {
            position: absolute;
            top: 145px;
            font-size: 60px;
            z-index: 20;
            letter-spacing: 2px;
            text-shadow: 0 0 15px black;
        }
        #boys-score { left: 80px; color: #fff; }
        #girls-score { right: 80px; color: #fff; }

        /* Fighters Container */
        .fighter-container {
            position: absolute;
            bottom: 120px;
            width: 450px;
            height: 650px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        #boy-box { left: 15%; }
        #girl-box { right: 15%; }

        /* Fighter Card Display */
        .fighter-card {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            border: 4px solid #d4af37;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            position: relative;
            overflow: hidden;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(10px);
        }

        .boy-theme { border-color: #00d2ff; box-shadow: 0 0 40px rgba(0,210,255,0.4); }
        .girl-theme { border-color: #ff00cc; box-shadow: 0 0 40px rgba(255,0,204,0.4); }

        .fighter-avatar {
            font-size: 140px;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.3));
            margin-bottom: 20px;
        }

        .fighter-name {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 42px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 15px currentColor;
        }

        .fighter-title {
            font-size: 28px;
            color: #d4af37;
            letter-spacing: 2px;
        }

        /* Move Overlay Animation FX */
        .lunge-right { transform: translateX(120px) scale(1.08) !important; }
        .lunge-left { transform: translateX(-120px) scale(1.08) !important; }
        
        .hit-recoil {
            animation: hitFlash 0.35s ease-in-out;
        }

        @keyframes hitFlash {
            0% { filter: brightness(1) drop-shadow(0 0 0px red); transform: scale(1); }
            50% { filter: brightness(2.5) drop-shadow(0 0 40px #ff0000); transform: scale(0.92) rotate(-3deg); }
            100% { filter: brightness(1) drop-shadow(0 0 0px red); transform: scale(1); }
        }

        /* Floating Damage Text Popup */
        .damage-pop {
            position: absolute;
            font-family: 'Cinzel Decorative', cursive;
            font-weight: 900;
            font-size: 75px;
            color: #ff2a2a;
            text-shadow: 0 0 20px #000, 0 0 10px #ff0000;
            z-index: 30;
            pointer-events: none;
            animation: floatUp 0.9s forwards ease-out;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            50% { transform: translateY(-80px) scale(1.3); }
            100% { opacity: 0; transform: translateY(-150px) scale(1); }
        }

        /* Heavy Screen Shake Effect */
        .heavy-shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-15px, 10px) rotate(-1deg); }
            40% { transform: translate(15px, -10px) rotate(1deg); }
            60% { transform: translate(-10px, -15px) rotate(-1deg); }
            80% { transform: translate(10px, 15px) rotate(1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* Controls / Instructions HUD Footer */
        .gift-hud {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 60px;
            z-index: 20;
            font-size: 26px;
            color: rgba(255,255,255,0.85);
            text-shadow: 0 0 10px black;
        }

        .gift-tag {
            background: rgba(0,0,0,0.7);
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <div id="game-scaler">
        <div id="game-container">
            <div id="bg-boys" class="bg-layer"></div>
            <div id="bg-girls" class="bg-layer"></div>
            <div id="center-line"></div>

            <div class="hud-bar">
                <div id="hud-boys-fill" class="hud-boys"></div>
                <div id="hud-girls-fill" class="hud-girls"></div>
            </div>

            <div id="boys-label" class="team-title">TEAM BOYS</div>
            <div id="girls-label" class="team-title">TEAM GIRLS</div>
            
            <div id="boys-score" class="score-display">WINS: 0</div>
            <div id="girls-score" class="score-display">WINS: 0</div>

            <div id="boy-box" class="fighter-container">
                <div class="fighter-card boy-theme">
                    <div id="boy-icon" class="fighter-avatar">🦂</div>
                    <div id="boy-name" class="fighter-name">SCORPION</div>
                    <div class="fighter-title">REALM OF SHIRAI RYU</div>
                </div>
            </div>

            <div id="girl-box" class="fighter-container">
                <div class="fighter-card girl-theme">
                    <div id="girl-icon" class="fighter-avatar">🪭</div>
                    <div id="girl-name" class="fighter-name">KITANA</div>
                    <div class="fighter-title">PRINCESS OF EDENIA</div>
                </div>
            </div>

            <div class="gift-hud">
                <div class="gift-tag">💙 TikTok = Move (+1) | Mind Blown = Kritical (+10) | Paper Crane = Switch</div>
                <div class="gift-tag">💖 Rose = Move (+1) | Rosa = Kritical (+10) | Like-Pop = Switch</div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        // Screen Auto-Scaler for 16:9
        function fitScreen() {
            const container = document.getElementById('game-container');
            const scaleX = window.innerWidth / 1920;
            const scaleY = window.innerHeight / 1080;
            const scale = Math.min(scaleX, scaleY);
            container.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', fitScreen);
        fitScreen();

        let position = 0; // -20 (Boys Win) to +20 (Girls Win)
        let boysWins = 0;
        let girlsWins = 0;

        // Mortal Kombat Rosters (7 Characters Each)
        const boyCharacters = [
            { name: "Scorpion", icon: "🦂", title: "Shirai Ryu Leader" },
            { name: "Sub-Zero", icon: "❄️", title: "Grandmaster Lin Kuei" },
            { name: "Raiden", icon: "⚡", title: "God of Thunder" },
            { name: "Liu Kang", icon: "🔥", title: "God of Fire" },
            { name: "Johnny Cage", icon: "🕶️", title: "Action Superstar" },
            { name: "Shang Tsung", icon: "💀", title: "Soul Sorcerer" },
            { name: "Kung Lao", icon: "🎩", title: "Shaolin Monk" }
        ];

        const girlCharacters = [
            { name: "Kitana", icon: "🪭", title: "Princess of Edenia" },
            { name: "Mileena", icon: "⚔️", title: "Empress of Outworld" },
            { name: "Sonya Blade", icon: "🎖️", title: "Special Forces Commander" },
            { name: "Jade", icon: "🟢", title: "Edenian Assassin" },
            { name: "Skarlet", icon: "🩸", title: "Blood Mage" },
            { name: "Sindel", icon: "👑", title: "Queen of Edenia" },
            { name: "Cassie Cage", icon: "🎧", title: "Special Forces Leader" }
        ];

        let boyIndex = 0;
        let girlIndex = 0;

        const container = document.getElementById('game-container');
        const centerLine = document.getElementById('center-line');
        const bgBoys = document.getElementById('bg-boys');
        const bgGirls = document.getElementById('bg-girls');
        const hudBoys = document.getElementById('hud-boys-fill');
        const hudGirls = document.getElementById('hud-girls-fill');

        const boyBox = document.getElementById('boy-box');
        const girlBox = document.getElementById('girl-box');

        function updateFighters() {
            document.getElementById('boy-icon').innerText = boyCharacters[boyIndex].icon;
            document.getElementById('boy-name').innerText = boyCharacters[boyIndex].name;
            
            document.getElementById('girl-icon').innerText = girlCharacters[girlIndex].icon;
            document.getElementById('girl-name').innerText = girlCharacters[girlIndex].name;
        }
        updateFighters();

        // Socket Actions
        socket.on('action', (data) => {
            if (data.team === 'boys') {
                if (data.type === 'switch') {
                    boyIndex = (boyIndex + 1) % boyCharacters.length;
                    updateFighters();
                } else {
                    executeAttack('boys', data.damage || 1);
                }
            } else if (data.team === 'girls') {
                if (data.type === 'switch') {
                    girlIndex = (girlIndex + 1) % girlCharacters.length;
                    updateFighters();
                } else {
                    executeAttack('girls', data.damage || 1);
                }
            }
        });

        function executeAttack(attackerTeam, damage) {
            if (attackerTeam === 'boys') {
                // Boys attack -> Girls take damage -> Center line moves right (+ position)
                position -= damage;
                
                // Attacker lunge & Defender hit recoil
                boyBox.classList.add('lunge-right');
                girlBox.classList.add('hit-recoil');
                spawnDamageText(girlBox, damage);

                setTimeout(() => {
                    boyBox.classList.remove('lunge-right');
                    girlBox.classList.remove('hit-recoil');
                }, 350);

            } else {
                // Girls attack -> Boys take damage -> Center line moves left (- position)
                position += damage;

                // Attacker lunge & Defender hit recoil
                girlBox.classList.add('lunge-left');
                boyBox.classList.add('hit-recoil');
                spawnDamageText(boyBox, damage);

                setTimeout(() => {
                    girlBox.classList.remove('lunge-left');
                    boyBox.classList.remove('hit-recoil');
                }, 350);
            }

            if (damage >= 10) {
                container.classList.add('heavy-shake');
                setTimeout(() => container.classList.remove('heavy-shake'), 450);
            }

            updateUI();
            checkWin();
        }

        function spawnDamageText(targetEl, dmg) {
            const pop = document.createElement('div');
            pop.className = 'damage-pop';
            pop.innerText = dmg >= 10 ? `KRITICAL -${dmg}!` : `-${dmg}`;
            
            const rect = targetEl.getBoundingClientRect();
            pop.style.left = `${rect.left + rect.width / 2 - 50}px`;
            pop.style.top = `${rect.top + 100}px`;

            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), 900);
        }

        function updateUI() {
            let clampedPos = Math.max(-20, Math.min(20, position));
            // Calculate percentage from center (50%)
            let boysPercent = 50 + (clampedPos * 2.5); // ranges from 0% to 100%
            let girlsPercent = 100 - boysPercent;

            centerLine.style.left = `${boysPercent}%`;
            bgBoys.style.width = `${boysPercent}%`;
            bgGirls.style.width = `${girlsPercent}%`;

            hudBoys.style.width = `${boysPercent}%`;
            hudGirls.style.width = `${girlsPercent}%`;
        }

        function checkWin() {
            if (position <= -20) {
                boysWins++;
                document.getElementById('boys-score').innerText = `WINS: ${boysWins}`;
                resetRound();
            } else if (position >= 20) {
                girlsWins++;
                document.getElementById('girls-score').innerText = `WINS: ${girlsWins}`;
                resetRound();
            }
        }

        function resetRound() {
            setTimeout(() => {
                position = 0;
                updateUI();
            }, 2000);
        }
    </script>
</body>
</html>
