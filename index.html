<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Mortal Kombat - TikTok Gift Battle</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  font-family:Impact,"Segoe UI",Arial,sans-serif;
}

html,body{
  width:100%;
  min-height:100%;
  background:#08060c;
  color:#fff;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:10px;
  overflow:hidden;
}

/* =========================
   STREAMER HINT
========================= */

.secret-hint{
  font:12px Arial;
  color:#777;
  margin-bottom:7px;
  text-align:center;
}

.secret-hint span{
  background:#222;
  color:#00ffcc;
  padding:2px 5px;
  border-radius:4px;
}

/* =========================
   9:16 ARENA
========================= */

.arena-wrapper{
  position:relative;
  width:min(calc(100vw - 20px),540px);
  aspect-ratio:9/16;

  background:#000;

  border:2px solid #2a1f3d;
  border-radius:10px;

  overflow:hidden;

  box-shadow:
    0 0 30px #000,
    0 0 15px rgba(176,38,255,.3);
}

/* =========================
   BACKGROUNDS
========================= */

.bg-split{
  position:absolute;
  top:0;
  bottom:0;

  background-size:cover;
  background-position:center;

  transition:
    width .45s
    cubic-bezier(.25,1,.5,1);
}

.bg-girls{
  left:0;
  width:50%;

  background:
    #4a1942
    url("girls.jpg")
    center/cover;

  border-right:2px solid #fff;

  box-shadow:
    5px 0 20px
    rgba(176,38,255,.8);

  z-index:2;
}

.bg-boys{
  right:0;
  width:50%;

  background:
    #193a4a
    url("boys.jpg")
    center/cover;

  border-left:2px solid #fff;

  box-shadow:
    -5px 0 20px
    rgba(0,210,255,.8);

  z-index:1;
}

/* =========================
   CENTER DIVIDER
========================= */

.center-divider{
  position:absolute;

  left:50%;
  top:0;
  bottom:0;

  width:5px;

  background:#fff;

  transform:
    translateX(-50%);

  box-shadow:
    0 0 15px #fff,
    0 0 30px #b026ff,
    0 0 45px #00d2ff;

  z-index:5;
}

/* =========================
   TOP SCORE
========================= */

.hud-top{
  position:absolute;

  top:9px;
  left:9px;
  right:9px;

  display:flex;
  justify-content:space-between;

  z-index:20;
}

.team-score-box{
  display:flex;

  border-radius:7px;
  overflow:hidden;

  border:
    2px solid
    rgba(255,255,255,.3);

  box-shadow:
    0 5px 12px #000;

  background:#111;
}

.score-number{
  font-size:23px;

  padding:5px 9px;

  min-width:48px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.team-name{
  font-size:17px;

  padding:5px 9px;

  display:flex;
  align-items:center;
  justify-content:center;

  letter-spacing:1px;
}

.team-girls .team-name{
  background:
    linear-gradient(
      135deg,
      #ff1e56,
      #d800ff
    );
}

.team-boys .team-name{
  background:
    linear-gradient(
      135deg,
      #0066ff,
      #00d2ff
    );
}

/* =========================
   GIFT PANELS
========================= */

.gift-panel{
  position:absolute;

  top:43%;

  transform:
    translateY(-50%);

  display:flex;
  flex-direction:column;

  gap:7px;

  padding:6px 4px;

  background:
    rgba(0,0,0,.38);

  backdrop-filter:
    blur(4px);

  border-radius:13px;

  z-index:15;

  pointer-events:none;
}

.gift-panel.girls-side{
  left:6px;

  border-left:
    3px solid #d800ff;
}

.gift-panel.boys-side{
  right:6px;

  border-right:
    3px solid #00d2ff;
}

.gift-item{
  display:flex;

  flex-direction:column;

  align-items:center;

  gap:1px;

  min-width:38px;

  text-align:center;
}

.gift-icon{
  width:30px;
  height:30px;

  object-fit:contain;

  background:transparent;
}

.gift-points{
  font:
    900 13px Arial;

  color:#fff;

  text-shadow:
    0 2px 4px #000,
    0 0 7px #000;
}

/* =========================
   CHARACTERS
========================= */

.avatar-wrapper{
  position:absolute;

  bottom:10%;

  height:49%;

  z-index:6;

  transition:
    left .45s;
}

.avatar-wrapper-girl{
  transform:
    translateX(-100%);

  padding-right:14px;
}

.avatar-wrapper-boy{
  padding-left:14px;
}

.avatar{
  height:100%;
  width:auto;

  object-fit:contain;

  transition:
    transform .15s;
}

/* =========================
   ANNOUNCEMENT
========================= */

.announcement{
  position:absolute;

  top:40%;
  left:50%;

  transform:
    translate(-50%,-50%)
    scale(.5);

  font:
    900 42px Impact;

  text-transform:uppercase;

  text-align:center;

  letter-spacing:2px;

  opacity:0;

  pointer-events:none;

  z-index:70;

  transition:.2s;
}

.announcement.active{
  opacity:1;

  transform:
    translate(-50%,-50%)
    scale(1.08);
}

.annct-girls{
  text-shadow:
    0 0 10px #d800ff,
    0 0 20px #d800ff,
    3px 3px #000;
}

.annct-boys{
  text-shadow:
    0 0 10px #0066ff,
    0 0 20px #0066ff,
    3px 3px #000;
}

/* =========================
   ACTION FEED
========================= */

.action-feed{
  position:absolute;

  bottom:10px;

  display:flex;
  flex-direction:column;

  gap:4px;

  z-index:15;

  pointer-events:none;

  max-width:42%;
}

.action-feed-girls{
  left:6px;
}

.action-feed-boys{
  right:6px;
}

.feed-item{
  background:
    rgba(0,0,0,.62);

  padding:3px 6px;

  border-radius:4px;

  font:
    10px Arial;

  display:flex;

  align-items:center;

  gap:5px;
}

.feed-item-girl{
  border-left:
    3px solid #d800ff;
}

.feed-item-boy{
  border-left:
    3px solid #00d2ff;
}

.feed-gift-icon{
  width:18px;
  height:18px;

  object-fit:contain;
}

/* =========================
   BATTLE SCORE
========================= */

.battle-scorebar{
  width:min(100%,540px);

  margin-top:7px;

  display:flex;

  border:
    2px solid #2e2440;

  border-radius:8px;

  overflow:hidden;

  background:#0d0a13;
}

.battle-score-side{
  flex:1;

  padding:5px;

  text-align:center;

  font:
    13px Arial;
}

.battle-score-side.girls{
  background:
    rgba(216,0,255,.22);
}

.battle-score-side.boys{
  background:
    rgba(0,210,255,.22);
}

.battle-score-number{
  display:block;

  font:
    900 23px Impact;
}

.battle-score-center{
  display:flex;

  align-items:center;
  justify-content:center;

  padding:0 7px;

  background:#111;

  font:
    bold 13px Arial;
}

/* =========================
   CONTROLS
========================= */

.controls-panel{
  width:min(100%,540px);

  margin-top:8px;

  background:#120e1a;

  border:
    1px solid #2e2440;

  border-radius:8px;

  padding:8px;

  display:flex;
  flex-direction:column;

  gap:7px;
}

.controls-panel.hidden{
  display:none!important;
}

.button-group{
  display:flex;

  justify-content:center;

  gap:6px;

  flex-wrap:wrap;
}

.btn{
  padding:7px 10px;

  border:0;

  border-radius:6px;

  color:#fff;

  font-size:11px;

  font-weight:bold;
}

.btn-girl-hit{
  background:#8a1ca6;
}

.btn-girl-brutal{
  background:#d800ff;
}

.btn-boy-hit{
  background:#005bb5;
}

.btn-boy-brutal{
  background:#0066ff;
}

.btn-util{
  background:#251d33;

  border:
    1px solid #44355e;
}

/* =========================
   BUTTONS
========================= */

.fullscreen-btn,
.secret-toggle-btn{
  position:fixed;

  z-index:999999;

  border:
    1px solid
    rgba(255,255,255,.25);

  background:
    rgba(0,0,0,.75);

  color:#fff;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;
}

.fullscreen-btn{
  right:10px;
  bottom:10px;

  width:45px;
  height:45px;

  font-size:20px;
}

.secret-toggle-btn{
  right:5px;
  bottom:5px;

  width:24px;
  height:24px;

  font-size:13px;
}

/* =========================
   SCREEN SHAKE
========================= */

.arena-hit{
  animation:
    shake .3s;
}

.arena-brutality{
  animation:
    brutal .6s;
}

/* =========================
   GIFTER ATTACK
========================= */

.gifter-attack{
  position:absolute;

  left:var(--start-x);
  top:63%;

  width:58px;
  height:58px;

  border-radius:50%;

  object-fit:cover;

  border:
    3px solid #fff;

  z-index:90;

  pointer-events:none;

  box-shadow:
    0 0 12px #fff,
    0 0 25px
    rgba(255,0,200,.8);
}

.gifter-from-girl{
  animation:
    giferGirl
    .85s
    cubic-bezier(.2,.8,.25,1)
    forwards;
}

.gifter-from-boy{
  animation:
    giferBoy
    .85s
    cubic-bezier(.2,.8,.25,1)
    forwards;
}

.fallback-avatar{
  display:flex;

  align-items:center;
  justify-content:center;

  background:#222;

  font-size:30px;
}

.gifter-hit-number{
  position:absolute;

  z-index:95;

  top:50%;

  transform:
    translate(-50%,-50%)
    scale(.3);

  color:var(--hit-color);

  font:
    900 40px Impact,
    "Arial Black",
    sans-serif;

  text-shadow:
    3px 3px #000,
    0 0 16px var(--hit-color);

  pointer-events:none;

  animation:
    damage .75s forwards;
}

.gifter-target-push{
  animation:
    targetPush
    .6s
    both!important;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes giferGirl{

  0%{
    left:var(--start-x);
    top:63%;
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.55);
  }

  12%{
    opacity:1;
  }

  72%{
    left:var(--end-x);
    top:57%;
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1.08);
  }

  100%{
    left:var(--end-x);
    top:57%;
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.72);
  }
}

@keyframes giferBoy{

  0%{
    left:var(--start-x);
    top:63%;
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.55);
  }

  12%{
    opacity:1;
  }

  72%{
    left:var(--end-x);
    top:57%;
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1.08);
  }

  100%{
    left:var(--end-x);
    top:57%;
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.72);
  }
}

@keyframes damage{

  0%{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.3);
  }

  20%{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1.2);
  }

  100%{
    opacity:0;

    transform:
      translate(-50%,-95%)
      scale(.8);
  }
}

@keyframes targetPush{

  0%,100%{
    transform:
      translateX(0)
      scale(1);
  }

  25%{
    transform:
      translateX(var(--target-push))
      scale(1.04);
  }

  45%{
    transform:
      translateX(
        calc(var(--target-push) * -.45)
      )
      scale(.98);
  }

  65%{
    transform:
      translateX(
        calc(var(--target-push) * .2)
      )
      scale(1.01);
  }
}

@keyframes shake{

  20%{
    transform:
      translate(-7px,4px);
  }

  40%{
    transform:
      translate(7px,-4px);
  }

  60%{
    transform:
      translate(-4px,2px);
  }

  80%{
    transform:
      translate(4px,-2px);
  }
}

@keyframes brutal{

  10%{
    transform:
      translate(-12px,8px)
      scale(1.04);
  }

  20%{
    transform:
      translate(12px,-8px)
      scale(1.04);
  }

  30%{
    transform:
      translate(-12px,-8px)
      scale(1.04);
  }

  40%{
    transform:
      translate(12px,8px)
      scale(1.04);
  }

  70%{
    transform:
      translate(8px,-4px);
  }
}

/* =========================
   VIEWER MODE
========================= */

body.viewer-mode{
  padding:0;
  margin:0;

  width:100vw;
  height:100vh;

  min-height:100vh;

  background:#000;

  overflow:hidden;
}

body.viewer-mode .secret-hint,
body.viewer-mode .battle-scorebar,
body.viewer-mode .controls-panel,
#tiktok-debug{
  display:none!important;
}

body.viewer-mode .arena-wrapper{
  width:
    min(
      100vw,
      calc(100vh * 9 / 16)
    );

  height:
    min(
      100vh,
      calc(100vw * 16 / 9)
    );

  max-width:none;
  max-height:none;

  aspect-ratio:9/16;

  border:0;
  border-radius:0;

  box-shadow:none;
}

/* =========================
   SMALL PHONES
========================= */

@media(max-width:420px){

  .team-name{
    font-size:14px;
  }

  .score-number{
    font-size:19px;
    min-width:38px;
  }

  .gift-icon{
    width:27px;
    height:27px;
  }

  .gift-points{
    font-size:12px;
  }

  .announcement{
    font-size:32px;
  }
}

</style>

/* =========================
   RANDOM USER
========================= */

function getRandomUsername(){

  const names = [
    "shadow",
    "kombat",
    "ghost",
    "ninja",
    "gamer",
    "pro",
    "alpha",
    "toxic",
    "queen",
    "king",
    "guest",
    "user"
  ];

  return (
    names[
      Math.floor(
        Math.random()*names.length
      )
    ] +
    Math.floor(
      Math.random()*99999
    )
  );

}


/* =========================
   UPDATE VISUALS
========================= */

function updateVisuals(){

  let p =
    Math.max(
      0,
      Math.min(
        200,
        linePosition
      )
    );

  let percentage =
    p / 2;

  document.getElementById(
    "bg-girls"
  ).style.width =
    percentage + "%";

  document.getElementById(
    "bg-boys"
  ).style.width =
    (100-percentage) + "%";

  document.getElementById(
    "center-line"
  ).style.left =
    percentage + "%";

  document.getElementById(
    "wrap-girl"
  ).style.left =
    percentage + "%";

  document.getElementById(
    "wrap-boy"
  ).style.left =
    percentage + "%";

  document.getElementById(
    "girl-battle-score"
  ).innerText =
    Math.round(p);

  document.getElementById(
    "boy-battle-score"
  ).innerText =
    200-Math.round(p);

}


/* =========================
   SCREEN SHAKE
========================= */

function triggerAnimation(
  brutality
){

  const arena =
    document.getElementById(
      "arena"
    );

  arena.classList.remove(
    "arena-hit",
    "arena-brutality"
  );

  void arena.offsetWidth;

  arena.classList.add(
    brutality
      ? "arena-brutality"
      : "arena-hit"
  );

}


/* =========================
   CHARACTER CHANGED
========================= */

function showCharacterChanged(
  side
){

  const announcement =
    document.getElementById(
      "announcement-text"
    );

  announcement.className =
    "announcement " +
    (
      side === "girl"
        ? "annct-girls"
        : "annct-boys"
    ) +
    " active";

  announcement.innerText =
    "CHARACTER CHANGED";

  setTimeout(
    function(){

      announcement.classList.remove(
        "active"
      );

    },
    900
  );

}


/* =========================
   GIFTER PROFILE ATTACK
========================= */

function showGifterAttack(
  attacker,
  avatarUrl,
  power = 5
){

  const arena =
    document.getElementById(
      "arena"
    );

  if(!arena)
    return;

  arena
    .querySelectorAll(
      ".gifter-attack,.gifter-hit-number"
    )
    .forEach(
      element =>
        element.remove()
    );

  const fromGirl =
    attacker === "girl";

  const img =
    document.createElement(
      "img"
    );

  const fallback =
    document.createElement(
      "div"
    );

  const damage =
    document.createElement(
      "div"
    );


  img.className =
    "gifter-attack " +
    (
      fromGirl
        ? "gifter-from-girl"
        : "gifter-from-boy"
    );

  img.src =
    avatarUrl || "";

  img.alt = "";

  img.style.setProperty(
    "--start-x",
    fromGirl
      ? "18%"
      : "82%"
  );

  img.style.setProperty(
    "--end-x",
    fromGirl
      ? "72%"
      : "28%"
  );


  fallback.className =
    "gifter-attack fallback-avatar " +
    (
      fromGirl
        ? "gifter-from-girl"
        : "gifter-from-boy"
    );

  fallback.textContent =
    "👤";

  fallback.style.setProperty(
    "--start-x",
    fromGirl
      ? "18%"
      : "82%"
  );

  fallback.style.setProperty(
    "--end-x",
    fromGirl
      ? "72%"
      : "28%"
  );


  damage.className =
    "gifter-hit-number";

  damage.textContent =
    "+" +
    (
      Number(power) || 1
    );

  damage.style.left =
    fromGirl
      ? "72%"
      : "28%";

  damage.style.setProperty(
    "--hit-color",
    fromGirl
      ? "#ff39d6"
      : "#32c9ff"
  );


  if(avatarUrl){

    img.onerror =
      function(){

        img.remove();

        arena.appendChild(
          fallback
        );

        setTimeout(
          () =>
            fallback.remove(),
          850
        );

      };

    arena.appendChild(
      img
    );

  }

  else{

    arena.appendChild(
      fallback
    );

  }


  arena.appendChild(
    damage
  );


  const target =
    document.getElementById(

      fromGirl
        ? "avatar-boy"
        : "avatar-girl"

    );


  if(target){

    target.classList.remove(
      "gifter-target-push"
    );

    target.style.setProperty(
      "--target-push",
      fromGirl
        ? "30px"
        : "-30px"
    );

    void target.offsetWidth;

    target.classList.add(
      "gifter-target-push"
    );

    setTimeout(
      () =>
        target.classList.remove(
          "gifter-target-push"
        ),
      650
    );

  }


  setTimeout(
    function(){

      img.remove();
      fallback.remove();
      damage.remove();

    },
    850
  );

}


/* =========================
   ATTACK
========================= */

function attack(

  attacker,
  isBrutality,
  username = null,
  giftName = "",
  customPower = null,
  actionLabel = ""

){

  if(!isMatchActive)
    return;


  if(
    !username ||
    username === "Unknown"
  ){

    username =
      getRandomUsername();

  }


  if(
    window.__pendingGifterAvatar
  ){

    showGifterAttack(

      attacker,

      window.__pendingGifterAvatar,

      customPower ||
      (
        isBrutality
          ? 50
          : 5
      )

    );

    window.__pendingGifterAvatar =
      null;

  }


  const suppliedPower =
    Number(customPower);


  const power =

    Number.isFinite(
      suppliedPower
    ) &&
    suppliedPower > 0

      ? suppliedPower

      : (
          isBrutality
            ? 50
            : 5
        );


  if(
    attacker === "girl"
  ){

    linePosition +=
      power;

    addFeed(
      "girl",
      username,
      actionLabel ||
      giftName ||
      "Hit"
    );

  }

  else{

    linePosition -=
      power;

    addFeed(
      "boy",
      username,
      actionLabel ||
      giftName ||
      "Hit"
    );

  }


  animateCharacter(
    attacker
  );

  updateVisuals();

  triggerAnimation(
    isBrutality
  );

  checkWinner();

}


/* =========================
   WINNER
========================= */

function checkWinner(){

  const announcement =
    document.getElementById(
      "announcement-text"
    );


  if(
    linePosition >= 200
  ){

    girlWins++;

    document.getElementById(
      "girl-wins"
    ).innerText =
      girlWins;

    isMatchActive =
      false;

    announcement.className =
      "announcement annct-girls active";

    announcement.innerText =
      "GIRLS WIN!";

    setTimeout(
      function(){

        announcement.classList.remove(
          "active"
        );

        resetMatch();

      },
      900
    );

  }

  else if(
    linePosition <= 0
  ){

    boyWins++;

    document.getElementById(
      "boy-wins"
    ).innerText =
      boyWins;

    isMatchActive =
      false;

    announcement.className =
      "announcement annct-boys active";

    announcement.innerText =
      "BOYS WIN!";

    setTimeout(
      function(){

        announcement.classList.remove(
          "active"
        );

        resetMatch();

      },
      900
    );

  }

}


/* =========================
   CHARACTER ATTACK
========================= */

function animateCharacter(
  side
){

  const img =
    document.getElementById(

      side === "girl"
        ? "avatar-girl"
        : "avatar-boy"

    );


  const data =
    side === "girl"

      ? girlCharacters[
          currentGirlIndex
        ]

      : boyCharacters[
          currentBoyIndex
        ];


  if(!img)
    return;


  img.src =
    data.attack;


  img.style.transform =
    side === "girl"

      ? "scale(1.08) translateX(14px)"

      : "scale(1.08) translateX(-14px)";


  setTimeout(
    function(){

      img.src =
        data.idle;

      img.style.transform =
        "scale(1) translateX(0)";

    },
    600
  );

}


/* =========================
   CHARACTER SWITCH
========================= */

function switchCharacter(

  side,
  username = null

){

  username =
    username ||
    getRandomUsername();


  if(
    side === "girl"
  ){

    currentGirlIndex =

      (
        currentGirlIndex + 1
      ) %
      girlCharacters.length;


    const character =
      girlCharacters[
        currentGirlIndex
      ];


    document.getElementById(
      "girl-name-label"
    ).innerText =
      character.name;


    document.getElementById(
      "avatar-girl"
    ).src =
      character.idle;


    showCharacterChanged(
      "girl"
    );


    addFeed(
      "girl",
      username,
      "Character Changed",
      bouquetSVG
    );

  }

  else{

    currentBoyIndex =

      (
        currentBoyIndex + 1
      ) %
      boyCharacters.length;


    const character =
      boyCharacters[
        currentBoyIndex
      ];


    document.getElementById(
      "boy-name-label"
    ).innerText =
      character.name;


    document.getElementById(
      "avatar-boy"
    ).src =
      character.idle;


    showCharacterChanged(
      "boy"
    );


    addFeed(
      "boy",
      username,
      "Character Changed",
      confettiSVG
    );

  }

}


/* =========================
   FEED
========================= */

function addFeed(

  side,
  user,
  gift,
  image = null

){

  const feed =
    document.getElementById(

      side === "girl"
        ? "feed-girls"
        : "feed-boys"

    );


  const item =
    document.createElement(
      "div"
    );


  item.className =
    "feed-item " +
    (
      side === "girl"
        ? "feed-item-girl"
        : "feed-item-boy"
    );


  item.innerHTML =

    (
      image

        ? `<img
             class="feed-gift-icon"
             src="${image}">`

        : ""
    ) +

    `<b>
      ${escapeHTML(user)}
     </b>

     <span>
       sent
     </span>

     <span>
       ${escapeHTML(gift)}
     </span>`;


  feed.appendChild(
    item
  );


  while(
    feed.children.length > 3
  ){

    feed.removeChild(
      feed.firstChild
    );

  }

}


/* =========================
   SECURITY
========================= */

function escapeHTML(
  text
){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;

}


/* =========================
   RESET
========================= */

function resetMatch(){

  linePosition = 100;

  isMatchActive = true;

  updateVisuals();

}


function resetScores(){

  resetMatch();

  girlWins = 0;
  boyWins = 0;

  document.getElementById(
    "girl-wins"
  ).innerText =
    "0";

  document.getElementById(
    "boy-wins"
  ).innerText =
    "0";

}


/* =========================
   CONTROLS
========================= */

function toggleControls(){

  document
    .getElementById(
      "controls-panel"
    )
    .classList.toggle(
      "hidden"
    );

}


window.addEventListener(
  "keydown",
  function(e){

    if(
      e.key.toLowerCase() === "h"
    ){

      toggleControls();

    }

  }
);


/* =========================
   VIEWER MODE
========================= */

async function startViewerMode(){

  if(
    typeof unlockBattleVoice ===
    "function"
  ){

    unlockBattleVoice();

  }


  if(
    typeof startBattleMusic ===
    "function"
  ){

    startBattleMusic();

  }


  document.body.classList.add(
    "viewer-mode"
  );


  const arena =
    document.getElementById(
      "arena"
    );


  try{

    if(
      !document.fullscreenElement &&
      arena.requestFullscreen
    ){

      await arena.requestFullscreen();

    }

  }

  catch(error){

    console.log(
      "Fullscreen blocked"
    );

  }


  try{

    if(
      screen.orientation &&
      screen.orientation.lock
    ){

      await screen.orientation.lock(
        "portrait"
      );

    }

  }

  catch(error){

    console.log(
      "Portrait lock unavailable"
    );

  }

}


document.addEventListener(
  "fullscreenchange",
  function(){

    if(
      !document.fullscreenElement
    ){

      document.body.classList.remove(
        "viewer-mode"
      );

    }

  }
);


/* =========================
   START
========================= */

updateVisuals();
