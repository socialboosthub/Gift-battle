<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mortal Kombat - Gift Battle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Impact', 'Segoe UI', Arial, sans-serif;
    }

    body {
      background-color: #08060c;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
    }

    .secret-hint {
      font-family: sans-serif;
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
      text-align: center;
    }

    .secret-hint span {
      background: #222;
      color: #00ffcc;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    /* 16:9 Arena Container */
    .arena-wrapper {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      position: relative;
      border: 3px solid #2a1f3d;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(176, 38, 255, 0.3);
      background: #000;
    }

    /* Hit & Brutality Animations */
    .arena-hit {
      animation: screenShake 0.3s cubic-bezier(.36,.07,.19,.97) both;
    }
    
    .arena-brutality {
      animation: brutalShake 0.6s cubic-bezier(.36,.07,.19,.97) both;
      filter: sepia(0.8) hue-rotate(-30deg) saturate(3) contrast(1.2);
    }

    @keyframes screenShake {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-8px, 5px); }
      40% { transform: translate(8px, -5px); }
      60% { transform: translate(-4px, 2px); }
      80% { transform: translate(4px, -2px); }
      100% { transform: translate(0, 0); }
    }

    @keyframes brutalShake {
      0% { transform: translate(0, 0) scale(1); }
      10% { transform: translate(-15px, 10px) scale(1.05); }
      20% { transform: translate(15px, -10px) scale(1.05); }
      30% { transform: translate(-15px, -10px) scale(1.05); }
      40% { transform: translate(15px, 10px) scale(1.05); }
      50% { transform: translate(-10px, 5px) scale(1.02); }
      70% { transform: translate(10px, -5px) scale(1.01); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* Dynamic Split Backgrounds */
    .bg-split {
      position: absolute;
      top: 0;
      bottom: 0;
      background-size: cover;
      background-position: center;
      transition: width 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .bg-girls {
      left: 0;
      width: 50%;
      background-color: #4a1942; /* Fallback if image missing */
      background-image: url('girls.jpg');
      border-right: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 5px 0 20px rgba(176, 38, 255, 0.8);
      z-index: 2;
    }

    .bg-boys {
      right: 0;
      width: 50%;
      background-color: #193a4a; /* Fallback if image missing */
      background-image: url('boys.jpg');
      border-left: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: -5px 0 20px rgba(0, 210, 255, 0.8);
      z-index: 1;
    }

    /* Moving Center Divider */
    .center-divider {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 6px;
      background: #ffffff;
      transform: translateX(-50%);
      box-shadow: 0 0 15px #fff, 0 0 30px #b026ff, 0 0 45px #00d2ff;
      z-index: 5;
      transition: left 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Top HUD / Video Style Scoreboards */
    .hud-top {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .team-score-box {
      display: flex;
      align-items: stretch;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.6);
      background: #111;
    }

    .score-number {
      font-size: 32px;
      color: #fff;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 70px;
    }

    .team-name {
      font-size: 24px;
      color: #fff;
      padding: 8px 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 2px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    }

    .team-girls .team-name {
      background: linear-gradient(135deg, #ff1e56, #d800ff);
    }

    .team-boys .team-name {
      background: linear-gradient(135deg, #0066ff, #00d2ff);
    }

    /* Custom PNG Avatars */
    .avatar {
      position: absolute;
      bottom: 15%;
      height: 45%; /* Makes them large like the video */
      width: auto;
      object-fit: contain;
      z-index: 6;
      transition: transform 0.1s;
    }
    
    .avatar-left { left: 20%; }
    .avatar-right { right: 20%; }

    /* Floating Attack Announcement */
    .announcement {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      font-size: 42px;
      font-weight: 900;
      text-transform: uppercase;
      text-align: center;
      letter-spacing: 3px;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      white-space: nowrap;
    }

    .announcement.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.1);
    }

    .annct-girls { color: #fff; text-shadow: 0 0 10px #d800ff, 0 0 20px #d800ff, 4px 4px 0px #000; }
    .annct-boys { color: #fff; text-shadow: 0 0 10px #0066ff, 0 0 20px #0066ff, 4px 4px 0px #000; }

    /* Action Feed Log */
    .action-feed {
      position: absolute;
      bottom: 20px;
      left: 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 15;
      pointer-events: none;
    }

    .feed-item {
      background: rgba(0, 0, 0, 0.65);
      border-left: 3px solid #d800ff;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 13px;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Controls Panel */
    .controls-panel {
      width: 100%;
      max-width: 960px;
      margin-top: 15px;
      background: #120e1a;
      border: 1px solid #2e2440;
      border-radius: 10px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
      transition: opacity 0.3s, transform 0.3s;
    }

    .controls-panel.hidden { display: none !important; }
    .button-group { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; letter-spacing: 1px; transition: all 0.15s ease; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); }
    .btn:active { transform: scale(0.95); }

    .btn-girl-hit { background: #8a1ca6; color: #fff; }
    .btn-girl-hit:hover { background: #a624c7; }
    .btn-girl-brutal { background: linear-gradient(135deg, #d800ff, #6200ea); color: #fff; border: 1px solid #ff88ff; }
    .btn-boy-hit { background: #005bb5; color: #fff; }
    .btn-boy-hit:hover { background: #0066cc; }
    .btn-boy-brutal { background: linear-gradient(135deg, #0066ff, #0022cc); color: #fff; border: 1px solid #44aaff; }
    .btn-util { background: #251d33; color: #ccc; border: 1px solid #44355e; }
    .btn-util:hover { background: #362a4a; color: #fff; }

    /* Hidden Toggle Settings Button */
    .secret-toggle-btn {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.2);
      font-size: 16px;
      cursor: pointer;
      z-index: 100;
    }
    .secret-toggle-btn:hover { color: rgba(255, 255, 255, 0.8); }
  </style>
</head>
<body>

  <div class="secret-hint">
    Streamer Mode Active: Press <span>H</span> key on your keyboard to <b>Hide / Show</b> controls completely!
  </div>

  <div class="arena-wrapper" id="arena">
    <div class="bg-split bg-girls" id="bg-girls"></div>
    <div class="bg-split bg-boys" id="bg-boys"></div>
    <div class="center-divider" id="center-line"></div>

    <div class="hud-top">
      <!-- Girls Scoreboard -->
      <div class="team-score-box team-girls">
        <span class="score-number" id="girl-wins">0</span>
        <span class="team-name">GIRLS</span>
      </div>

      <!-- Boys Scoreboard -->
      <div class="team-score-box team-boys">
        <span class="team-name">BOYS</span>
        <span class="score-number" id="boy-wins">0</span>
      </div>
    </div>

    <!-- Replace the SVGs with proper PNG Images. Ensure these files are in the same folder as your HTML! -->
    <img src="girl.png" alt="Girl Fighter" class="avatar avatar-left" id="avatar-girl">
    <img src="boy.png" alt="Boy Fighter" class="avatar avatar-right" id="avatar-boy">

    <div class="announcement" id="announcement-text"></div>
    <div class="action-feed" id="action-feed"></div>

    <button class="secret-toggle-btn" onclick="toggleControls()" title="Toggle Settings Controls">⚙</button>
  </div>

  <div class="controls-panel" id="controls-panel">
    <div class="button-group">
      <button class="btn btn-girl-hit" onclick="attack('girl', false)">Girls Hit (1)</button>
      <button class="btn btn-girl-brutal" onclick="attack('girl', true)">BRUTALITY! (10)</button>
      <button class="btn btn-boy-hit" onclick="attack('boy', false)">Boys Hit (1)</button>
      <button class="btn btn-boy-brutal" onclick="attack('boy', true)">BRUTALITY! (10)</button>
    </div>

    <div class="button-group">
      <button class="btn btn-util" onclick="resetMatch()">⚡ Reset Match</button>
      <button class="btn btn-util" onclick="resetScores()">🔄 Zero Scores</button>
      <button class="btn btn-util" onclick="toggleControls()">👁 Hide Controls (Press H)</button>
    </div>
  </div>

  <script>
    // PURE TUG-OF-WAR LOGIC
    // The line starts at 50% (the exact center).
    // 0% means the boys pulled it all the way to their side (Boys Win).
    // 100% means the girls pulled it all the way to their side (Girls Win).
    let linePosition = 50; 
    let girlWins = 0;
    let boyWins = 0;
    
    // Prevents extra clicks from counting while waiting for the round to reset
    let isMatchActive = true; 

    const girlMoves = ["SAIS STRIKE!", "TELEPORT KICK!", "BLOOD CLOT!", "DEATH SENTENCE!"];
    const boyMoves = ["ICE BLAST!", "GET OVER HERE!", "SHADOW KICK!", "LIGHTNING!"];

    // Update Visuals based strictly on the line's percentage
    function updateVisuals() {
      // Keep it strictly within 0% to 100% boundaries visually
      let displayPosition = linePosition;
      if (displayPosition > 100) displayPosition = 100;
      if (displayPosition < 0) displayPosition = 0;

      // Apply the exact percentage to the backgrounds and divider line
      document.getElementById("bg-girls").style.width = displayPosition + "%";
      document.getElementById("bg-boys").style.width = (100 - displayPosition) + "%";
      document.getElementById("center-line").style.left = displayPosition + "%";
    }

    function triggerAnimation(isBrutality) {
      const arena = document.getElementById("arena");
      arena.classList.remove("arena-hit", "arena-brutality");
      
      setTimeout(() => {
        if (isBrutality) {
          arena.classList.add("arena-brutality");
        } else {
          arena.classList.add("arena-hit");
        }
      }, 10);
    }

    function attack(attacker, isBrutality) {
      if (!isMatchActive) return; // Do nothing if someone already won this round!

      const announcement = document.getElementById("announcement-text");
      
      // Determine how far the line moves
      // A regular hit moves it 2.5%, a brutality moves it 25%
      let powerPush = isBrutality ? 25 : 2.5; 
      let moveName = "";

      if (attacker === 'girl') {
        // Girls push the line to the right (towards 100%)
        linePosition += powerPush;
        moveName = isBrutality ? "GIRLS BRUTALITY!" : girlMoves[Math.floor(Math.random() * girlMoves.length)];
        announcement.className = "announcement annct-girls active";
        addFeed("@Admin", "Rose");
        animateAvatar('avatar-girl');
      } else {
        // Boys push the line to the left (towards 0%)
        linePosition -= powerPush;
        moveName = isBrutality ? "BOYS BRUTALITY!" : boyMoves[Math.floor(Math.random() * boyMoves.length)];
        announcement.className = "announcement annct-boys active";
        addFeed("@Admin", "TikTok");
        animateAvatar('avatar-boy');
      }

      // Update tug-of-war position on screen
      updateVisuals();
      triggerAnimation(isBrutality);

      // Show Text
      announcement.innerText = moveName;
      setTimeout(() => announcement.classList.remove("active"), 1000);

      // --- CHECK WIN CONDITION: Edge Detection ---
      if (linePosition >= 100) {
        // Line hit the right edge -> Girls Win!
        girlWins++;
        document.getElementById("girl-wins").innerText = girlWins;
        isMatchActive = false; // Lock out controls
        setTimeout(resetMatch, 500); // Reset line after 0.5s (FAST RESET)
      } 
      else if (linePosition <= 0) {
        // Line hit the left edge -> Boys Win!
        boyWins++;
        document.getElementById("boy-wins").innerText = boyWins;
        isMatchActive = false; // Lock out controls
        setTimeout(resetMatch, 500); // Reset line after 0.5s (FAST RESET)
      }
    }

    // This now smoothly bounces your actual PNG image up and down slightly
    function animateAvatar(id) {
      const el = document.getElementById(id);
      el.style.transform = "scale(1.1) translateY(-15px)";
      setTimeout(() => el.style.transform = "scale(1) translateY(0)", 200);
    }

    function addFeed(user, gift) {
      const feed = document.getElementById("action-feed");
      const item = document.createElement("div");
      item.className = "feed-item";
      item.innerHTML = `<span style="color:#e855ff; font-weight:bold;">${user}</span> sent <span>${gift}</span>`;
      feed.appendChild(item);
      if (feed.children.length > 4) feed.removeChild(feed.children[0]);
    }

    // Puts the line back to 50% for the next round
    function resetMatch() {
      linePosition = 50;
      isMatchActive = true; 
      updateVisuals();
    }

    // Wipes the scoreboard entirely
    function resetScores() {
      resetMatch();
      girlWins = 0;
      boyWins = 0;
      document.getElementById("girl-wins").innerText = "0";
      document.getElementById("boy-wins").innerText = "0";
    }

    function toggleControls() {
      const panel = document.getElementById("controls-panel");
      panel.classList.toggle("hidden");
    }

    // Keyboard shortcut 'H' hides controls for the streamer
    window.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "h") toggleControls();
    });

    // Initialize layout on load
    updateVisuals();
  </script>
</body>
</html>
