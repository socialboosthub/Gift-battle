<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK TikTok Live Battle</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        #game-container {
            position: relative;
            width: 1920px;
            height: 1080px;
            background: #111;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,1);
        }

        .bg { position: absolute; top: 0; bottom: 0; width: 100vw; background-size: cover; background-position: center; transition: transform 0.3s ease; }
        #bg-boys { left: 0; background-image: url('1000096984.png'); width: 50%; z-index: 1; }
        #bg-girls { right: 0; background-image: url('1000096985.png'); width: 50%; z-index: 1; }

        #center-line {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 10px;
            background: linear-gradient(to bottom, #00d2ff, #3a7bd5, #ff00cc, #333399);
            z-index: 5;
            transform: translateX(-50%);
            transition: left 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 0 20px #fff;
        }

        .fighter {
            position: absolute;
            bottom: 100px;
            height: 600px; 
            z-index: 10;
            transition: all 0.3s ease;
        }
        #boy-fighter { left: 20%; transform: scaleX(1); } 
        #girl-fighter { right: 20%; transform: scaleX(-1); } 

        .score-board {
            position: absolute;
            top: 30px;
            font-family: 'Impact', sans-serif;
            font-size: 80px;
            color: white;
            text-shadow: 4px 4px 10px black, 0 0 20px currentColor;
            z-index: 20;
        }
        #boys-score { left: 50px; color: #00d2ff; }
        #girls-score { right: 50px; color: #ff00cc; }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake { animation: shake 0.5s; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="bg-boys"></div>
        <div id="bg-girls"></div>
        <div id="center-line"></div>
        
        <div id="boys-score">BOYS: 0</div>
        <div id="girls-score">GIRLS: 0</div>

        <img id="boy-fighter" class="fighter" src="placeholder_boy.gif" alt="Boy Fighter">
        <img id="girl-fighter" class="fighter" src="placeholder_girl.gif" alt="Girl Fighter">
    </div>

    <script>
        // Automatically connects to the Render cloud URL
        const socket = io();

        let position = 0; 
        let boysWins = 0;
        let girlsWins = 0;

                // Use direct internet links instead of uploading files!
                const boyCharacters = [
            { 
                name: "Scorpion", 
                idle: "https://upload.wikimedia.org/wikipedia/commons/a/a2/Transparent_square.png", 
                attack: "https://upload.wikimedia.org/wikipedia/commons/a/a2/Transparent_square.png", 
                heavy: "https://upload.wikimedia.org/wikipedia/commons/a/a2/Transparent_square.png", 
                hurt: "https://upload.wikimedia.org/wikipedia/commons/a/a2/Transparent_square.png" 
            }
        ];
        
        const girlCharacters = [
            { 
                name: "Kitana", 
                idle: "https://upload.wikimedia.org/wikipedia/commons/a/a2/Transparent_square.png", 
                attack: "https://upload.wikimedia.org/wikipedia/commons/a/a2/Transparent_square.png", 
                heavy: "https://upload.wikimedia.org/wikipedia/commons/a/a2/Transparent_square.png", 
                hurt: "https://upload.wikimedia.org/wikipedia/commons/a/a2/Transparent_square.png" 
            }
        ];


        let currentBoyIndex = 0;
        let currentGirlIndex = 0;

        const boyImg = document.getElementById('boy-fighter');
        const girlImg = document.getElementById('girl-fighter');
        const centerLine = document.getElementById('center-line');
        const bgBoys = document.getElementById('bg-boys');
        const bgGirls = document.getElementById('bg-girls');
        const container = document.getElementById('game-container');

        function loadFighters() {
            boyImg.src = boyCharacters[currentBoyIndex].idle;
            girlImg.src = girlCharacters[currentGirlIndex].idle;
        }
        loadFighters();

        socket.on('action', (data) => {
            if (data.team === 'boys') {
                if (data.type === 'move') executeMove('boys', 1, boyCharacters[currentBoyIndex].attack);
                if (data.type === 'heavy') executeMove('boys', 10, boyCharacters[currentBoyIndex].heavy);
                if (data.type === 'switch') {
                    currentBoyIndex = (currentBoyIndex + 1) % boyCharacters.length;
                    loadFighters();
                }
            } else if (data.team === 'girls') {
                if (data.type === 'move') executeMove('girls', 1, girlCharacters[currentGirlIndex].attack);
                if (data.type === 'heavy') executeMove('girls', 10, girlCharacters[currentGirlIndex].heavy);
                if (data.type === 'switch') {
                    currentGirlIndex = (currentGirlIndex + 1) % girlCharacters.length;
                    loadFighters();
                }
            }
        });

        function executeMove(team, damage, animationGif) {
            if (team === 'boys') {
                position -= damage;
                boyImg.src = animationGif;
                girlImg.src = girlCharacters[currentGirlIndex].hurt;
            } else {
                position += damage;
                girlImg.src = animationGif;
                boyImg.src = boyCharacters[currentBoyIndex].hurt;
            }

            if (damage >= 10) {
                container.classList.add('shake');
                setTimeout(() => container.classList.remove('shake'), 500);
            }

            updateUI();
            setTimeout(() => { loadFighters(); }, 1500);
            checkWin();
        }

        function updateUI() {
            let clampedPos = Math.max(-20, Math.min(20, position));
            let percentage = 50 + (clampedPos * 2.5); 
            
            centerLine.style.left = `${percentage}%`;
            bgBoys.style.width = `${percentage}%`;
            bgGirls.style.width = `${100 - percentage}%`;
        }

        function checkWin() {
            if (position <= -20) {
                boysWins++;
                document.getElementById('boys-score').innerText = `BOYS: ${boysWins}`;
                resetGame();
            } else if (position >= 20) {
                girlsWins++;
                document.getElementById('girls-score').innerText = `GIRLS: ${girlsWins}`;
                resetGame();
            }
        }

        function resetGame() {
            setTimeout(() => {
                position = 0;
                updateUI();
            }, 3000);
        }
    </script>
</body>
</html>
