<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mortal Kombat - Gift Battle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Impact', 'Segoe UI', Arial, sans-serif;
    }

    body {
      background-color: #08060c;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
    }

    .secret-hint {
      font-family: sans-serif;
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
      text-align: center;
    }

    .secret-hint span {
      background: #222;
      color: #00ffcc;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    /* 16:9 Arena Container */
    .arena-wrapper {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      position: relative;
      border: 3px solid #2a1f3d;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(176, 38, 255, 0.3);
      background: #000;
    }

    /* Hit & Brutality Animations */
    .arena-hit {
      animation: screenShake 0.3s cubic-bezier(.36,.07,.19,.97) both;
    }
    
    .arena-brutality {
      animation: brutalShake 0.6s cubic-bezier(.36,.07,.19,.97) both;
      filter: sepia(0.8) hue-rotate(-30deg) saturate(3) contrast(1.2);
    }

    @keyframes screenShake {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-8px, 5px); }
      40% { transform: translate(8px, -5px); }
      60% { transform: translate(-4px, 2px); }
      80% { transform: translate(4px, -2px); }
      100% { transform: translate(0, 0); }
    }

    @keyframes brutalShake {
      0% { transform: translate(0, 0) scale(1); }
      10% { transform: translate(-15px, 10px) scale(1.05); }
      20% { transform: translate(15px, -10px) scale(1.05); }
      30% { transform: translate(-15px, -10px) scale(1.05); }
      40% { transform: translate(15px, 10px) scale(1.05); }
      50% { transform: translate(-10px, 5px) scale(1.02); }
      70% { transform: translate(10px, -5px) scale(1.01); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* Dynamic Split Backgrounds */
    .bg-split {
      position: absolute;
      top: 0;
      bottom: 0;
      background-size: cover;
      background-position: center;
      transition: width 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .bg-girls {
      left: 0;
      width: 50%;
      background-color: #4a1942;
      background-image: url('girls.jpg');
      border-right: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 5px 0 20px rgba(176, 38, 255, 0.8);
      z-index: 2;
    }

    .bg-boys {
      right: 0;
      width: 50%;
      background-color: #193a4a;
      background-image: url('boys.jpg');
      border-left: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: -5px 0 20px rgba(0, 210, 255, 0.8);
      z-index: 1;
    }

    /* Moving Center Divider */
    .center-divider {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 6px;
      background: #ffffff;
      transform: translateX(-50%);
      box-shadow: 0 0 15px #fff, 0 0 30px #b026ff, 0 0 45px #00d2ff;
      z-index: 5;
      transition: left 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Top HUD Scoreboards */
    .hud-top {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .team-score-box {
      display: flex;
      align-items: stretch;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.6);
      background: #111;
    }

    .score-number {
      font-size: 32px;
      color: #fff;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 70px;
    }

    .team-name {
      font-size: 28px;
      color: #fff;
      padding: 8px 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 2px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    }

    .team-girls .team-name { background: linear-gradient(135deg, #ff1e56, #d800ff); }
    .team-boys .team-name { background: linear-gradient(135deg, #0066ff, #00d2ff); }

    /* Moving Avatar Wrappers */
    .avatar-wrapper {
      position: absolute;
      bottom: 15%;
      height: 60%;
      z-index: 6;
      transition: left 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }
    
    .avatar-wrapper-girl {
      transform: translateX(-100%);
      padding-right: 30px;
    }

    .avatar-wrapper-boy {
      transform: translateX(0);
      padding-left: 30px;
    }

    .avatar {
      height: 100%;
      width: auto;
      object-fit: contain;
      transition: transform 0.15s ease-out;
    }

    /* Win Announcement */
    .announcement {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      font-size: 56px;
      font-weight: 900;
      text-transform: uppercase;
      text-align: center;
      letter-spacing: 3px;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      white-space: nowrap;
    }

    .announcement.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.1);
    }

    .annct-girls { color: #fff; text-shadow: 0 0 10px #d800ff, 0 0 20px #d800ff, 4px 4px 0px #000; }
    .annct-boys { color: #fff; text-shadow: 0 0 10px #0066ff, 0 0 20px #0066ff, 4px 4px 0px #000; }

    /* Action Feed Log Containers */
    .action-feed {
      position: absolute;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 15;
      pointer-events: none;
    }

    .action-feed-girls { left: 15px; }
    .action-feed-boys { right: 15px; }

    .feed-item {
      background: rgba(0, 0, 0, 0.65);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 13px;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      direction: ltr;
      animation: fadeIn 0.3s ease;
    }

    .feed-item-girl { border-left: 3px solid #d800ff; }
    .feed-item-boy { border-left: 3px solid #00d2ff; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================
       GIFT HUD LEGEND OVERLAY (MIDDLE RIGHT VERTICAL)
       ========================================== */
    .gift-hud-overlay {
      position: absolute;
      top: 50%;
      right: 15px; /* Aligned to the right side where you circled */
      transform: translateY(-50%); /* Keeps it perfectly centered vertically */
      display: flex;
      flex-direction: column; /* Stack vertically instead of horizontally */
      gap: 5px; /* Tighter gap */
      background: rgba(10, 8, 16, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 6px;
      z-index: 18;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
    }

    .gift-hud-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      padding: 3px;
      min-width: 50px; /* Small and compact */
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: transform 0.2s;
    }

    .gift-hud-card.girl-side {
      border-right: 3px solid #d800ff; /* Side border instead of bottom */
    }

    .gift-hud-card.boy-side {
      border-right: 3px solid #00d2ff;
    }

    .gift-hud-card img {
      width: 22px; /* Smaller image */
      height: 22px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    }

    .gift-hud-title {
      font-size: 8px; /* Micro text */
      font-family: Arial, sans-serif;
      font-weight: bold;
      color: #bbb;
      margin-top: 2px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .gift-hud-action {
      font-size: 10px;
      font-family: 'Impact', sans-serif;
      color: #fff;
      margin-top: 1px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .gift-hud-card.girl-side .gift-hud-action { color: #ff77ff; }
    .gift-hud-card.boy-side .gift-hud-action { color: #66d9ff; }

    /* Controls Panel */
    .controls-panel {
      width: 100%;
      max-width: 960px;
      margin-top: 15px;
      background: #120e1a;
      border: 1px solid #2e2440;
      border-radius: 10px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
      transition: opacity 0.3s, transform 0.3s;
    }

    .controls-panel.hidden { display: none !important; }
    .button-group { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; letter-spacing: 1px; transition: all 0.15s ease; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); }
    .btn:active { transform: scale(0.95); }

    .btn-girl-hit { background: #8a1ca6; color: #fff; }
    .btn-girl-hit:hover { background: #a624c7; }
    .btn-girl-brutal { background: linear-gradient(135deg, #d800ff, #6200ea); color: #fff; border: 1px solid #ff88ff; }
    .btn-boy-hit { background: #005bb5; color: #fff; }
    .btn-boy-hit:hover { background: #0066cc; }
    .btn-boy-brutal { background: linear-gradient(135deg, #0066ff, #0022cc); color: #fff; border: 1px solid #44aaff; }
    .btn-util { background: #251d33; color: #ccc; border: 1px solid #44355e; }
    .btn-util:hover { background: #362a4a; color: #fff; }

    /* Live Battle Position Scores */
    .battle-scorebar {
      width: 100%;
      max-width: 960px;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 0;
      border: 2px solid #2e2440;
      border-radius: 10px;
      overflow: hidden;
      background: #0d0a13;
      box-shadow: 0 5px 20px rgba(0,0,0,0.45);
      font-family: Impact, 'Segoe UI', Arial, sans-serif;
    }

    .battle-score-side {
      flex: 1;
      min-width: 0;
      padding: 8px 14px;
      text-align: center;
      font-size: 15px;
      letter-spacing: 1px;
      color: #fff;
    }

    .battle-score-side.girls { background: linear-gradient(135deg, rgba(216,0,255,0.28), rgba(138,28,166,0.18)); }
    .battle-score-side.boys { background: linear-gradient(135deg, rgba(0,102,255,0.18), rgba(0,210,255,0.28)); }

    .battle-score-number {
      font-size: 28px;
      line-height: 1;
      font-weight: 900;
      display: block;
      margin-top: 3px;
    }

    .battle-score-center {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      font-size: 16px;
      font-weight: 900;
      background: #111;
    }

    .secret-toggle-btn {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.2);
      font-size: 16px;
      cursor: pointer;
      z-index: 100;
    }
    .secret-toggle-btn:hover { color: rgba(255, 255, 255, 0.8); }

    /* FULLSCREEN / STREAMER VIEWER MODE */
    .fullscreen-btn {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 999999;
      width: 52px;
      height: 52px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 50%;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
    }

    .fullscreen-btn:active { transform: scale(0.92); }

    .arena-wrapper:fullscreen {
      width: 100vw;
      height: 100vh;
      max-width: none;
      aspect-ratio: auto;
      border: none;
      border-radius: 0;
      box-shadow: none;
      background: #000;
    }

    .arena-wrapper:fullscreen .bg-split { height: 100%; }
    .arena-wrapper:fullscreen .hud-top { top: 3%; left: 3%; right: 3%; }
    .arena-wrapper:fullscreen .action-feed { bottom: 3%; }
    .arena-wrapper:fullscreen .gift-hud-overlay { right: 2%; top: 50%; } /* stays on the right in fullscreen */
    .arena-wrapper:fullscreen .secret-toggle-btn { display: none; }

    body.viewer-mode {
      padding: 0;
      margin: 0;
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
      background: #000;
    }

    body.viewer-mode .secret-hint,
    body.viewer-mode .battle-scorebar,
    body.viewer-mode .controls-panel,
    body.viewer-mode #tiktok-debug {
      display: none !important;
    }

    body.viewer-mode .arena-wrapper {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      max-width: none;
      aspect-ratio: 16 / 9;
      border: none;
      border-radius: 0;
      box-shadow: none;
      margin: 0;
    }

    @media (orientation: landscape) {
      body.viewer-mode .arena-wrapper {
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
      }
    }

    @media (orientation: portrait) {
      body.viewer-mode .arena-wrapper {
        width: 100vw;
        height: calc(100vw * 9 / 16);
      }
    }

    html:fullscreen, body:fullscreen {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
    }
  </style>
</head>
<body>

  <!-- Preload character images -->
  <div style="display: none;">
    <img src="kitana_idle.png"><img src="kitana_attack.png">
    <img src="mileena_idle.png"><img src="mileena_attack.png">
    <img src="jade_idle.png"><img src="jade_attack.png">
    <img src="subzero_idle.png"><img src="subzero_attack.png">

    <img src="liukang_idle.png"><img src="liukang_attack.png">
  </div>

  <div class="secret-hint">
    Streamer Mode Active: Press <span>H</span> key on your keyboard to <b>Hide / Show</b> controls completely!
  </div>

  <div class="arena-wrapper" id="arena">
    <div class="bg-split bg-girls" id="bg-girls"></div>
    <div class="bg-split bg-boys" id="bg-boys"></div>
    <div class="center-divider" id="center-line"></div>

    <div class="hud-top">
      <div class="team-score-box team-girls">
        <span class="score-number" id="girl-wins">0</span>
        <span class="team-name" id="girl-name-label">KITANA</span>
      </div>

      <div class="team-score-box team-boys">
        <span class="team-name" id="boy-name-label">SUB-ZERO</span>

    </div>

    <!-- Avatars wrapped in containers -->
    <div class="avatar-wrapper avatar-wrapper-girl" id="wrap-girl">

         TIKTOK GIFT HUD OVERLAY (COMPACT VERTICAL LIST)
         ========================================== -->
    <div class="gift-hud-overlay">
      <!-- ROSE -->
      <div class="gift-hud-card girl-side">

        <span class="gift-hud-title">Mind Blown</span>
        <span class="gift-hud-action">+50 BRUTAL</span>
      </div>

      <!-- LIKE POP -->
      <div class="gift-hud-card girl-side">
        <img src="https://p16-webcast.tiktokcdn.com/webcast/40dbf20c4fa4830ba2b5be027582b13c~tplv-obj.png" alt="Like-Pop">
        <span class="gift-hud-title">Like-Pop</span>
        <span class="gift-hud-action">SWITCH ⚡</span>

      <!-- PAPER CRANE -->
      <div class="gift-hud-card boy-side">
        <img src="https://p16-webcast.tiktokcdn.com/webcast/fa7be3ca4523a6ff33604bcbd0f38b34~tplv-obj.png" alt="Paper Crane">
        <span class="gift-hud-title">Crane</span>
        <span class="gift-hud-action">SWITCH ⚡</span>
      </div>

      <!-- 100 LIKES -->
      <div class="gift-hud-card girl-side">
        <img src="https://p16-webcast.tiktokcdn.com/webcast/6f53e346f0df576a47012921cb1ed5aa~tplv-obj.png" alt="100 Likes" onerror="this.src='https://p16-webcast.tiktokcdn.com/webcast/eb9321ef1c9118e6988892419c8f070b~tplv-obj.png'">

    <button class="secret-toggle-btn" onclick="toggleControls()" title="Toggle Settings Controls">⚙</button>

  <button class="fullscreen-btn" id="fullscreen-btn" onclick="startViewerMode()" title="Full Screen">⛶</button>

  <!-- Live battle position score -->
  <div class="battle-scorebar" id="battle-scorebar">

      GIRLS
      <span class="battle-score-number" id="girl-battle-score">50</span>
    </div>
    <div class="battle-score-center">VS</div>
    <div class="battle-score-side boys">
      BOYS
      <span class="battle-score-number" id="boy-battle-score">50</span>

  <div class="controls-panel" id="controls-panel">

      <button class="btn btn-girl-hit" onclick="attack('girl', false)">Girls Hit (5)</button>
      <button class="btn btn-girl-brutal" onclick="attack('girl', true)">BRUTALITY! (50)</button>
      <button class="btn btn-boy-hit" onclick="attack('boy', false)">Boys Hit (5)</button>
      <button class="btn btn-boy-brutal" onclick="attack('boy', true)">BRUTALITY! (50)</button>
    </div>

    <div class="button-group">
      <button class="btn btn-util" onclick="switchCharacter('girl')">⚡ Switch Girl</button>
      <button class="btn btn-util" onclick="switchCharacter('boy')">⚡ Switch Boy</button>
      <button class="btn btn-util" onclick="resetMatch()">⚡ Reset Match</button>
      <button class="btn btn-util" onclick="resetScores()">🔄 Zero Scores</button>
      <button class="btn btn-util" onclick="toggleControls()">👁 Hide Controls (Press H)</button>
    </div>
  </div>

  <script>
    let linePosition = 50; 
    let girlWins = 0;
    let boyWins = 0;
    let isMatchActive = true; 

    const girlCharacters = [
      { name: "KITANA", idle: "kitana_idle.png", attack: "kitana_attack.png" },
      { name: "MILEENA", idle: "mileena_idle.png", attack: "mileena_attack.png" },
      { name: "JADE", idle: "jade_idle.png", attack: "jade_attack.png" }
    ];

    const boyCharacters = [
      { name: "SUB-ZERO", idle: "subzero_idle.png", attack: "subzero_attack.png" },
      { name: "SCORPION", idle: "scorpion_idle.png", attack: "scorpion_attack.png" },
      { name: "LIU KANG", idle: "liukang_idle.png", attack: "liukang_attack.png" }
    ];

    let currentGirlIndex = 0;
    let currentBoyIndex = 0;

    function updateVisuals() {
      let displayPosition = linePosition;
      if (displayPosition > 100) displayPosition = 100;
      if (displayPosition < 0) displayPosition = 0;

      document.getElementById("bg-girls").style.width = displayPosition + "%";
      document.getElementById("bg-boys").style.width = (100 - displayPosition) + "%";
      document.getElementById("center-line").style.left = displayPosition + "%";

      document.getElementById("wrap-girl").style.left = displayPosition + "%";
      document.getElementById("wrap-boy").style.left = displayPosition + "%";

      const girlBattleScore = Math.round(displayPosition);
      const boyBattleScore = 100 - girlBattleScore;

      document.getElementById("girl-battle-score").innerText = girlBattleScore;
      document.getElementById("boy-battle-score").innerText = boyBattleScore;
    }

    function triggerAnimation(isBrutality) {
      const arena = document.getElementById("arena");
      arena.classList.remove("arena-hit", "arena-brutality");
      setTimeout(() => {
        if (isBrutality) {
          arena.classList.add("arena-brutality");
        } else {
          arena.classList.add("arena-hit");
        }
      }, 10);
    }

    function attack(
      attacker,
      isBrutality,
      username = "Unknown",
      giftName = "",
      customPower = null,
      actionLabel = ""
    ) {
      if (!isMatchActive) return;

      const defaultPower = isBrutality ? 50 : 5;
      const suppliedPower = Number(customPower);

      const powerPush =
        Number.isFinite(suppliedPower) && suppliedPower > 0
          ? suppliedPower
          : defaultPower;

      const feedAction =
        actionLabel ||
        giftName ||
        (isBrutality ? "Brutality" : "Hit");

      if (attacker === 'girl') {
        linePosition += powerPush;
        addFeed('girl', username, feedAction);
        animateCharacter('girl');
      } else {
        linePosition -= powerPush;
        addFeed('boy', username, feedAction);
        animateCharacter('boy');
      }

      updateVisuals();
      triggerAnimation(isBrutality);

      const announcement =
        document.getElementById("announcement-text");

      if (linePosition >= 100) {
        girlWins++;
        document.getElementById("girl-wins").innerText = girlWins;
        isMatchActive = false;

        announcement.className =
          "announcement annct-girls active";
        announcement.innerText =
          "GIRLS WIN!";

        setTimeout(() => {
          announcement.classList.remove("active");
          resetMatch();
        }, 500);
      }
      else if (linePosition <= 0) {
        boyWins++;
        document.getElementById("boy-wins").innerText = boyWins;
        isMatchActive = false;

        announcement.className =
          "announcement annct-boys active";
        announcement.innerText =
          "BOYS WIN!";

        setTimeout(() => {
          announcement.classList.remove("active");
          resetMatch();
        }, 500);
      }
    }

    function animateCharacter(fighter) {
      const isGirl = (fighter === 'girl');
      const imgEl = document.getElementById(isGirl ? 'avatar-girl' : 'avatar-boy');
      const charData = isGirl ? girlCharacters[currentGirlIndex] : boyCharacters[currentBoyIndex];
      
      imgEl.src = charData.attack;
      imgEl.style.transform = isGirl ? "scale(1.1) translateX(15px)" : "scale(1.1) translateX(-15px)";

      setTimeout(() => {
        imgEl.src = charData.idle;
        imgEl.style.transform = "scale(1) translateX(0)";
      }, 600);
    }

    function switchCharacter(side, username = "@Admin", giftName = null) {
      if (side === 'girl') {
        currentGirlIndex = (currentGirlIndex + 1) % girlCharacters.length;
        const char = girlCharacters[currentGirlIndex];
        document.getElementById("girl-name-label").innerText = char.name;
        document.getElementById("avatar-girl").src = char.idle;
        addFeed('girl', username, giftName || "Like-Pop");
      } else {
        currentBoyIndex = (currentBoyIndex + 1) % boyCharacters.length;
        const char = boyCharacters[currentBoyIndex];
        document.getElementById("boy-name-label").innerText = char.name;
        document.getElementById("avatar-boy").src = char.idle;
        addFeed('boy', username, giftName || "Paper Crane");
      }
    }

    function addFeed(side, user, gift) {
      const feed = document.getElementById(side === 'girl' ? "feed-girls" : "feed-boys");
      const item = document.createElement("div");
      
      const sideClass = side === 'girl' ? 'feed-item-girl' : 'feed-item-boy';
      const nameColor = side === 'girl' ? '#e855ff' : '#00d2ff';
      
      item.className = `feed-item ${sideClass}`;
      item.innerHTML = `<span style="color:${nameColor}; font-weight:bold;">${user}</span> sent <span>${gift}</span>`;
      
      feed.appendChild(item);
      if (feed.children.length > 3) feed.removeChild(feed.children[0]);
    }

    function resetMatch() {
      linePosition = 50;
      isMatchActive = true; 
      updateVisuals();
    }

    function resetScores() {
      resetMatch();
      girlWins = 0;
      boyWins = 0;
      document.getElementById("girl-wins").innerText = "0";
      document.getElementById("boy-wins").innerText = "0";
    }

    function toggleControls() {
      const panel = document.getElementById("controls-panel");
      panel.classList.toggle("hidden");
    }

    window.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "h") toggleControls();
    });

    updateVisuals();

    async function startViewerMode() {
      unlockBattleVoice();
      startBattleMusic();
      const arena = document.getElementById("arena");
      document.body.classList.add("viewer-mode");

      try {
        if (!document.fullscreenElement && arena.requestFullscreen) {
          await arena.requestFullscreen();
        }
      } catch (error) {
        console.log("Fullscreen request was blocked:", error);
      }

      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock("landscape");
        }
      } catch (error) {
        console.log("Landscape lock not available:", error);
      }
    }

    async function exitViewerMode() {
      document.body.classList.remove("viewer-mode");
      if (document.fullscreenElement && document.exitFullscreen) {
        try {
          await document.exitFullscreen();
        } catch (error) {
          console.log("Could not exit fullscreen:", error);
        }
      }
    }

    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement) {
        document.body.classList.remove("viewer-mode");
      }
    });
  </script>

  <!-- BACKGROUND MUSIC -->
  <audio id="battle-background-music" preload="auto" playsinline></audio>

  <!-- SOCKET.IO & TIKTOK CLIENT -->
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="tiktok-client.js"></script>
