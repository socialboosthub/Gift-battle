<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mortal Kombat - TikTok Gift Battle</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;font-family:Impact,"Segoe UI",Arial,sans-serif}html,body{width:100%;min-height:100%}body{background:#08060c;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;overflow-x:hidden}.secret-hint{font:13px Arial,sans-serif;color:#777;margin-bottom:10px;text-align:center}.secret-hint span{background:#222;color:#00ffcc;padding:2px 6px;border-radius:4px;font-weight:bold}
.arena-wrapper{width:min(100%,540px);max-width:540px;aspect-ratio:9/16;position:relative;border:3px solid #2a1f3d;border-radius:12px;overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.9),0 0 15px rgba(176,38,255,.3);background:#000}.bg-split{position:absolute;top:0;bottom:0;background-size:cover;background-position:center;transition:width .5s cubic-bezier(.25,1,.5,1)}.bg-girls{left:0;width:50%;background-color:#4a1942;background-image:url("girls.jpg");border-right:2px solid rgba(255,255,255,.8);box-shadow:5px 0 20px rgba(176,38,255,.8);z-index:2}.bg-boys{right:0;width:50%;background-color:#193a4a;background-image:url("boys.jpg");border-left:2px solid rgba(255,255,255,.8);box-shadow:-5px 0 20px rgba(0,210,255,.8);z-index:1}.center-divider{position:absolute;left:50%;top:0;bottom:0;width:6px;background:#fff;transform:translateX(-50%);box-shadow:0 0 15px #fff,0 0 30px #b026ff,0 0 45px #00d2ff;z-index:5;transition:left .5s cubic-bezier(.25,1,.5,1)}
.hud-top{position:absolute;top:15px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:20}.team-score-box{display:flex;align-items:stretch;border-radius:8px;overflow:hidden;border:2px solid rgba(255,255,255,.3);box-shadow:0 6px 15px rgba(0,0,0,.6);background:#111}.score-number{font-size:22px;color:#fff;padding:6px 11px;display:flex;align-items:center;justify-content:center;min-width:48px}.team-name{font-size:19px;color:#fff;padding:6px 12px;display:flex;align-items:center;justify-content:center;letter-spacing:1.5px;text-shadow:1px 1px 3px rgba(0,0,0,.5)}.team-girls .team-name{background:linear-gradient(135deg,#ff1e56,#d800ff)}.team-boys .team-name{background:linear-gradient(135deg,#0066ff,#00d2ff)}
/* SMALL GIFT PANELS - matched to the requested reference */.gift-panel{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;z-index:15;pointer-events:none;background:rgba(0,0,0,.78);padding:7px 9px;border-radius:9px;border:1px solid rgba(255,255,255,.15);box-shadow:0 5px 15px rgba(0,0,0,.5)}.gift-panel.girls-side{left:7px;border-left:3px solid #d800ff}.gift-panel.boys-side{right:7px;border-right:3px solid #00d2ff}.gift-item{display:flex;align-items:center;gap:7px;font:800 10px "Segoe UI",Arial,sans-serif;color:#fff;text-shadow:1px 1px 2px #000;white-space:nowrap}.gift-icon{width:23px;height:23px;object-fit:contain;border-radius:4px;background:rgba(255,255,255,.05);flex:none}.gift-info{display:flex;flex-direction:column;justify-content:center;line-height:1.05}.gift-name{font-size:9px;color:#ddd;text-transform:uppercase;letter-spacing:.3px}.gift-points{color:#ffcc00;font-size:11px}.gift-action{color:#00ffcc;font-size:9px}
/* SMALL CHARACTERS - matched to the requested reference */.avatar-wrapper{position:absolute;bottom:5%;height:32%;z-index:6;transition:left .5s cubic-bezier(.25,1,.5,1)}.avatar-wrapper-girl{transform:translateX(-100%);padding-right:12px}.avatar-wrapper-boy{transform:translateX(0);padding-left:12px}.avatar{height:100%;width:auto;object-fit:contain;transition:transform .15s ease-out}
.announcement{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) scale(.5);font-size:42px;font-weight:900;text-transform:uppercase;text-align:center;letter-spacing:2px;opacity:0;pointer-events:none;z-index:70;transition:all .2s cubic-bezier(.175,.885,.32,1.275);white-space:nowrap}.announcement.active{opacity:1;transform:translate(-50%,-50%) scale(1.05)}.annct-girls{color:#fff;text-shadow:0 0 10px #d800ff,0 0 20px #d800ff,4px 4px 0 #000}.annct-boys{color:#fff;text-shadow:0 0 10px #0066ff,0 0 20px #0066ff,4px 4px 0 #000}
.action-feed{position:absolute;bottom:10px;display:flex;flex-direction:column;gap:4px;z-index:15;pointer-events:none}.action-feed-girls{left:7px}.action-feed-boys{right:7px}.feed-item{background:rgba(0,0,0,.65);padding:3px 6px;border-radius:4px;font:9px Arial,sans-serif;display:flex;align-items:center;gap:5px;text-align:left;animation:fadeIn .3s ease}.feed-item-girl{border-left:3px solid #d800ff}.feed-item-boy{border-left:3px solid #00d2ff}.feed-gift-icon{width:17px;height:17px;object-fit:contain}@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.battle-scorebar{width:min(100%,540px);max-width:540px;margin-top:10px;display:flex;justify-content:center;align-items:stretch;border:2px solid #2e2440;border-radius:10px;overflow:hidden;background:#0d0a13;box-shadow:0 5px 20px rgba(0,0,0,.45)}.battle-score-side{flex:1;min-width:0;padding:7px 12px;text-align:center;font-size:13px;letter-spacing:1px}.battle-score-side.girls{background:linear-gradient(135deg,rgba(216,0,255,.28),rgba(138,28,166,.18))}.battle-score-side.boys{background:linear-gradient(135deg,rgba(0,102,255,.18),rgba(0,210,255,.28))}.battle-score-number{font-size:23px;line-height:1;font-weight:900;display:block;margin-top:3px}.battle-score-center{display:flex;align-items:center;justify-content:center;padding:0 7px;font-size:14px;font-weight:900;background:#111}
.controls-panel{width:min(100%,540px);max-width:540px;margin-top:12px;background:#120e1a;border:1px solid #2e2440;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 5px 20px rgba(0,0,0,.5)}.controls-panel.hidden{display:none!important}.button-group{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.btn{padding:9px 13px;border:none;border-radius:7px;font-size:12px;font-weight:bold;cursor:pointer;letter-spacing:.5px;transition:all .15s ease;box-shadow:0 4px 10px rgba(0,0,0,.4)}.btn:active{transform:scale(.95)}.btn-girl-hit{background:#8a1ca6;color:#fff}.btn-girl-brutal{background:linear-gradient(135deg,#d800ff,#6200ea);color:#fff;border:1px solid #ff88ff}.btn-boy-hit{background:#005bb5;color:#fff}.btn-boy-brutal{background:linear-gradient(135deg,#0066ff,#0022cc);color:#fff;border:1px solid #44aaff}.btn-util{background:#251d33;color:#ccc;border:1px solid #44355e}
.fullscreen-btn{position:fixed;right:14px;bottom:14px;z-index:999999;width:52px;height:52px;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(0,0,0,.75);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,.7)}.secret-toggle-btn{position:absolute;bottom:8px;right:8px;width:24px;height:24px;background:transparent;border:none;color:rgba(255,255,255,.2);font-size:16px;cursor:pointer;z-index:100}
.arena-hit{animation:screenShake .3s cubic-bezier(.36,.07,.19,.97) both}.arena-brutality{animation:brutalShake .6s cubic-bezier(.36,.07,.19,.97) both;filter:sepia(.8) hue-rotate(-30deg) saturate(3) contrast(1.2)}@keyframes screenShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,5px)}40%{transform:translate(8px,-5px)}60%{transform:translate(-4px,2px)}80%{transform:translate(4px,-2px)}}@keyframes brutalShake{0%,100%{transform:translate(0,0) scale(1)}10%{transform:translate(-15px,10px) scale(1.05)}20%{transform:translate(15px,-10px) scale(1.05)}30%{transform:translate(-15px,-10px) scale(1.05)}40%{transform:translate(15px,10px) scale(1.05)}50%{transform:translate(-10px,5px) scale(1.02)}70%{transform:translate(10px,-5px) scale(1.01)}}
/* VIEWER MODE FIX: centered 9:16 card, NOT stretched to full phone height */body.viewer-mode{padding:0;margin:0;width:100vw;height:100vh;min-height:100vh;overflow:hidden;background:#000;justify-content:center;align-items:center}body.viewer-mode .secret-hint,body.viewer-mode .battle-scorebar,body.viewer-mode .controls-panel,body.viewer-mode #tiktok-debug{display:none!important}body.viewer-mode .arena-wrapper{width:min(92vw,540px);max-width:540px;height:auto;aspect-ratio:9/16;max-height:96vh;border:3px solid #2a1f3d;border-radius:12px;box-shadow:0 0 30px rgba(0,0,0,.9),0 0 15px rgba(176,38,255,.3);margin:0}
@media(max-width:700px){body{padding:8px}.arena-wrapper{width:min(100%,540px)}.hud-top{top:12px;left:8px;right:8px}.team-name{font-size:17px;padding:5px 8px}.score-number{font-size:19px;min-width:40px;padding:5px 7px}.gift-panel{padding:6px 7px;gap:3px}.gift-panel.girls-side{left:5px}.gift-panel.boys-side{right:5px}.gift-item{gap:5px;font-size:9px}.gift-icon{width:21px;height:21px}.gift-name{font-size:8px}.gift-points{font-size:10px}.gift-action{font-size:8px}.avatar-wrapper{height:31%;bottom:5%}.announcement{font-size:30px}.feed-item{font-size:8px;padding:3px 5px}.feed-gift-icon{width:16px;height:16px}.btn{font-size:11px;padding:8px 10px}}@media(max-width:420px){.gift-panel{transform:translateY(-50%) scale(.92);transform-origin:center}.team-name{font-size:15px}.score-number{font-size:17px}.avatar-wrapper{height:29%}body.viewer-mode .arena-wrapper{width:94vw;max-height:94vh}}
</style>
</head>
<body>
<div style="display:none"><img src="kitana_idle.png"><img src="kitana_attack.png"><img src="mileena_idle.png"><img src="mileena_attack.png"><img src="jade_idle.png"><img src="jade_attack.png"><img src="subzero_idle.png"><img src="subzero_attack.png"><img src="scorpion_idle.png"><img src="scorpion_attack.png"><img src="liukang_idle.png"><img src="liukang_attack.png"><img src="icon_100likes.png"><img src="icon_follow.png"><img src="icon_rose.png"><img src="icon_rosa.png"><img src="icon_tiktok.png"><img src="icon_necklace.png"></div>
<div class="secret-hint">Streamer Mode Active: Press <span>H</span> to hide/show controls</div>
<div class="arena-wrapper" id="arena">
<div class="bg-split bg-girls" id="bg-girls"></div><div class="bg-split bg-boys" id="bg-boys"></div><div class="center-divider" id="center-line"></div>
<div class="hud-top"><div class="team-score-box team-girls"><span class="score-number" id="girl-wins">0</span><span class="team-name" id="girl-name-label">KITANA</span></div><div class="team-score-box team-boys"><span class="team-name" id="boy-name-label">SUB-ZERO</span><span class="score-number" id="boy-wins">0</span></div></div>
<div class="gift-panel girls-side"><div class="gift-item"><img src="icon_100likes.png" class="gift-icon"><div class="gift-info"><span class="gift-name">100x Likes</span><span class="gift-points">+1 Pt</span></div></div><div class="gift-item"><img src="icon_rose.png" class="gift-icon"><div class="gift-info"><span class="gift-name">Rose</span><span class="gift-points">+5 Pts</span></div></div><div class="gift-item"><img src="icon_rosa.png" class="gift-icon"><div class="gift-info"><span class="gift-name">Rosa</span><span class="gift-points">+50 Pts</span></div></div><div class="gift-item"><img id="bouquet-rule-icon" class="gift-icon"><div class="gift-info"><span class="gift-name">Bouquet</span><span class="gift-action">Character Changed</span></div></div></div>
<div class="gift-panel boys-side"><div class="gift-item"><img src="icon_follow.png" class="gift-icon"><div class="gift-info"><span class="gift-name">Follow</span><span class="gift-points">+1 Pt</span></div></div><div class="gift-item"><img src="icon_tiktok.png" class="gift-icon"><div class="gift-info"><span class="gift-name">TikTok</span><span class="gift-points">+5 Pts</span></div></div><div class="gift-item"><img src="icon_necklace.png" class="gift-icon"><div class="gift-info"><span class="gift-name">Necklace</span><span class="gift-points">+50 Pts</span></div></div><div class="gift-item"><img id="confetti-rule-icon" class="gift-icon"><div class="gift-info"><span class="gift-name">Confetti</span><span class="gift-action">Character Changed</span></div></div></div>
<div class="avatar-wrapper avatar-wrapper-girl" id="wrap-girl"><img src="kitana_idle.png" class="avatar" id="avatar-girl"></div><div class="avatar-wrapper avatar-wrapper-boy" id="wrap-boy"><img src="subzero_idle.png" class="avatar" id="avatar-boy"></div>
<div class="announcement" id="announcement-text"></div><div class="action-feed action-feed-girls" id="feed-girls"></div><div class="action-feed action-feed-boys" id="feed-boys"></div><button class="secret-toggle-btn" onclick="toggleControls()">⚙</button>
</div>
<button class="fullscreen-btn" onclick="startViewerMode()">⛶</button>
<div class="battle-scorebar" id="battle-scorebar"><div class="battle-score-side girls">GIRLS<span class="battle-score-number" id="girl-battle-score">100</span></div><div class="battle-score-center">VS</div><div class="battle-score-side boys">BOYS<span class="battle-score-number" id="boy-battle-score">100</span></div></div>
<div class="controls-panel" id="controls-panel"><div class="button-group"><button class="btn btn-girl-hit" onclick="attack('girl',false,null,'Rose',5)">🌹 Girls Rose (5)</button><button class="btn btn-girl-brutal" onclick="attack('girl',true,null,'Rosa',50)">🌹 Girls Rosa (50)</button><button class="btn btn-boy-hit" onclick="attack('boy',false,null,'TikTok',5)">🎵 Boys TikTok (5)</button><button class="btn btn-boy-brutal" onclick="attack('boy',true,null,'Necklace',50)">💎 Boys Necklace (50)</button></div><div class="button-group"><button class="btn btn-util" onclick="switchCharacter('girl',null,'Bouquet')">💐 Switch Girl</button><button class="btn btn-util" onclick="switchCharacter('boy',null,'Confetti')">🎉 Switch Boy</button><button class="btn btn-util" onclick="resetMatch()">⚡ Reset</button><button class="btn btn-util" onclick="resetScores()">🔄 Zero</button><button class="btn btn-util" onclick="toggleControls()">👁 Hide</button></div></div>
<audio id="battle-background-music" preload="auto" playsinline></audio>
<script>
let linePosition=100,girlWins=0,boyWins=0,isMatchActive=true;const girlCharacters=[{name:"KITANA",idle:"kitana_idle.png",attack:"kitana_attack.png"},{name:"MILEENA",idle:"mileena_idle.png",attack:"mileena_attack.png"},{name:"JADE",idle:"jade_idle.png",attack:"jade_attack.png"}],boyCharacters=[{name:"SUB-ZERO",idle:"subzero_idle.png",attack:"subzero_attack.png"},{name:"SCORPION",idle:"scorpion_idle.png",attack:"scorpion_attack.png"},{name:"LIU KANG",idle:"liukang_idle.png",attack:"liukang_attack.png"}];let currentGirlIndex=0,currentBoyIndex=0;
const bouquetSVG='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><radialGradient id="p"><stop offset="0" stop-color="#ff8cff"/><stop offset="1" stop-color="#d000ff"/></radialGradient></defs><path d="M50 95 L43 48 L57 48 Z" fill="#8b4513"/><path d="M50 70 C30 65 18 50 20 35 C38 36 48 48 50 70Z" fill="#39b54a"/><path d="M50 70 C70 65 82 50 80 35 C62 36 52 48 50 70Z" fill="#2fa84f"/><circle cx="28" cy="30" r="17" fill="url(#p)"/><circle cx="50" cy="22" r="18" fill="#ff4fa3"/><circle cx="72" cy="30" r="17" fill="#ff77d9"/><circle cx="39" cy="43" r="17" fill="#d800ff"/><circle cx="61" cy="43" r="17" fill="#ff3ca6"/><circle cx="50" cy="32" r="9" fill="#ffd700"/></svg>`);
const confettiSVG='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect x="25" y="20" width="50" height="65" rx="6" fill="#fff" stroke="#00d2ff" stroke-width="4"/><path d="M25 35 L50 50 L75 35" fill="none" stroke="#00d2ff" stroke-width="4"/><circle cx="20" cy="18" r="6" fill="#ff3cac"/><circle cx="80" cy="20" r="6" fill="#ffd700"/><circle cx="15" cy="55" r="5" fill="#00ff88"/><circle cx="85" cy="58" r="5" fill="#ff6600"/><rect x="12" y="75" width="10" height="5" rx="2" fill="#ff00ff" transform="rotate(-25 12 75)"/><rect x="78" y="75" width="10" height="5" rx="2" fill="#00d2ff" transform="rotate(25 78 75)"/><circle cx="50" cy="70" r="5" fill="#ffcc00"/></svg>`);
document.getElementById("bouquet-rule-icon").src=bouquetSVG;document.getElementById("confetti-rule-icon").src=confettiSVG;
function getRandomUsername(){const n=["shadow","kombat","ghost","ninja","gamer","pro","alpha","toxic","queen","king","guest","user"];return n[Math.floor(Math.random()*n.length)]+Math.floor(Math.random()*99999)}
function updateVisuals(){let p=Math.max(0,Math.min(200,linePosition)),v=p/2;document.getElementById("bg-girls").style.width=v+"%";document.getElementById("bg-boys").style.width=(100-v)+"%";document.getElementById("center-line").style.left=v+"%";document.getElementById("wrap-girl").style.left=v+"%";document.getElementById("wrap-boy").style.left=v+"%";document.getElementById("girl-battle-score").innerText=Math.round(p);document.getElementById("boy-battle-score").innerText=200-Math.round(p)}
function triggerAnimation(b){const a=document.getElementById("arena");a.classList.remove("arena-hit","arena-brutality");void a.offsetWidth;a.classList.add(b?"arena-brutality":"arena-hit")}
function showCharacterChanged(s){const a=document.getElementById("announcement-text");a.className="announcement "+(s==="girl"?"annct-girls":"annct-boys")+" active";a.innerText="CHARACTER CHANGED";setTimeout(()=>a.classList.remove("active"),900)}
function attack(attacker,isBrutality,username=null,giftName="",customPower=null,actionLabel=""){if(!isMatchActive)return;if(!username||username==="Unknown")username=getRandomUsername();const power=Number(customPower),push=Number.isFinite(power)&&power>0?power:(isBrutality?50:5),action=actionLabel||giftName||(isBrutality?"Brutality":"Hit");if(attacker==="girl"){linePosition+=push;addFeed("girl",username,action);animateCharacter("girl")}else{linePosition-=push;addFeed("boy",username,action);animateCharacter("boy")}updateVisuals();triggerAnimation(isBrutality);checkWinner()}
function checkWinner(){const a=document.getElementById("announcement-text");if(linePosition>=200){girlWins++;document.getElementById("girl-wins").innerText=girlWins;isMatchActive=false;a.className="announcement annct-girls active";a.innerText="GIRLS WIN!";setTimeout(()=>{a.classList.remove("active");resetMatch()},900)}else if(linePosition<=0){boyWins++;document.getElementById("boy-wins").innerText=boyWins;isMatchActive=false;a.className="announcement annct-boys active";a.innerText="BOYS WIN!";setTimeout(()=>{a.classList.remove("active");resetMatch()},900)}}
function animateCharacter(f){const g=f==="girl",img=document.getElementById(g?"avatar-girl":"avatar-boy"),d=g?girlCharacters[currentGirlIndex]:boyCharacters[currentBoyIndex];img.src=d.attack;img.style.transform=g?"scale(1.1) translateX(15px)":"scale(1.1) translateX(-15px)";setTimeout(()=>{img.src=d.idle;img.style.transform="scale(1) translateX(0)"},600)}
function switchCharacter(s,u=null){if(!u||u==="@Admin")u=getRandomUsername();if(s==="girl"){currentGirlIndex=(currentGirlIndex+1)%girlCharacters.length;let c=girlCharacters[currentGirlIndex];document.getElementById("girl-name-label").innerText=c.name;document.getElementById("avatar-girl").src=c.idle;showCharacterChanged("girl");addFeed("girl",u,"Character Changed",bouquetSVG)}else{currentBoyIndex=(currentBoyIndex+1)%boyCharacters.length;let c=boyCharacters[currentBoyIndex];document.getElementById("boy-name-label").innerText=c.name;document.getElementById("avatar-boy").src=c.idle;showCharacterChanged("boy");addFeed("boy",u,"Character Changed",confettiSVG)}}
function addFeed(s,u,g,gi=null){const f=document.getElementById(s==="girl"?"feed-girls":"feed-boys"),i=document.createElement("div");i.className="feed-item "+(s==="girl"?"feed-item-girl":"feed-item-boy");const c=s==="girl"?"#e855ff":"#00d2ff";i.innerHTML=(gi?`<img class="feed-gift-icon" src="${gi}" alt="">`:"")+`<span style="color:${c};font-weight:bold">${escapeHTML(u)}</span><span>sent</span><span>${escapeHTML(g)}</span>`;f.appendChild(i);while(f.children.length>3)f.removeChild(f.children[0])}
function escapeHTML(t){const d=document.createElement("div");d.textContent=t;return d.innerHTML}function resetMatch(){linePosition=100;isMatchActive=true;updateVisuals()}function resetScores(){resetMatch();girlWins=0;boyWins=0;document.getElementById("girl-wins").innerText="0";document.getElementById("boy-wins").innerText="0"}function toggleControls(){document.getElementById("controls-panel").classList.toggle("hidden")}
window.addEventListener("keydown",e=>{if(e.key.toLowerCase()==="h")toggleControls()});
async function startViewerMode(){if(typeof unlockBattleVoice==="function")unlockBattleVoice();if(typeof startBattleMusic==="function")startBattleMusic();const a=document.getElementById("arena");document.body.classList.add("viewer-mode");try{if(!document.fullscreenElement&&a.requestFullscreen)await a.requestFullscreen()}catch(e){console.log("Fullscreen request blocked:",e)}try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock("portrait")}catch(e){console.log("Portrait lock unavailable")}}
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement)document.body.classList.remove("viewer-mode")});updateVisuals();
</script>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><script src="tiktok-client.js"></script>
</body></html>
