<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Mortal Kombat - TikTok Gift Battle</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  font-family:Impact,"Segoe UI",Arial,sans-serif;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  background:#050308;
  color:#fff;
  min-height:100vh;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:10px;
  overflow-x:hidden;
}


/* =========================================================
   STREAM HINT
========================================================= */

.secret-hint{
  font:11px Arial,sans-serif;
  color:#777;
  margin-bottom:6px;
  text-align:center;
}

.secret-hint span{
  background:#222;
  color:#00ffcc;
  padding:2px 5px;
  border-radius:4px;
  font-weight:bold;
}


/* =========================================================
   MAIN ARENA
========================================================= */

.arena-wrapper{

  width:min(100%,430px);

  aspect-ratio:9/16;

  position:relative;

  overflow:hidden;

  background:#000;

  border:2px solid #30213d;

  border-radius:12px;

  box-shadow:
    0 0 25px rgba(0,0,0,.9),
    0 0 20px rgba(176,38,255,.25);
}


/* =========================================================
   SPLIT BACKGROUNDS
========================================================= */

.bg-split{

  position:absolute;

  top:0;
  bottom:0;

  background-size:cover;
  background-position:center;

  transition:
    width .45s cubic-bezier(.25,1,.5,1);
}

.bg-girls{

  left:0;

  width:50%;

  background-color:#48153f;

  background-image:url("girls.jpg");

  border-right:1px solid rgba(255,255,255,.7);

  box-shadow:
    4px 0 18px rgba(216,0,255,.65);

  z-index:1;
}

.bg-boys{

  right:0;

  width:50%;

  background-color:#102f45;

  background-image:url("boys.jpg");

  border-left:1px solid rgba(255,255,255,.7);

  box-shadow:
    -4px 0 18px rgba(0,210,255,.65);

  z-index:1;
}


/* =========================================================
   DARK OVERLAY
========================================================= */

.arena-wrapper::after{

  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.15),
      rgba(0,0,0,.03) 40%,
      rgba(0,0,0,.18)
    );

  pointer-events:none;

  z-index:3;
}


/* =========================================================
   CENTER DIVIDER
========================================================= */

.center-divider{

  position:absolute;

  top:0;
  bottom:0;

  left:50%;

  width:3px;

  background:#fff;

  transform:translateX(-50%);

  box-shadow:
    0 0 10px #fff,
    0 0 20px #b026ff,
    0 0 30px #00d2ff;

  z-index:10;

  transition:left .45s cubic-bezier(.25,1,.5,1);
}


/* =========================================================
   TOP HUD
========================================================= */

.hud-top{

  position:absolute;

  top:14px;
  left:10px;
  right:10px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  z-index:30;
}

.team-score-box{

  display:flex;

  align-items:stretch;

  border-radius:7px;

  overflow:hidden;

  border:1px solid rgba(255,255,255,.4);

  background:rgba(0,0,0,.75);

  box-shadow:
    0 4px 12px rgba(0,0,0,.7);
}

.score-number{

  min-width:42px;

  padding:5px 8px;

  display:flex;

  justify-content:center;
  align-items:center;

  font-family:Arial,sans-serif;

  font-size:21px;

  font-weight:900;

  color:#fff;

  background:rgba(0,0,0,.65);
}

.team-name{

  padding:5px 11px;

  display:flex;

  justify-content:center;
  align-items:center;

  font-size:17px;

  letter-spacing:1px;

  white-space:nowrap;

  text-shadow:
    1px 2px 3px #000;
}

.team-girls .team-name{

  background:
    linear-gradient(
      135deg,
      #ff1760,
      #d000ff
    );
}

.team-boys .team-name{

  background:
    linear-gradient(
      135deg,
      #0066ff,
      #00cfff
    );
}


/* =========================================================
   GIFT RULE PANELS
========================================================= */

.gift-panel{

  position:absolute;

  top:27%;

  display:flex;

  flex-direction:column;

  gap:7px;

  z-index:25;

  pointer-events:none;

  padding:7px;

  background:rgba(0,0,0,.66);

  border-radius:8px;

  border:1px solid rgba(255,255,255,.16);

  backdrop-filter:blur(2px);
}

.gift-panel.girls-side{

  left:7px;

  border-left:3px solid #d800ff;
}

.gift-panel.boys-side{

  right:7px;

  border-right:3px solid #00d2ff;
}

.gift-item{

  display:flex;

  align-items:center;

  gap:5px;

  min-width:86px;
}

.gift-icon{

  width:22px;
  height:22px;

  object-fit:contain;

  flex-shrink:0;
}

.gift-info{

  display:flex;

  flex-direction:column;

  line-height:1.05;
}

.gift-name{

  font:700 8px Arial,sans-serif;

  color:#fff;

  text-transform:uppercase;

  white-space:nowrap;
}

.gift-points{

  font:900 9px Arial,sans-serif;

  color:#ffd000;

  white-space:nowrap;
}

.gift-action{

  font:900 8px Arial,sans-serif;

  color:#00ffcc;

  white-space:nowrap;
}


/* =========================================================
   CHARACTER AREA
========================================================= */

.avatar-wrapper{

  position:absolute;

  bottom:11%;

  height:30%;

  z-index:8;

  transition:
    left .45s cubic-bezier(.25,1,.5,1);
}

.avatar-wrapper-girl{

  transform:translateX(-100%);

  padding-right:5px;
}

.avatar-wrapper-boy{

  transform:translateX(0);

  padding-left:5px;
}

.avatar{

  height:100%;

  width:auto;

  max-width:none;

  object-fit:contain;

  filter:
    drop-shadow(0 8px 7px rgba(0,0,0,.65));

  transition:
    transform .15s ease-out;
}


/* =========================================================
   CHARACTER CHANGED
========================================================= */

.character-change{

  position:absolute;

  left:50%;

  top:58%;

  transform:
    translate(-50%,-50%)
    scale(.6);

  z-index:70;

  opacity:0;

  pointer-events:none;

  padding:8px 16px;

  border-radius:30px;

  background:rgba(0,0,0,.82);

  border:2px solid rgba(255,255,255,.75);

  font:
    900 17px Arial,sans-serif;

  letter-spacing:1px;

  white-space:nowrap;

  text-shadow:
    0 2px 4px #000,
    0 0 12px currentColor;
}

.character-change.girl-change{

  color:#ff4dff;

  border-color:#ff4dff;

  animation:characterChanged .9s ease-out forwards;
}

.character-change.boy-change{

  color:#00d9ff;

  border-color:#00d9ff;

  animation:characterChanged .9s ease-out forwards;
}

@keyframes characterChanged{

  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(.55);
  }

  18%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1.08);
  }

  70%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1);
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-65%)
      scale(.95);
  }
}


/* =========================================================
   FEED
========================================================= */

.action-feed{

  position:absolute;

  bottom:5%;

  display:flex;

  flex-direction:column;

  gap:4px;

  z-index:25;

  pointer-events:none;

  max-width:43%;
}

.action-feed-girls{
  left:7px;
}

.action-feed-boys{
  right:7px;
}

.feed-item{

  display:flex;

  align-items:center;

  gap:4px;

  padding:4px 6px;

  border-radius:4px;

  background:rgba(0,0,0,.72);

  font:9px Arial,sans-serif;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  animation:feedIn .25s ease;
}

.feed-item-girl{
  border-left:2px solid #d800ff;
}

.feed-item-boy{
  border-right:2px solid #00d2ff;
}

.feed-gift-icon{

  width:16px;
  height:16px;

  object-fit:contain;

  flex-shrink:0;
}

@keyframes feedIn{

  from{
    opacity:0;
    transform:translateY(5px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}


/* =========================================================
   GIFT TEXT
========================================================= */

.gift-popup{

  position:absolute;

  left:50%;

  top:70%;

  transform:
    translate(-50%,-50%)
    scale(.6);

  z-index:80;

  opacity:0;

  font:
    900 19px Arial,sans-serif;

  white-space:nowrap;

  text-shadow:
    0 3px 5px #000,
    0 0 15px currentColor;

  animation:
    giftText .9s ease-out forwards;

  pointer-events:none;
}

@keyframes giftText{

  0%{
    opacity:0;
    transform:
      translate(-50%,-30%)
      scale(.6);
  }

  20%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1.05);
  }

  70%{
    opacity:1;
    transform:
      translate(-50%,-65%)
      scale(1);
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-110%)
      scale(1.1);
  }
}


/* =========================================================
   WIN ANNOUNCEMENT
========================================================= */

.announcement{

  position:absolute;

  left:50%;
  top:45%;

  transform:
    translate(-50%,-50%)
    scale(.5);

  z-index:100;

  opacity:0;

  pointer-events:none;

  font:
    900 38px Arial,sans-serif;

  text-align:center;

  white-space:nowrap;

  transition:
    all .2s cubic-bezier(.175,.885,.32,1.275);
}

.announcement.active{

  opacity:1;

  transform:
    translate(-50%,-50%)
    scale(1.08);
}

.annct-girls{

  color:#fff;

  text-shadow:
    0 0 10px #d800ff,
    0 0 25px #d800ff,
    3px 3px 0 #000;
}

.annct-boys{

  color:#fff;

  text-shadow:
    0 0 10px #0066ff,
    0 0 25px #00d2ff,
    3px 3px 0 #000;
}


/* =========================================================
   HIT EFFECT
========================================================= */

.arena-hit{

  animation:
    screenShake .25s
    cubic-bezier(.36,.07,.19,.97)
    both;
}

.arena-brutality{

  animation:
    brutalShake .5s
    cubic-bezier(.36,.07,.19,.97)
    both;

  filter:
    saturate(1.3)
    contrast(1.1);
}

@keyframes screenShake{

  0%,100%{
    transform:translate(0,0);
  }

  25%{
    transform:translate(-5px,3px);
  }

  50%{
    transform:translate(5px,-3px);
  }

  75%{
    transform:translate(-3px,2px);
  }
}

@keyframes brutalShake{

  0%,100%{
    transform:translate(0,0) scale(1);
  }

  15%{
    transform:translate(-8px,5px) scale(1.02);
  }

  30%{
    transform:translate(8px,-5px) scale(1.02);
  }

  45%{
    transform:translate(-7px,-4px) scale(1.02);
  }

  60%{
    transform:translate(7px,4px) scale(1.01);
  }
}


/* =========================================================
   SCORE BAR
========================================================= */

.battle-scorebar{

  width:min(100%,430px);

  margin-top:7px;

  display:flex;

  border:
    1px solid #332641;

  border-radius:7px;

  overflow:hidden;

  background:#0d0a13;

  box-shadow:
    0 4px 12px rgba(0,0,0,.5);
}

.battle-score-side{

  flex:1;

  padding:5px;

  text-align:center;

  font:
    700 10px Arial,sans-serif;

  letter-spacing:1px;
}

.battle-score-side.girls{

  background:
    linear-gradient(
      135deg,
      rgba(216,0,255,.30),
      rgba(138,28,166,.15)
    );
}

.battle-score-side.boys{

  background:
    linear-gradient(
      135deg,
      rgba(0,102,255,.15),
      rgba(0,210,255,.30)
    );
}

.battle-score-number{

  display:block;

  margin-top:2px;

  font:
    900 21px Arial,sans-serif;

  line-height:1;
}

.battle-score-center{

  display:flex;

  align-items:center;

  justify-content:center;

  padding:0 7px;

  background:#111;

  font:
    900 11px Arial,sans-serif;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls-panel{

  width:min(100%,430px);

  margin-top:7px;

  background:#120e1a;

  border:1px solid #2e2440;

  border-radius:8px;

  padding:7px;

  display:flex;

  flex-direction:column;

  gap:6px;

  box-shadow:
    0 5px 15px rgba(0,0,0,.5);
}

.controls-panel.hidden{

  display:none!important;
}

.button-group{

  display:flex;

  justify-content:center;

  gap:5px;

  flex-wrap:wrap;
}

.btn{

  flex:1;

  min-width:80px;

  padding:8px 5px;

  border:none;

  border-radius:6px;

  font:
    700 10px Arial,sans-serif;

  color:#fff;

  cursor:pointer;

  box-shadow:
    0 3px 7px rgba(0,0,0,.4);

  transition:
    transform .1s ease;
}

.btn:active{

  transform:scale(.95);
}

.btn-girl-hit{

  background:#8a1ca6;
}

.btn-girl-brutal{

  background:
    linear-gradient(
      135deg,
      #d800ff,
      #6200ea
    );
}

.btn-boy-hit{

  background:#005bb5;
}

.btn-boy-brutal{

  background:
    linear-gradient(
      135deg,
      #0066ff,
      #0022cc
    );
}

.btn-util{

  background:#251d33;

  border:
    1px solid #44355e;
}


/* =========================================================
   FULLSCREEN
========================================================= */

.fullscreen-btn{

  position:fixed;

  right:12px;
  bottom:12px;

  z-index:999999;

  width:46px;
  height:46px;

  border:
    1px solid rgba(255,255,255,.25);

  border-radius:50%;

  background:
    rgba(0,0,0,.8);

  color:#fff;

  font-size:20px;

  display:flex;

  justify-content:center;
  align-items:center;

  cursor:pointer;
}


/* =========================================================
   SECRET BUTTON
========================================================= */

.secret-toggle-btn{

  position:absolute;

  right:5px;
  bottom:5px;

  width:22px;
  height:22px;

  background:transparent;

  border:none;

  color:rgba(255,255,255,.18);

  z-index:150;

  font-size:13px;
}


/* =========================================================
   VIEWER MODE
========================================================= */

body.viewer-mode{

  padding:0;
  margin:0;

  width:100vw;
  height:100vh;

  min-height:100vh;

  overflow:hidden;

  background:#000;

  justify-content:center;
}

body.viewer-mode .secret-hint,
body.viewer-mode .battle-scorebar,
body.viewer-mode .controls-panel,
body.viewer-mode #tiktok-debug{

  display:none!important;
}

body.viewer-mode .arena-wrapper{

  width:min(
    100vw,
    calc(100vh * 9 / 16)
  );

  height:min(
    100vh,
    calc(100vw * 16 / 9)
  );

  max-width:none;

  aspect-ratio:9/16;

  border:none;

  border-radius:0;

  box-shadow:none;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:430px){

  body{

    padding:5px;
  }

  .arena-wrapper{

    width:100%;

    max-width:430px;
  }

  .team-name{

    font-size:15px;

    padding:
      5px 8px;
  }

  .score-number{

    min-width:37px;

    font-size:19px;
  }

  .gift-panel{

    top:27%;

    padding:6px;

    gap:6px;
  }

  .gift-item{

    min-width:78px;
  }

  .gift-icon{

    width:20px;
    height:20px;
  }

  .gift-name{

    font-size:7px;
  }

  .gift-points{

    font-size:8px;
  }

  .gift-action{

    font-size:7px;
  }

  .avatar-wrapper{

    height:54%;

    bottom:10%;
  }

  .action-feed{

    bottom:4%;

    max-width:44%;
  }

  .feed-item{

    font-size:8px;
  }

  .character-change{

    font-size:15px;

    padding:
      7px 13px;
  }

  .announcement{

    font-size:34px;
  }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-height:650px){

  .arena-wrapper{

    width:min(
      100vw - 10px,
      calc(100vh * 9 / 16)
    );
  }

  .secret-hint{

    display:none;
  }

  .battle-scorebar{

    margin-top:3px;
  }

  .controls-panel{

    margin-top:3px;
  }
}

</style>
</head>


<body>


<div class="secret-hint">
  Streamer Mode Active:
  Press <span>H</span> to hide/show controls
</div>


<!-- =====================================================
     ARENA
===================================================== -->

<div class="arena-wrapper" id="arena">


  <!-- BACKGROUNDS -->

  <div

  <!-- =================================================

    <div class="team-score-box team-girls">

      <span

      <span
        class="team-name"

      <span

        </span>

    </div>


    <div class="gift-item">

      <img

        class="gift-icon">

      <div class="gift-info">

        <span class="gift-name">
          ROSE
        </span>

          +5 PTS
        </span>

      </div>

    </div>


    <div class="gift-item">

      <img
        src="icon_rosa.png"

        </span>

      </div>

    </div>

  </div>


  <!-- =================================================

  <div class="gift-panel boys-side">

      <img

          FOLLOW
        </span>

        <span class="gift-points">

        </span>

      </div>

    </div>


    <div class="gift-item">

      <img

      <div class="gift-info">

        </span>

    </div>


    <div class="gift-item">

      <img
        src="icon_necklace.png"
        class="gift-icon">

      <div class="gift-info">

        <span class="gift-name">
          NECKLACE
        </span>

        <span class="gift-points">
          +50 PTS
        </span>

      </div>

    </div>


    <!-- SVG CONFETTI / PARTY POPPER -->

    <div class="gift-item">

      <img
        data-svg-gift="confetti"
        class="gift-icon"
        alt="Confetti">

      <div class="gift-info">

        <span class="gift-name">
          CONFETTI
        </span>

        <span class="gift-action">
          CHARACTER CHANGE
        </span>

      </div>

    </div>

  </div>


  <!-- =================================================
       GIRL CHARACTER
  ================================================== -->

  <div
    class="avatar-wrapper avatar-wrapper-girl"
    id="wrap-girl">

    <img
      src="kitana_idle.png"
      class="avatar"
      id="avatar-girl"
      alt="Girl Fighter">

  <!-- =================================================
       BOY CHARACTER
  ================================================== -->

  <div
    class="avatar-wrapper avatar-wrapper-boy"
    id="wrap-boy">

    <img
      src="subzero_idle.png"

/* =========================================================

========================================================= */

function getRandomUsername(){

  const names = [

    "shadow",
    "kombat",
    "ghost",
    "ninja",
    "gamer",
    "pro",
    "alpha",
    "toxic",
    "queen",
    "king",
    "guest",
    "user"

  ];

  const name =
    names[
      Math.floor(
        Math.random() *
        names.length
      )
    ];

  const suffix =
    Math.floor(
      Math.random() * 99999
    );

  return name + suffix;
}


/* =========================================================
   VISUAL SCORE
========================================================= */

function updateVisuals(){

  let displayPosition =
    linePosition;

  if(displayPosition > 200)
    displayPosition = 200;

  if(displayPosition < 0)
    displayPosition = 0;


  const visualPercentage =
    displayPosition / 2;


  document.getElementById(
    "bg-girls"
  ).style.width =
    visualPercentage + "%";


  document.getElementById(
    "bg-boys"
  ).style.width =
    (100 - visualPercentage) + "%";


  document.getElementById(
    "center-line"
  ).style.left =
    visualPercentage + "%";


  document.getElementById(
    "wrap-girl"
  ).style.left =
    visualPercentage + "%";


  document.getElementById(
    "wrap-boy"
  ).style.left =
    visualPercentage + "%";


  document.getElementById(
    "girl-battle-score"
  ).innerText =
    Math.round(
      displayPosition
    );


  document.getElementById(
    "boy-battle-score"
  ).innerText =
    200 -
    Math.round(
      displayPosition
    );
}


/* =========================================================
   SCREEN SHAKE
========================================================= */

function triggerAnimation(
  isBrutality
){

  const arena =
    document.getElementById(
      "arena"
    );


  arena.classList.remove(
    "arena-hit",
    "arena-brutality"
  );


  void arena.offsetWidth;


  arena.classList.add(

    isBrutality
      ? "arena-brutality"
      : "arena-hit"

  );
}


/* =========================================================
   GIFT TEXT
========================================================= */

function showGift(
  giftImage,
  side,
  giftName
){

  const arena =
    document.getElementById(
      "arena"
    );


  const text =
    document.createElement(
      "div"
    );


  text.className =
    "gift-popup";


  text.style.color =
    side === "girl"
      ? "#ff4dff"
      : "#00d9ff";


  text.innerText =
    giftName;


  arena.appendChild(text);


  setTimeout(
    ()=>{
      text.remove();
    },
    1000
  );
}

   CHARACTER CHANGED
========================================================= */

function showCharacterChanged(
  side,
  characterName
){

  const box =
    document.getElementById(
      "character-change"
    );


  box.className =
    "character-change " +
    (
      side === "girl"
        ? "girl-change"
        : "boy-change"
    );


  box.innerText =
    "CHARACTER CHANGED";


  void box.offsetWidth;


  box.style.animation =
    "none";


  void box.offsetWidth;


  box.style.animation =
    "characterChanged .9s ease-out forwards";


  setTimeout(
    ()=>{
      box.className =
        "character-change";
    },
    950
  );
}


/* =========================================================
   ATTACK
========================================================= */

function attack(

  attacker,

  isBrutality,

  username = null,

  giftName = "",

  customPower = null,

  actionLabel = ""

){

  if(!isMatchActive)
    return;


  if(
    !username ||
    username === "Unknown"
  ){

    username =
      getRandomUsername();
  }


  const defaultPower =
    isBrutality
      ? 50
      : 5;


  const suppliedPower =
    Number(customPower);


  const powerPush =
    Number.isFinite(
      suppliedPower
    ) &&
    suppliedPower > 0

      ? suppliedPower

      : defaultPower;


  const feedAction =
    actionLabel ||
    giftName ||
    (
      isBrutality
        ? "Brutality"
        : "Hit"
    );


  if(attacker === "girl"){

    linePosition +=
      powerPush;


    addFeed(
      "girl",
      username,
      feedAction,
      getGiftIcon(
        giftName
      )
    );


    animateCharacter(
      "girl"
    );

  }

  else{

    linePosition -=
      powerPush;


    addFeed(
      "boy",
      username,
      feedAction,
      getGiftIcon(
        giftName
      )
    );


    animateCharacter(
      "boy"
    );

  }


  updateVisuals();

  triggerAnimation(
    isBrutality
  );


  checkWinner();
}


/* =========================================================
   GET GIFT ICON
========================================================= */

function getGiftIcon(
  giftName
){

  if(!giftName)
    return null;


  const name =
    giftName.toLowerCase();


  /*
     IMPORTANT:
     Check "rosa" BEFORE "rose"
     so Rosa gets the correct icon.
  */

  if(name === "rosa")
    return "icon_rosa.png";


  if(name === "rose")
    return "icon_rose.png";


  if(name.includes("tiktok"))
    return "icon_tiktok.png";


  if(name.includes("necklace"))
    return "icon_necklace.png";


  if(name.includes("follow"))
    return "icon_follow.png";


  if(name.includes("like"))
    return "icon_100likes.png";


  /*
     THESE TWO ARE NOW PURE SVG.
     NO PNG FILE IS REQUIRED.
  */

  if(name.includes("bouquet"))
    return BOUQUET_SVG;


  if(name.includes("confetti"))
    return CONFETTI_SVG;


  return null;
}


/* =========================================================
   WINNER
========================================================= */

function checkWinner(){

  const announcement =
    document.getElementById(
      "announcement-text"
    );


  if(linePosition >= 200){

    girlWins++;


    document.getElementById(
      "girl-wins"
    ).innerText =
      girlWins;


    isMatchActive =
      false;


    announcement.className =
      "announcement annct-girls active";


    announcement.innerText =
      "GIRLS WIN!";


    setTimeout(
      ()=>{

        announcement.classList.remove(
          "active"
        );

        resetMatch();

      },
      1000
    );

  }


  else if(linePosition <= 0){

    boyWins++;


    document.getElementById(
      "boy-wins"
    ).innerText =
      boyWins;


    isMatchActive =
      false;


    announcement.className =
      "announcement annct-boys active";


    announcement.innerText =
      "BOYS WIN!";


    setTimeout(
      ()=>{

        announcement.classList.remove(
          "active"
        );

        resetMatch();

      },
      1000
    );

  }

}


/* =========================================================
   CHARACTER ATTACK
========================================================= */

function animateCharacter(
  fighter
){

  const isGirl =
    fighter === "girl";


  const imgEl =
    document.getElementById(

      isGirl
        ? "avatar-girl"
        : "avatar-boy"

    );


  const charData =
    isGirl
      ? girlCharacters[
          currentGirlIndex
        ]
      : boyCharacters[
          currentBoyIndex
        ];


  imgEl.src =
    charData.attack;


  imgEl.style.transform =
    isGirl

      ? "scale(1.08) translateX(12px)"

      : "scale(1.08) translateX(-12px)";


  setTimeout(
    ()=>{

      imgEl.src =
        charData.idle;


      imgEl.style.transform =
        "scale(1) translateX(0)";

    },
    500
  );
}


/* =========================================================
   CHARACTER SWITCH
========================================================= */

function switchCharacter(

  side,

  username = null,

  giftName = null

){

  if(
    !username ||
    username === "@Admin"
  ){

    username =
      getRandomUsername();
  }


  if(side === "girl"){

    currentGirlIndex =
      (
        currentGirlIndex + 1
      ) %
      girlCharacters.length;


    const char =
      girlCharacters[
        currentGirlIndex
      ];


    document.getElementById(
      "girl-name-label"
    ).innerText =
      char.name;


    document.getElementById(
      "avatar-girl"
    ).src =
      char.idle;


    showCharacterChanged(
      "girl",
      char.name
    );


    addFeed(
      "girl",
      username,
      "Character Changed",
      BOUQUET_SVG
    );

  }


  else{

    currentBoyIndex =
      (
        currentBoyIndex + 1
      ) %
      boyCharacters.length;


    const char =
      boyCharacters[
        currentBoyIndex
      ];


    document.getElementById(
      "boy-name-label"
    ).innerText =
      char.name;


    document.getElementById(
      "avatar-boy"
    ).src =
      char.idle;


    showCharacterChanged(
      "boy",
      char.name
    );


    addFeed(
      "boy",
      username,
      "Character Changed",
      CONFETTI_SVG
    );

  }

}


/* =========================================================
   FEED
========================================================= */

function addFeed(

  side,

  user,

  gift,

  giftImage = null

){

  const feed =
    document.getElementById(

      side === "girl"
        ? "feed-girls"
        : "feed-boys"

    );


  const item =
    document.createElement(
      "div"
    );


  item.className =
    "feed-item " +

    (

      side === "girl"
        ? "feed-item-girl"
        : "feed-item-boy"

    );


  const nameColor =
    side === "girl"
      ? "#e855ff"
      : "#00d2ff";


  let iconHTML = "";


  if(giftImage){

    iconHTML =
      `<img
        class="feed-gift-icon"
        src="${giftImage}"
        alt="">`;

  }


  item.innerHTML =

    `${iconHTML}

     <span
       style="
         color:${nameColor};
         font-weight:bold
       ">
       ${user}
     </span>

     <span>
       sent
     </span>

     <span>
       ${gift}
     </span>`;


  feed.appendChild(
    item
  );


  while(
    feed.children.length > 3
  ){

    feed.removeChild(
      feed.children[0]
    );

  }

}


/* =========================================================
   RESET MATCH
========================================================= */

function resetMatch(){

  linePosition = 100;

  isMatchActive = true;

  updateVisuals();

}


/* =========================================================
   RESET SCORES
========================================================= */

function resetScores(){

  resetMatch();


  girlWins = 0;
  boyWins = 0;


  document.getElementById(
    "girl-wins"
  ).innerText = "0";


  document.getElementById(
    "boy-wins"
  ).innerText = "0";

}


/* =========================================================
   CONTROLS
========================================================= */

function toggleControls(){

  document
    .getElementById(
      "controls-panel"
    )
    .classList.toggle(
      "hidden"
    );

}


window.addEventListener(
  "keydown",
  function(e){

    if(
      e.key.toLowerCase() === "h"
    ){

      toggleControls();

    }

  }
);


/* =========================================================
   VIEWER MODE
========================================================= */

async function startViewerMode(){

  if(
    typeof unlockBattleVoice ===
    "function"
  ){

    unlockBattleVoice();

  }


  if(
    typeof startBattleMusic ===
    "function"
  ){

    startBattleMusic();

  }


  document.body.classList.add(
    "viewer-mode"
  );


  const arena =
    document.getElementById(
      "arena"
    );


  try{

    if(
      !document.fullscreenElement &&
      arena.requestFullscreen
    ){

      await arena.requestFullscreen();

    }

  }

  catch(error){

    console.log(
      "Fullscreen blocked:",
      error
    );

  }

}


/* =========================================================
   FULLSCREEN EXIT
========================================================= */

document.addEventListener(
  "fullscreenchange",
  function(){

    if(
      !document.fullscreenElement
    ){

      document.body.classList.remove(
        "viewer-mode"
      );

    }

  }
);


/* =========================================================
   START
========================================================= */

initializeSVGIcons();

updateVisuals();
