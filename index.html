<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK TikTok Live Battle - Demo Replica</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Teko:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            background-color: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Teko', sans-serif;
        }
        
        /* Vertical Mobile/TikTok Canvas Scaler */
        #game-scaler {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 1080px;
            height: 1920px; /* TikTok 9:16 Ratio */
            background: #000;
            overflow: hidden;
            transform-origin: center center;
        }

        /* Split Backgrounds */
        .bg-layer { 
            position: absolute; 
            top: 0; 
            bottom: 0; 
            width: 50%;
            background-size: cover; 
            background-position: center; 
        }
        
        #bg-girls { 
            left: 0; 
            background-image: linear-gradient(to right, rgba(50,0,80,0.5), rgba(0,0,0,0.9)), url('1000096985.png');
            border-right: 4px solid #fff;
            box-shadow: 5px 0 30px #a200ff;
            z-index: 1; 
        }

        #bg-boys { 
            right: 0; 
            background-image: linear-gradient(to left, rgba(80,30,0,0.5), rgba(0,0,0,0.9)), url('1000096984.png');
            box-shadow: -5px 0 30px #ff6600;
            z-index: 1; 
        }

        /* Top HUD (Health Bars & Names) */
        .hud-container {
            position: absolute;
            top: 100px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            z-index: 20;
        }

        .player-hud {
            width: 42%;
            display: flex;
            flex-direction: column;
        }

        .player-name {
            font-size: 55px;
            color: white;
            text-shadow: 0 0 10px black;
            letter-spacing: 2px;
            margin-bottom: -10px;
            text-transform: uppercase;
        }

        .health-bar-bg {
            width: 100%;
            height: 35px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #fff;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .health-fill {
            height: 100%;
            width: 100%;
            transition: width 0.3s ease-out;
        }

        #health-girls-fill { background: linear-gradient(90deg, #ff00cc, #a200ff); }
        #health-boys-fill { background: linear-gradient(90deg, #ffcc00, #ff6600); }

        .score-text {
            font-size: 50px;
            color: #ccc;
            margin-top: 5px;
        }

        .demo-badge {
            color: #ffd700;
            font-size: 40px;
            text-align: center;
            text-shadow: 0 0 10px #000;
        }

        /* Middle Team Logos */
        .team-logo-container {
            position: absolute;
            top: 450px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .team-title {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 130px;
            font-weight: 900;
            text-shadow: 0 0 30px #000, 0 0 15px #000;
            text-align: center;
            line-height: 0.9;
            position: absolute;
        }

        .team-title.girls { left: 50px; color: #d400ff; }
        .team-title.boys { right: 50px; color: #ff6600; }
        .team-title span { color: white; font-size: 100px; display: block; }

        /* Real Character Images */
        .character-img {
            position: absolute;
            bottom: 300px;
            height: 600px;
            width: auto;
            max-width: 450px;
            z-index: 15;
            transition: transform 0.1s ease;
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.8));
        }

        #char-girls { left: 50px; transform: scaleX(1); }
        #char-boys { right: 50px; transform: scaleX(-1); } /* Flips right side to face left */

        /* Animations */
        .lunge-right { transform: scaleX(1) translateX(100px) scale(1.1) !important; }
        .lunge-left { transform: scaleX(-1) translateX(100px) scale(1.1) !important; }
        .hit-recoil { filter: brightness(2) drop-shadow(0 0 40px red) !important; transform: scale(0.95) !important; }

        .heavy-shake { animation: screenShake 0.4s ease-in-out; }
        @keyframes screenShake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-20px, 15px); }
            40% { transform: translate(20px, -15px); }
            60% { transform: translate(-15px, -20px); }
            80% { transform: translate(15px, 20px); }
            100% { transform: translate(0, 0); }
        }

        /* Live Gift Feed (Left Side) */
        #gift-feed {
            position: absolute;
            bottom: 400px;
            left: 30px;
            width: 350px;
            display: flex;
            flex-direction: column-reverse;
            gap: 10px;
            z-index: 30;
        }

        .gift-alert {
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 30px;
            padding: 8px 15px;
            color: white;
            font-size: 32px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease-out;
        }
        
        .gift-alert span { color: #d4af37; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Action Text Overlay (Center) */
        #action-text-container {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 40;
            pointer-events: none;
            text-align: center;
            width: 100%;
        }

        .action-text {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 110px;
            color: #fff;
            text-shadow: 0 0 30px #ff0000, 0 0 10px #000;
            animation: popUp 1.2s forwards ease-in-out;
        }

        @keyframes popUp {
            0% { opacity: 0; transform: scale(0.3); }
            15% { opacity: 1; transform: scale(1.2); }
            30% { transform: scale(1); }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.5); }
        }

        /* Demo Buttons Panel (For testing on PC) */
        .demo-panel {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 50;
        }

        .btn {
            padding: 15px 25px;
            font-family: 'Teko', sans-serif;
            font-size: 35px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            text-transform: uppercase;
        }

        .btn-girl { background: #d400ff; border: 2px solid #fff; }
        .btn-boy { background: #ff6600; border: 2px solid #fff; }
        .btn-switch { background: #333; border: 2px solid #aaa; }
    </style>
</head>
<body>

    <div id="game-scaler">
        <div id="game-container">
            <div id="bg-girls" class="bg-layer"></div>
            <div id="bg-boys" class="bg-layer"></div>

            <div class="hud-container">
                <div class="player-hud" style="align-items: flex-start;">
                    <div id="name-girls" class="player-name">MILEENA</div>
                    <div class="health-bar-bg"><div id="health-girls-fill" class="health-fill"></div></div>
                    <div id="score-girls" class="score-text">0 W</div>
                </div>

                <div class="demo-badge">🔴 LIVE</div>

                <div class="player-hud" style="align-items: flex-end;">
                    <div id="name-boys" class="player-name">SCORPION</div>
                    <div class="health-bar-bg"><div id="health-boys-fill" class="health-fill"></div></div>
                    <div id="score-boys" class="score-text">0 W</div>
                </div>
            </div>

            <div class="team-logo-container">
                <div class="team-title girls"><span>TEAM</span>GIRLS</div>
                <div class="team-title boys"><span>TEAM</span>BOYS</div>
            </div>

            <img id="char-girls" class="character-img" src="https://placehold.co/400x600/a200ff/fff?text=KITANA+PNG" alt="Girl Fighter">
            <img id="char-boys" class="character-img" src="https://placehold.co/400x600/ff6600/fff?text=SCORPION+PNG" alt="Boy Fighter">

            <div id="gift-feed"></div>

            <div id="action-text-container"></div>

            <div class="demo-panel">
                <button class="btn btn-girl" onclick="triggerHit('girls', 5, 'Admin', 'Rose')">Girls Hit</button>
                <button class="btn btn-girl" onclick="triggerHit('girls', 50, 'Admin', 'Rosa')">BRUTALITY!</button>
                <button class="btn btn-switch" onclick="switchChar('girls')">↻ Girl</button>
                <button class="btn btn-switch" onclick="switchChar('boys')">↻ Boy</button>
                <button class="btn btn-boy" onclick="triggerHit('boys', 5, 'Admin', 'TikTok')">Boys Hit</button>
                <button class="btn btn-boy" onclick="triggerHit('boys', 50, 'Admin', 'Mind Blown')">BRUTALITY!</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        // Screen Auto-Scaler for Mobile Portrait (9:16)
        function fitScreen() {
            const container = document.getElementById('game-container');
            const scaleX = window.innerWidth / 1080;
            const scaleY = window.innerHeight / 1920;
            const scale = Math.min(scaleX, scaleY);
            container.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', fitScreen);
        fitScreen();

        // Game State
        let girlsHealth = 100;
        let boysHealth = 100;
        let girlsWins = 0;
        let boysWins = 0;

        // EXACT ROSTERS REQUESTED (Replace the 'img' URLs with your downloaded PNG filenames)
        const girlsRoster = [
            { name: "SONYA BLADE", img: "https://placehold.co/400x600/a200ff/fff?text=SONYA+PNG" },
            { name: "KITANA", img: "https://placehold.co/400x600/a200ff/fff?text=KITANA+PNG" },
            { name: "SINDEL", img: "https://placehold.co/400x600/a200ff/fff?text=SINDEL+PNG" }
        ];

        const boysRoster = [
            { name: "HUMAN SMOKE", img: "https://placehold.co/400x600/ff6600/fff?text=SMOKE+PNG" },
            { name: "KABAL", img: "https://placehold.co/400x600/ff6600/fff?text=KABAL+PNG" },
            { name: "SCORPION", img: "https://placehold.co/400x600/ff6600/fff?text=SCORPION+PNG" }
        ];

        let girlIndex = 1; // Starts on Kitana
        let boyIndex = 2;  // Starts on Scorpion

        // Move Text Arrays
        const girlMoves = ["TELEPORT KICK!", "SAIS STRIKE!", "ENERGY RINGS!"];
        const boyMoves = ["GET OVER HERE!", "TELEPORT PUNCH!", "SPEED DASH!"];
        const fatalityTexts = ["FACE BITE FATALITY!", "HELL FIRE!", "DEATH SENTENCE!"];

        // DOM Elements
        const elGirlsHealth = document.getElementById('health-girls-fill');
        const elBoysHealth = document.getElementById('health-boys-fill');
        const elCharGirls = document.getElementById('char-girls');
        const elCharBoys = document.getElementById('char-boys');
        const elNameGirls = document.getElementById('name-girls');
        const elNameBoys = document.getElementById('name-boys');
        const actionContainer = document.getElementById('action-text-container');
        const giftFeed = document.getElementById('gift-feed');
        const gameContainer = document.getElementById('game-container');

        // Load Initial Characters
        function updateFighters() {
            elNameGirls.innerText = girlsRoster[girlIndex].name;
            elCharGirls.src = girlsRoster[girlIndex].img;
            
            elNameBoys.innerText = boysRoster[boyIndex].name;
            elCharBoys.src = boysRoster[boyIndex].img;
        }
        updateFighters();

        // Socket Listener (From real TikTok gifts)
        socket.on('action', (data) => {
            if (data.type === 'switch') {
                switchChar(data.team);
                addGiftToFeed(data.user, data.gift);
            } else {
                triggerHit(data.team, data.damage, data.user, data.gift);
            }
        });

        // Switch Character Logic
        function switchChar(team) {
            if (team === 'girls') {
                girlIndex = (girlIndex + 1) % girlsRoster.length;
            } else {
                boyIndex = (boyIndex + 1) % boysRoster.length;
            }
            updateFighters();
        }

        // Hit & Damage Logic
        function triggerHit(attackerTeam, damage, username, giftName) {
            addGiftToFeed(username, giftName);

            let moveText = "";

            if (attackerTeam === 'girls') {
                boysHealth -= damage;
                elCharGirls.classList.add('lunge-right');
                elCharBoys.classList.add('hit-recoil');
                
                moveText = damage >= 50 ? getRandomText(fatalityTexts) : getRandomText(girlMoves);
                
                setTimeout(() => {
                    elCharGirls.classList.remove('lunge-right');
                    elCharBoys.classList.remove('hit-recoil');
                }, 300);
            } else {
                girlsHealth -= damage;
                elCharBoys.classList.add('lunge-left');
                elCharGirls.classList.add('hit-recoil');
                
                moveText = damage >= 50 ? getRandomText(fatalityTexts) : getRandomText(boyMoves);

                setTimeout(() => {
                    elCharBoys.classList.remove('lunge-left');
                    elCharGirls.classList.remove('hit-recoil');
                }, 300);
            }

            if (damage >= 50) {
                gameContainer.classList.add('heavy-shake');
                setTimeout(() => gameContainer.classList.remove('heavy-shake'), 400);
            }

            showActionText(moveText, damage >= 50);
            updateHealthUI();
            checkWin();
        }

        function updateHealthUI() {
            elGirlsHealth.style.width = `${Math.max(0, girlsHealth)}%`;
            elBoysHealth.style.width = `${Math.max(0, boysHealth)}%`;
        }

        function checkWin() {
            if (boysHealth <= 0) {
                girlsWins++;
                document.getElementById('score-girls').innerText = `${girlsWins} W`;
                showActionText("TEAM GIRLS WINS!", true);
                resetRound();
            } else if (girlsHealth <= 0) {
                boysWins++;
                document.getElementById('score-boys').innerText = `${boysWins} W`;
                showActionText("TEAM BOYS WINS!", true);
                resetRound();
            }
        }

        function resetRound() {
            setTimeout(() => {
                girlsHealth = 100;
                boysHealth = 100;
                updateHealthUI();
            }, 2000);
        }

        // Live Feed UI
        function addGiftToFeed(username, giftName) {
            const feedItem = document.createElement('div');
            feedItem.className = 'gift-alert';
            feedItem.innerHTML = `@${username || 'Admin'} <span>${giftName}</span>`;
            
            giftFeed.prepend(feedItem);
            
            // Keep only the last 5 gifts on screen so it doesn't overflow
            if (giftFeed.children.length > 5) {
                giftFeed.removeChild(giftFeed.lastChild);
            }
        }

        // Action Text UI
        function showActionText(text, isHeavy) {
            const textEl = document.createElement('div');
            textEl.className = 'action-text';
            textEl.innerText = text;
            if (isHeavy) textEl.style.color = '#ffcc00';

            actionContainer.appendChild(textEl);
            setTimeout(() => textEl.remove(), 1200);
        }

        function getRandomText(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }
    </script>
</body>
</html>
