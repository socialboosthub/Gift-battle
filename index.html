<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mortal Kombat - TikTok Gift Battle</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  font-family:Impact,"Segoe UI",Arial,sans-serif;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  background:#08060c;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:20px;
  overflow-x:hidden;
}

/* =========================================================
   SECRET HINT
========================================================= */

.secret-hint{
  font:13px Arial,sans-serif;
  color:#777;
  margin-bottom:10px;
  text-align:center;
}

.secret-hint span{
  background:#222;
  color:#00ffcc;
  padding:2px 6px;
  border-radius:4px;
  font-weight:bold;
}

/* =========================================================
   ARENA
========================================================= */

.arena-wrapper{
  width:100%;
  max-width:960px;
  aspect-ratio:16/9;
  position:relative;
  border:3px solid #2a1f3d;
  border-radius:12px;
  overflow:hidden;
  box-shadow:
    0 0 30px rgba(0,0,0,.9),
    0 0 15px rgba(176,38,255,.3);
  background:#000;
}

/* =========================================================
   BACKGROUND IMAGE SIDES
========================================================= */

.bg-split{
  position:absolute;
  top:0;
  bottom:0;

  background-size:cover;
  background-repeat:no-repeat;
  background-position:center center;

  transition:
    width .5s cubic-bezier(.25,1,.5,1);
}

.bg-girls{
  left:0;
  width:50%;

  background-color:#4a1942;
  background-image:url("./girls.jpg");

  border-right:2px solid rgba(255,255,255,.8);

  box-shadow:
    5px 0 20px rgba(176,38,255,.8);

  z-index:1;
}

.bg-boys{
  right:0;
  width:50%;

  background-color:#193a4a;
  background-image:url("./boys.jpg");

  border-left:2px solid rgba(255,255,255,.8);

  box-shadow:
    -5px 0 20px rgba(0,210,255,.8);

  z-index:1;
}

/* =========================================================
   CENTER DIVIDER
========================================================= */

.center-divider{
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  width:6px;

  background:#fff;

  transform:translateX(-50%);

  box-shadow:
    0 0 15px #fff,
    0 0 30px #b026ff,
    0 0 45px #00d2ff;

  z-index:8;

  transition:
    left .5s cubic-bezier(.25,1,.5,1);
}

/* =========================================================
   TOP SCORE HUD
========================================================= */

.hud-top{
  position:absolute;

  top:15px;
  left:20px;
  right:20px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  z-index:30;
}

.team-score-box{
  display:flex;
  align-items:stretch;

  border-radius:8px;
  overflow:hidden;

  border:2px solid rgba(255,255,255,.3);

  box-shadow:
    0 6px 15px rgba(0,0,0,.6);

  background:#111;
}

.score-number{
  font-size:32px;
  color:#fff;

  padding:8px 20px;

  display:flex;
  align-items:center;
  justify-content:center;

  min-width:70px;
}

.team-name{
  font-size:28px;
  color:#fff;

  padding:8px 25px;

  display:flex;
  align-items:center;
  justify-content:center;

  letter-spacing:2px;

  text-shadow:
    1px 1px 3px rgba(0,0,0,.5);
}

.team-girls .team-name{
  background:
    linear-gradient(
      135deg,
      #ff1e56,
      #d800ff
    );
}

.team-boys .team-name{
  background:
    linear-gradient(
      135deg,
      #0066ff,
      #00d2ff
    );
}

/* =========================================================
   GIFT RULE PANELS
========================================================= */

.gift-panel{
  position:absolute;

  top:50%;
  transform:translateY(-50%);

  display:flex;
  flex-direction:column;
  gap:6px;

  z-index:20;

  pointer-events:none;

  background:rgba(0,0,0,.75);

  padding:8px 12px;

  border-radius:10px;

  border:1px solid rgba(255,255,255,.15);

  box-shadow:
    0 5px 15px rgba(0,0,0,.5);
}

.gift-panel.girls-side{
  left:15px;
  border-left:3px solid #d800ff;
}

.gift-panel.boys-side{
  right:15px;
  border-right:3px solid #00d2ff;
}

.gift-item{
  display:flex;
  align-items:center;
  gap:10px;

  font:800 13px "Segoe UI",Arial,sans-serif;

  color:#fff;

  text-shadow:
    1px 1px 2px #000;

  white-space:nowrap;
}

.gift-icon{
  width:24px;
  height:24px;

  object-fit:contain;

  border-radius:4px;

  background:rgba(255,255,255,.05);
}

.gift-info{
  display:flex;
  flex-direction:column;
  justify-content:center;

  line-height:1.1;
}

.gift-name{
  font-size:11px;

  color:#ddd;

  text-transform:uppercase;

  letter-spacing:.5px;
}

.gift-points{
  color:#ffcc00;
  font-size:14px;
}

.gift-action{
  color:#00ffcc;
  font-size:12px;
}

/* =========================================================
   CHARACTERS
========================================================= */

.avatar-wrapper{
  position:absolute;

  bottom:15%;

  height:60%;

  z-index:10;

  transition:
    left .5s cubic-bezier(.25,1,.5,1);
}

.avatar-wrapper-girl{
  transform:translateX(-100%);
  padding-right:30px;
}

.avatar-wrapper-boy{
  transform:translateX(0);
  padding-left:30px;
}

.avatar{
  height:100%;
  width:auto;

  object-fit:contain;

  transition:
    transform .15s ease-out;

  display:block;
}

/* =========================================================
   CHARACTER CHANGED ANNOUNCEMENT
========================================================= */

.character-change{
  position:absolute;

  top:42%;
  left:50%;

  transform:
    translate(-50%,-50%)
    scale(.5);

  z-index:100;

  pointer-events:none;

  opacity:0;

  font:
    900 42px Arial,sans-serif;

  text-transform:uppercase;

  text-align:center;

  letter-spacing:3px;

  white-space:nowrap;

  text-shadow:
    0 3px 5px #000,
    0 0 15px currentColor;

  animation:
    characterChanged .9s
    cubic-bezier(.175,.885,.32,1.275)
    forwards;
}

.character-change.girl{
  color:#ff4dff;

  text-shadow:
    0 0 10px #d800ff,
    0 0 25px #d800ff,
    4px 4px 0 #000;
}

.character-change.boy{
  color:#00d9ff;

  text-shadow:
    0 0 10px #0066ff,
    0 0 25px #0066ff,
    4px 4px 0 #000;
}

@keyframes characterChanged{

  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(.4);
  }

  20%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1.15);
  }

  45%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1);
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-80%)
      scale(1.05);
  }

}

/* =========================================================
   ANNOUNCEMENTS
========================================================= */

.announcement{
  position:absolute;

  top:40%;
  left:50%;

  transform:
    translate(-50%,-50%)
    scale(.5);

  font-size:56px;
  font-weight:900;

  text-transform:uppercase;

  text-align:center;

  letter-spacing:3px;

  opacity:0;

  pointer-events:none;

  z-index:110;

  transition:
    all .2s
    cubic-bezier(.175,.885,.32,1.275);

  white-space:nowrap;
}

.announcement.active{
  opacity:1;

  transform:
    translate(-50%,-50%)
    scale(1.1);
}

.annct-girls{
  color:#fff;

  text-shadow:
    0 0 10px #d800ff,
    0 0 20px #d800ff,
    4px 4px 0 #000;
}

.annct-boys{
  color:#fff;

  text-shadow:
    0 0 10px #0066ff,
    0 0 20px #0066ff,
    4px 4px 0 #000;
}

/* =========================================================
   FEED
========================================================= */

.action-feed{
  position:absolute;

  bottom:20px;

  display:flex;
  flex-direction:column;

  gap:6px;

  z-index:25;

  pointer-events:none;
}

.action-feed-girls{
  left:15px;
}

.action-feed-boys{
  right:15px;
}

.feed-item{
  background:rgba(0,0,0,.65);

  padding:4px 10px;

  border-radius:4px;

  font:13px Arial,sans-serif;

  display:flex;
  align-items:center;

  gap:8px;

  text-align:left;

  animation:
    fadeIn .3s ease;
}

.feed-item-girl{
  border-left:3px solid #d800ff;
}

.feed-item-boy{
  border-left:3px solid #00d2ff;
}

.feed-gift-icon{
  width:22px;
  height:22px;

  object-fit:contain;
}

@keyframes fadeIn{

  from{
    opacity:0;
    transform:translateY(5px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

/* =========================================================
   BATTLE SCORE BAR
========================================================= */

.battle-scorebar{
  width:100%;
  max-width:960px;

  margin-top:10px;

  display:flex;

  justify-content:center;
  align-items:stretch;

  border:2px solid #2e2440;

  border-radius:10px;

  overflow:hidden;

  background:#0d0a13;

  box-shadow:
    0 5px 20px rgba(0,0,0,.45);
}

.battle-score-side{
  flex:1;

  min-width:0;

  padding:8px 14px;

  text-align:center;

  font-size:15px;

  letter-spacing:1px;
}

.battle-score-side.girls{
  background:
    linear-gradient(
      135deg,
      rgba(216,0,255,.28),
      rgba(138,28,166,.18)
    );
}

.battle-score-side.boys{
  background:
    linear-gradient(
      135deg,
      rgba(0,102,255,.18),
      rgba(0,210,255,.28)
    );
}

.battle-score-number{
  font-size:28px;

  line-height:1;

  font-weight:900;

  display:block;

  margin-top:3px;
}

.battle-score-center{
  display:flex;

  align-items:center;
  justify-content:center;

  padding:0 8px;

  font-size:16px;

  font-weight:900;

  background:#111;
}

/* =========================================================
   CONTROLS
========================================================= */

.controls-panel{
  width:100%;
  max-width:960px;

  margin-top:15px;

  background:#120e1a;

  border:1px solid #2e2440;

  border-radius:10px;

  padding:15px;

  display:flex;
  flex-direction:column;

  gap:12px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.5);
}

.controls-panel.hidden{
  display:none!important;
}

.button-group{
  display:flex;

  justify-content:center;

  gap:12px;

  flex-wrap:wrap;
}

.btn{
  padding:12px 24px;

  border:none;

  border-radius:8px;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

  letter-spacing:1px;

  transition:
    all .15s ease;

  box-shadow:
    0 4px 10px rgba(0,0,0,.4);
}

.btn:active{
  transform:scale(.95);
}

.btn-girl-hit{
  background:#8a1ca6;
  color:#fff;
}

.btn-girl-brutal{
  background:
    linear-gradient(
      135deg,
      #d800ff,
      #6200ea
    );

  color:#fff;

  border:1px solid #ff88ff;
}

.btn-boy-hit{
  background:#005bb5;
  color:#fff;
}

.btn-boy-brutal{
  background:
    linear-gradient(
      135deg,
      #0066ff,
      #0022cc
    );

  color:#fff;

  border:1px solid #44aaff;
}

.btn-util{
  background:#251d33;

  color:#ccc;

  border:1px solid #44355e;
}

/* =========================================================
   FULLSCREEN BUTTON
========================================================= */

.fullscreen-btn{
  position:fixed;

  right:14px;
  bottom:14px;

  z-index:999999;

  width:52px;
  height:52px;

  border:1px solid rgba(255,255,255,.25);

  border-radius:50%;

  background:rgba(0,0,0,.75);

  color:#fff;

  font-size:22px;

  cursor:pointer;

  display:flex;

  align-items:center;
  justify-content:center;

  box-shadow:
    0 4px 20px rgba(0,0,0,.7);
}

.secret-toggle-btn{
  position:absolute;

  bottom:8px;
  right:8px;

  width:24px;
  height:24px;

  background:transparent;

  border:none;

  color:rgba(255,255,255,.2);

  font-size:16px;

  cursor:pointer;

  z-index:120;
}

/* =========================================================
   SCREEN SHAKE
========================================================= */

.arena-hit{
  animation:
    screenShake
    .3s
    cubic-bezier(.36,.07,.19,.97)
    both;
}

.arena-brutality{
  animation:
    brutalShake
    .6s
    cubic-bezier(.36,.07,.19,.97)
    both;

  filter:
    sepia(.8)
    hue-rotate(-30deg)
    saturate(3)
    contrast(1.2);
}

@keyframes screenShake{

  0%,100%{
    transform:translate(0,0);
  }

  20%{
    transform:translate(-8px,5px);
  }

  40%{
    transform:translate(8px,-5px);
  }

  60%{
    transform:translate(-4px,2px);
  }

  80%{
    transform:translate(4px,-2px);
  }

}

@keyframes brutalShake{

  0%,100%{
    transform:
      translate(0,0)
      scale(1);
  }

  10%{
    transform:
      translate(-15px,10px)
      scale(1.05);
  }

  20%{
    transform:
      translate(15px,-10px)
      scale(1.05);
  }

  30%{
    transform:
      translate(-15px,-10px)
      scale(1.05);
  }

  40%{
    transform:
      translate(15px,10px)
      scale(1.05);
  }

  50%{
    transform:
      translate(-10px,5px)
      scale(1.02);
  }

  70%{
    transform:
      translate(10px,-5px)
      scale(1.01);
  }

}

/* =========================================================
   VIEWER MODE
========================================================= */

body.viewer-mode{
  padding:0;
  margin:0;

  width:100vw;
  height:100vh;

  min-height:100vh;

  overflow:hidden;

  background:#000;
}

body.viewer-mode .secret-hint,
body.viewer-mode .battle-scorebar,
body.viewer-mode .controls-panel,
body.viewer-mode #tiktok-debug{
  display:none!important;
}

body.viewer-mode .arena-wrapper{
  width:min(
    100vw,
    calc(100vh * 16 / 9)
  );

  height:min(
    100vh,
    calc(100vw * 9 / 16)
  );

  max-width:none;

  aspect-ratio:16/9;

  border:none;

  border-radius:0;

  box-shadow:none;

  margin:0;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  body{
    padding:8px;
  }

  .hud-top{
    top:10px;
    left:10px;
    right:10px;
  }

  .team-name{
    font-size:18px;
    padding:6px 10px;
  }

  .score-number{
    font-size:22px;
    padding:6px 10px;
    min-width:45px;
  }

  .gift-panel{
    padding:5px 7px;
    gap:3px;
  }

  .gift-item{
    font-size:9px;
    gap:5px;
  }

  .gift-icon{
    width:18px;
    height:18px;
  }

  .gift-name{
    font-size:8px;
  }

  .gift-points{
    font-size:10px;
  }

  .gift-action{
    font-size:9px;
  }

  .avatar-wrapper{
    height:55%;
    bottom:14%;
  }

  .character-change{
    font-size:27px;
    letter-spacing:1px;
  }

  .announcement{
    font-size:32px;
  }

  .feed-item{
    font-size:9px;
    padding:3px 6px;
  }

}

</style>
</head>

      alt="Boy Fighter">

  </div>


  <!-- WINNER ANNOUNCEMENT -->

  <div
    class="announcement"
    id="announcement-text">
  </div>


  <!-- FEEDS -->

  <div
    class="action-feed action-feed-girls"
    id="feed-girls">
  </div>

  <div
    class="action-feed action-feed-boys"
    id="feed-boys">
  </div>


  <!-- SECRET BUTTON -->

  <button
    class="secret-toggle-btn"
    onclick="toggleControls()">
    ⚙
  </button>

</div>


<!-- =========================================================
     FULLSCREEN
========================================================= -->

<button
  class="fullscreen-btn"
  onclick="startViewerMode()">
  ⛶
</button>


<!-- =========================================================
     SCORE BAR
========================================================= -->

<div
  class="battle-scorebar"
  id="battle-scorebar">

  <div class="battle-score-side girls">

    GIRLS

    <span
      class="battle-score-number"
      id="girl-battle-score">
      100
    </span>

  </div>


  <div class="battle-score-center">
    VS
  </div>


  <div class="battle-score-side boys">

    BOYS

    <span
      class="battle-score-number"
      id="boy-battle-score">
      100
    </span>

  </div>

</div>


<!-- =========================================================
     ADMIN CONTROLS
========================================================= -->

<div
  class="controls-panel"
  id="controls-panel">


  <div class="button-group">

    <button
      class="btn btn-girl-hit"
      onclick="attack('girl',false,null,'Rose',5)">
      🌹 Girls Rose (5)
    </button>


    <button
      class="btn btn-girl-brutal"
      onclick="attack('girl',true,null,'Rosa',50)">
      🌹 Girls Rosa (50)
    </button>


    <button
      class="btn btn-boy-hit"
      onclick="attack('boy',false,null,'TikTok',5)">
      🎵 Boys TikTok (5)
    </button>


    <button
      class="btn btn-boy-brutal"
      onclick="attack('boy',true,null,'Necklace',50)">
      💎 Boys Necklace (50)
    </button>

  </div>


  <div class="button-group">

    <button
      class="btn btn-util"
      onclick="switchCharacter('girl',null,'Bouquet')">
      💐 Switch Girl
    </button>


    <button
      class="btn btn-util"
      onclick="switchCharacter('boy',null,'Confetti')">
      🎉 Switch Boy
    </button>


    <button
      class="btn btn-util"
      onclick="resetMatch()">
      ⚡ Reset Match
    </button>


    <button
      class="btn btn-util"
      onclick="resetScores()">
      🔄 Zero Scores
    </button>


    <button
      class="btn btn-util"
      onclick="toggleControls()">
      👁 Hide Controls
    </button>

  </div>

</div>


<!-- =========================================================
     MUSIC
========================================================= -->

<audio
  id="battle-background-music"
  preload="auto"
  playsinline>
</audio>


<!-- =========================================================
     MAIN JAVASCRIPT
========================================================= -->

<script>

/* =========================================================
   GAME VARIABLES
========================================================= */

let linePosition = 100;

let girlWins = 0;
let boyWins = 0;

let isMatchActive = true;


/* =========================================================
   GIRL CHARACTERS
========================================================= */

const girlCharacters = [

  {
    name:"KITANA",
    idle:"./kitana_idle.png",
    attack:"./kitana_attack.png"
  },

  {
    name:"MILEENA",
    idle:"./mileena_idle.png",
    attack:"./mileena_attack.png"
  },

  {
    name:"JADE",
    idle:"./jade_idle.png",
    attack:"./jade_attack.png"
  }

];


/* =========================================================
   BOY CHARACTERS
========================================================= */

const boyCharacters = [

  {
    name:"SUB-ZERO",
    idle:"./subzero_idle.png",
    attack:"./subzero_attack.png"
  },

  {
    name:"SCORPION",
    idle:"./scorpion_idle.png",
    attack:"./scorpion_attack.png"
  },

  {
    name:"LIU KANG",
    idle:"./liukang_idle.png",
    attack:"./liukang_attack.png"
  }

];


let currentGirlIndex = 0;
let currentBoyIndex = 0;


/* =========================================================
   RANDOM USERNAME
========================================================= */

function getRandomUsername(){

  const names = [

    "shadow",
    "kombat",
    "ghost",
    "ninja",
    "gamer",
    "pro",
    "alpha",
    "toxic",
    "queen",
    "king",
    "guest",
    "user"

  ];

  const name =
    names[
      Math.floor(
        Math.random() *
        names.length
      )
    ];

  const suffix =
    Math.floor(
      Math.random() * 99999
    );

  return name + suffix;
}


/* =========================================================
   UPDATE VISUALS
========================================================= */

function updateVisuals(){

  let displayPosition =
    linePosition;

  if(displayPosition > 200){
    displayPosition = 200;
  }

  if(displayPosition < 0){
    displayPosition = 0;
  }


  const visualPercentage =
    displayPosition / 2;


  document.getElementById(
    "bg-girls"
  ).style.width =
    visualPercentage + "%";


  document.getElementById(
    "bg-boys"
  ).style.width =
    (100 - visualPercentage) + "%";


  document.getElementById(
    "center-line"
  ).style.left =
    visualPercentage + "%";


  document.getElementById(
    "wrap-girl"
  ).style.left =
    visualPercentage + "%";


  document.getElementById(
    "wrap-boy"
  ).style.left =
    visualPercentage + "%";


  document.getElementById(
    "girl-battle-score"
  ).innerText =
    Math.round(displayPosition);


  document.getElementById(
    "boy-battle-score"
  ).innerText =
    200 -
    Math.round(displayPosition);

}


/* =========================================================
   SCREEN SHAKE
========================================================= */

function triggerAnimation(
  isBrutality
){

  const arena =
    document.getElementById(
      "arena"
    );


  arena.classList.remove(
    "arena-hit",
    "arena-brutality"
  );


  void arena.offsetWidth;


  arena.classList.add(

    isBrutality
      ? "arena-brutality"
      : "arena-hit"

  );

}


/* =========================================================
   CHARACTER CHANGED MESSAGE
========================================================= */

function showCharacterChanged(
  side
){

  const arena =
    document.getElementById(
      "arena"
    );


  const message =
    document.createElement(
      "div"
    );


  message.className =
    "character-change " +
    (
      side === "girl"
        ? "girl"
        : "boy"
    );


  message.innerText =
    "CHARACTER CHANGED";


  arena.appendChild(
    message
  );


  setTimeout(
    function(){

      message.remove();

    },
    950
  );

}


/* =========================================================
   ATTACK
========================================================= */

function attack(

  attacker,

  isBrutality,

  username = null,

  giftName = "",

  customPower = null,

  actionLabel = ""

){

  if(!isMatchActive){
    return;
  }


  if(
    !username ||
    username === "Unknown"
  ){

    username =
      getRandomUsername();

  }


  const defaultPower =
    isBrutality
      ? 50
      : 5;


  const suppliedPower =
    Number(customPower);


  const powerPush =

    Number.isFinite(
      suppliedPower
    ) &&
    suppliedPower > 0

      ? suppliedPower

      : defaultPower;


  const feedAction =

    actionLabel ||
    giftName ||
    (
      isBrutality
        ? "Brutality"
        : "Hit"
    );


  /* GIRLS */

  if(attacker === "girl"){

    linePosition +=
      powerPush;


    addFeed(
      "girl",
      username,
      feedAction
    );


    animateCharacter(
      "girl"
    );

  }


  /* BOYS */

  else{

    linePosition -=
      powerPush;


    addFeed(
      "boy",
      username,
      feedAction
    );


    animateCharacter(
      "boy"
    );

  }


  updateVisuals();


  triggerAnimation(
    isBrutality
  );


  checkWinner();

}


/* =========================================================
   WINNER
========================================================= */

function checkWinner(){

  const announcement =
    document.getElementById(
      "announcement-text"
    );


  /* GIRLS WIN */

  if(linePosition >= 200){

    girlWins++;


    document.getElementById(
      "girl-wins"
    ).innerText =
      girlWins;


    isMatchActive =
      false;


    announcement.className =
      "announcement annct-girls active";


    announcement.innerText =
      "GIRLS WIN!";


    setTimeout(
      function(){

        announcement.classList.remove(
          "active"
        );

        resetMatch();

      },
      900
    );

  }


  /* BOYS WIN */

  else if(linePosition <= 0){

    boyWins++;


    document.getElementById(
      "boy-wins"
    ).innerText =
      boyWins;


    isMatchActive =
      false;


    announcement.className =
      "announcement annct-boys active";


    announcement.innerText =
      "BOYS WIN!";


    setTimeout(
      function(){

        announcement.classList.remove(
          "active"
        );

        resetMatch();

      },
      900
    );

  }

}


/* =========================================================
   CHARACTER ATTACK ANIMATION
========================================================= */

function animateCharacter(
  fighter
){

  const isGirl =
    fighter === "girl";


  const imgEl =
    document.getElementById(

      isGirl
        ? "avatar-girl"
        : "avatar-boy"

    );


  const charData =

    isGirl

      ? girlCharacters[
          currentGirlIndex
        ]

      : boyCharacters[
          currentBoyIndex
        ];


  imgEl.src =
    charData.attack;


  imgEl.style.transform =

    isGirl

      ? "scale(1.1) translateX(15px)"

      : "scale(1.1) translateX(-15px)";


  setTimeout(
    function(){

      imgEl.src =
        charData.idle;


      imgEl.style.transform =
        "scale(1) translateX(0)";

    },
    600
  );

}


/* =========================================================
   CHARACTER SWITCH
=========================================================

   BOUQUET  = GIRL CHARACTER CHANGE
   CONFETTI = BOY CHARACTER CHANGE

   IMPORTANT:
   NO GIFT IMAGE POPUP HERE.
========================================================= */

function switchCharacter(

  side,

  username = null,

  giftName = null

){

  if(
    !username ||
    username === "@Admin"
  ){

    username =
      getRandomUsername();

  }


  /* =======================================================
     GIRL
  ====================================================== */

  if(side === "girl"){

    currentGirlIndex =

      (
        currentGirlIndex + 1
      ) %
      girlCharacters.length;


    const char =
      girlCharacters[
        currentGirlIndex
      ];


    document.getElementById(
      "girl-name-label"
    ).innerText =
      char.name;


    const girlAvatar =
      document.getElementById(
        "avatar-girl"
      );


    girlAvatar.src =
      char.idle;


    girlAvatar.style.transform =
      "scale(1) translateX(0)";


    /* ONLY TEXT NOW */

    showCharacterChanged(
      "girl"
    );


    /* FEED */

    addFeed(
      "girl",
      username,
      giftName || "Bouquet",
      "./icon_bouquet.png"
    );

  }


  /* =======================================================
     BOY
  ====================================================== */

  else{

    currentBoyIndex =

      (
        currentBoyIndex + 1
      ) %
      boyCharacters.length;


    const char =
      boyCharacters[
        currentBoyIndex
      ];


    document.getElementById(
      "boy-name-label"
    ).innerText =
      char.name;


    const boyAvatar =
      document.getElementById(
        "avatar-boy"
      );


    boyAvatar.src =
      char.idle;


    boyAvatar.style.transform =
      "scale(1) translateX(0)";


    /* ONLY TEXT NOW */

    showCharacterChanged(
      "boy"
    );


    /* FEED */

    addFeed(
      "boy",
      username,
      giftName || "Confetti",
      "./icon_confetti.png"
    );

  }

}


/* =========================================================
   FEED
========================================================= */

function addFeed(

  side,

  user,

  gift,

  giftImage = null

){

  const feed =
    document.getElementById(

      side === "girl"
        ? "feed-girls"
        : "feed-boys"

    );


  const item =
    document.createElement(
      "div"
    );


  item.className =

    "feed-item " +

    (
      side === "girl"
        ? "feed-item-girl"
        : "feed-item-boy"
    );


  const nameColor =

    side === "girl"

      ? "#e855ff"

      : "#00d2ff";


  let iconHTML = "";


  if(giftImage){

    iconHTML =

      `<img
        class="feed-gift-icon"
        src="${giftImage}"
        alt="">`;

  }


  item.innerHTML =

    `${iconHTML}

     <span
       style="
       color:${nameColor};
       font-weight:bold">
       ${user}
     </span>

     <span>
       sent
     </span>

     <span>
       ${gift}
     </span>`;


  feed.appendChild(
    item
  );


  while(
    feed.children.length > 3
  ){

    feed.removeChild(
      feed.children[0]
    );

  }

}


/* =========================================================
   RESET MATCH
========================================================= */

function resetMatch(){

  linePosition = 100;

  isMatchActive = true;

  updateVisuals();

}


/* =========================================================
   RESET SCORES
========================================================= */

function resetScores(){

  resetMatch();

  girlWins = 0;
  boyWins = 0;


  document.getElementById(
    "girl-wins"
  ).innerText = "0";


  document.getElementById(
    "boy-wins"
  ).innerText = "0";

}


/* =========================================================
   CONTROLS
========================================================= */

function toggleControls(){

  document
    .getElementById(
      "controls-panel"
    )
    .classList.toggle(
      "hidden"
    );

}


window.addEventListener(
  "keydown",
  function(e){

    if(
      e.key.toLowerCase() === "h"
    ){

      toggleControls();

    }

  }
);


/* =========================================================
   VIEWER MODE
========================================================= */

async function startViewerMode(){

  if(
    typeof unlockBattleVoice ===
    "function"
  ){

    unlockBattleVoice();

  }


  if(
    typeof startBattleMusic ===
    "function"
  ){

    startBattleMusic();

  }


  const arena =
    document.getElementById(
      "arena"
    );


  document.body.classList.add(
    "viewer-mode"
  );


  try{

    if(
      !document.fullscreenElement &&
      arena.requestFullscreen
    ){

      await arena.requestFullscreen();

    }

  }

  catch(error){

    console.log(
      "Fullscreen request blocked:",
      error
    );

  }


  try{

    if(
      screen.orientation &&
      screen.orientation.lock
    ){

      await screen.orientation.lock(
        "landscape"
      );

    }

  }

  catch(error){

    console.log(
      "Landscape lock unavailable"
    );

  }

}


/* =========================================================
   FULLSCREEN CHANGE
========================================================= */

document.addEventListener(
  "fullscreenchange",
  function(){

    if(
      !document.fullscreenElement
    ){

      document.body.classList.remove(
        "viewer-mode"
      );

    }

  }
);


/* =========================================================
   IMAGE ERROR DEBUGGING
========================================================= */

function setupImageDebug(){

  const images =
    document.querySelectorAll(
      "img"
    );


  images.forEach(
    function(img){

      img.addEventListener(
        "error",
        function(){

          console.warn(
            "IMAGE NOT FOUND:",
            img.src
          );

        }
      );

    }
  );


  const girlBackground =
    document.getElementById(
      "bg-girls"
    );


  const boyBackground =
    document.getElementById(
      "bg-boys"
    );


  const testGirl =
    new Image();


  testGirl.onload =
    function(){

      console.log(
        "🟣 GIRLS BACKGROUND OK"
      );

    };


  testGirl.onerror =
    function(){

      console.error(
        "❌ GIRLS BACKGROUND NOT FOUND: ./girls.jpg"
      );

    };


  testGirl.src =
    "./girls.jpg";


  const testBoy =
    new Image();


  testBoy.onload =
    function(){

      console.log(
        "🔵 BOYS BACKGROUND OK"
      );

    };


  testBoy.onerror =
    function(){

      console.error(
        "❌ BOYS BACKGROUND NOT FOUND: ./boys.jpg"
      );

    };


  testBoy.src =
    "./boys.jpg";

}


/* =========================================================
   START
========================================================= */

updateVisuals();

setupImageDebug();

</script>
